        description: "Campo único da API com links de redes sociais (texto ou JSON)."
      - name: data_nascimento
        description: "Data de nascimento."
      - name: data_falecimento
        description: "Data de falecimento, quando houver."
      - name: uf_nascimento
        description: "UF de nascimento."
      - name: uf_municipio_nascimento
        description: "Município de nascimento."
      - name: escolaridade
        description: "Grau de escolaridade informado."
      - name: email
        description: "E-mail institucional — COALESCE de ultimostatus_email e ultimostatus_gabinete_email."
      - name: loaded_at_utc
        description: "Data/hora (UTC) de ingestão do registro na camada raw."
