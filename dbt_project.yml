
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'my_datawarehouse'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'my_datawarehouse'

vars:
  "dbt_date:time_zone": "America/Sao_Paulo"

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this example config, we tell dbt to build all models in the example/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
models:
  my_datawarehouse:
    # Config indicated by + and applies to all files under models/example/
    staging:
      +materialized: table
      +schema: staging
      nhl:
        +enabled: false
    intermediate:
      +materialized: view
      +schema: intermediate
      nhl:
        +enabled: false
    marts:
      +materialized: table
      +schema: marts

# Tipos fixados nas seeds de investimentos faltantes: sem isso o dbt infere o
# tipo da coluna a partir do conteúdo, e uma coluna de data inteiramente vazia
# (data_emissao da Jéssica) vira `integer` — quebrando o UNION de
# int_renda_fixa_loop contra as seeds do Lucas e da Deusa, onde ela é `date`.
seeds:
  my_datawarehouse:
    investimentos_faltantes_lucas:
      +column_types:
        mes_base: date
        data_emissao: date
        data_vencimento: date
    investimentos_faltantes_jessica:
      +column_types:
        mes_base: date
        data_emissao: date
        data_vencimento: date
    investimentos_faltantes_deusa:
      +column_types:
        mes_base: date
        data_emissao: date
        data_vencimento: date
