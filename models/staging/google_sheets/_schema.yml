  - name: stg_luz
    description: "Conta de energia por mês, lida da planilha."
    columns:
      - name: vlr_fatura
        description: "Valor da fatura de energia, em reais."
      - name: kwh
        description: "Consumo de energia no período, em kWh."
      - name: dias
        description: "Dias do período de faturamento."
      - name: kwh_dia
        description: "Consumo médio diário, em kWh."
      - name: preco_kwh
        description: "Preço médio por kWh, em reais."
      - name: mes
        description: "Primeiro dia do mês de referência da conta."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: stg_carteira_classificacao
    description: >
      Camada de alocação digitada à mão na aba classificacao da planilha, uma linha por ativo que se
      tem hoje. É estado atual, sem vigência.
    columns:
      - name: pessoa
        description: "Titular (lucas, jessica ou deusa)."
        data_tests:
          - not_null
      - name: instituicao
        description: "Corretora, banco ou custodiante, com nome padronizado."
        data_tests:
          - not_null
      - name: classe_ativo
        description: "Classe do ativo (RENDA FIXA, RENDA VARIAVEL ou DISPONIBILIDADE)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['RENDA FIXA', 'RENDA VARIAVEL', 'DISPONIBILIDADE']
      - name: codigo_ativo
        description: "Código do ativo na fonte (ticker B3, ISIN do Tesouro, CUSIP da Avenue ou código sintético da conta)."
        data_tests:
          - not_null
      - name: ativo
        description: "Nome do ativo, só para leitura na planilha."
      - name: data_vencimento
        description: "Data de vencimento do título (só renda fixa)."
      - name: moeda_ativo
        description: "Moeda de origem do ativo (BRL, USD ou BTC)."
      - name: camada
        description: >
          Camada atribuída à mão, em maiúsculas; NAO CLASSIFICADO não se digita, é o default da carteira.
          {{ doc('camada_investimento') }}
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['RESERVA', 'CRESCIMENTO', 'RENDA', 'RESERVA ESTRATEGICA']
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: stg_ajuste
    description: "Compensação mensal das despesas conjuntas por titular, lida da planilha."
    columns:
      - name: mes
        description: "Primeiro dia do mês das despesas compensadas."
        data_tests:
          - not_null
      - name: ajuste_realizado
        description: '{{ doc("ajuste") }}'
        data_tests:
          - not_null
      - name: pessoa
        description: "Titular que recebeu o ajuste."
        data_tests:
          - not_null
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."
