      - name: dividendos
        description: "Receita de dividendos no mês, em reais."
      - name: outros
        description: "Outras receitas no mês, em reais."
      - name: receita_total
        description: "Receita total do mês, em reais."
      - name: mercado
        description: '{{ doc("categoria_mercado") }}'
      - name: diversos
        description: '{{ doc("categoria_diversos") }}'
      - name: assinaturas
        description: '{{ doc("categoria_assinaturas") }}'
      - name: role
        description: '{{ doc("categoria_role") }}'
      - name: transporte
        description: '{{ doc("categoria_transporte") }}'
      - name: apartamento
        description: '{{ doc("categoria_apartamento") }}'
      - name: saude
        description: '{{ doc("categoria_saude") }}'
      - name: educacao
        description: '{{ doc("categoria_educacao") }}'
      - name: despesas_total
        description: "Despesa total do mês, em reais."
      - name: resultado
        description: "Receita total menos despesa total do mês, em reais."
      - name: pessoa
        description: "Titular (jessica)."
      - name: mes_fatura
        description: "Primeiro dia do mês da fatura."
      - name: mes_debito
        description: "Primeiro dia do mês de competência."
