version: 2

models:
  - name: stg_patrimonio
    description: "Patrimônio do casal, saldos por conta e indexadores do mês, lidos da planilha; um registro por mês-base."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base."
      - name: total_patrimonio_bruto
        description: "Patrimônio bruto total do casal no mês, em reais."
      - name: total_patrimonio_liquido
        description: "Patrimônio líquido total do casal no mês, em reais."
      - name: patrimonio_liquido_lucas
        description: "Patrimônio líquido de Lucas no mês, em reais."
      - name: saldo_bradesco_lucas
        description: "Saldo em conta corrente Bradesco (Lucas), em reais."
      - name: saldo_nubank_lucas
        description: "Saldo em conta corrente Nubank (Lucas), em reais."
      - name: bradesco_investimentos_lucas
        description: "Saldo em investimentos Bradesco (Lucas), em reais."
      - name: nubank_investimentos_lucas
        description: "Saldo em investimentos Nubank (Lucas), em reais."
      - name: saldo_nubank_cashback_lucas
        description: "Saldo de cashback Nubank (Lucas), em reais."
      - name: saldo_bitcoin_lucas
        description: "Saldo em bitcoin (Lucas), em reais."
      - name: daycoval_lucas
        description: "Saldo em investimentos Daycoval (Lucas), em reais."
      - name: avenue_lucas
        description: "Saldo na Avenue (Lucas), em reais."
      - name: saldo_wise_lucas
        description: "Saldo na Wise (Lucas), em reais."
      - name: patrimonio_liquido_jessica
        description: "Patrimônio líquido de Jéssica no mês, em reais."
      - name: saldo_banco_brasil_jessica
        description: "Saldo em conta corrente Banco do Brasil (Jéssica), em reais."
      - name: saldo_nubank_jessica
        description: "Saldo em conta corrente Nubank (Jéssica), em reais."
      - name: sofisa_investimentos_jessica
        description: "Saldo em investimentos Sofisa (Jéssica), em reais."
      - name: itau_investimentos_jessica
        description: "Saldo em investimentos Itaú (Jéssica), em reais."
      - name: nubank_investimentos_jessica
        description: "Saldo em investimentos Nubank (Jéssica), em reais."
      - name: avenue_jessica
        description: "Saldo na Avenue (Jéssica), em reais."
      - name: vlr_carro
        description: "Valor de mercado do carro pela tabela Fipe, em reais."
      - name: minha_inflacao
        description: "Inflação pessoal do mês (cesta própria), em fração decimal."
      - name: ipca
        description: "IPCA do mês, em fração decimal."
      - name: igpm
        description: "IGP-M do mês, em fração decimal."
      - name: selic
        description: "Selic do mês, em fração decimal."
      - name: cdi
        description: "CDI do mês, em fração decimal."
      - name: minha_inflacao_acum
        description: "Índice acumulado (base 1) da inflação pessoal."
      - name: ipca_acum
        description: "Índice acumulado (base 1) do IPCA."
      - name: igpm_acum
        description: "Índice acumulado (base 1) do IGP-M."
      - name: selic_acum
        description: "Índice acumulado (base 1) da Selic."
      - name: cdi_acum
        description: "Índice acumulado (base 1) do CDI."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: stg_patrimonio_deusa
