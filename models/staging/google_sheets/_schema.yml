  - name: stg_carteira_classificacao
    description: >
      Classificação manual de camada por posição, lida de volta da planilha Google (metade de
      leitura do loop de retroalimentação). É um cadastro de ESTADO ATUAL, não um histórico: uma
      linha por ativo que se tem hoje, sem coluna de vigência. A aba já teve `mes_base` e o
      downstream resolvia a camada por join as-of (SCD2); a coluna saiu da origem, então o lookup
      passou a ser direto e meses passados carregam a classificação de hoje.
      Alimenta o campo `camada` do mart `carteira` (e por tabela dos três `carteira_<pessoa>`) por
      join em pessoa + codigo_ativo + instituicao. Sem linha correspondente, o default aplicado
      lá é 'NAO CLASSIFICADO'.
    columns:
      - name: pessoa
        description: "Dono do ativo (lucas / jessica / deusa), em minúsculas. Parte da chave de join com a carteira."
        data_tests:
          - not_null
      - name: instituicao
        description: "Instituição onde o ativo está posicionado, na mesma grafia padronizada que a macro normaliza_instituicao produz. Parte da chave de join com a carteira."
        data_tests:
          - not_null
      - name: classe_ativo
        description: "Classe do ativo (RENDA FIXA, RENDA VARIAVEL ou DISPONIBILIDADE)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['RENDA FIXA', 'RENDA VARIAVEL', 'DISPONIBILIDADE']
      - name: codigo_ativo
        description: "Código do ativo na fonte (ticker B3, ISIN do tesouro, CUSIP da Avenue, código sintético da conta corrente). Parte da chave de join com a carteira — e a parte que efetivamente identifica a posição."
        data_tests:
          - not_null
      - name: ativo
        description: "Nome do ativo, para leitura humana na planilha. Não entra na chave de join: o nome muda de grafia entre fontes, o código não."
      - name: data_vencimento
        description: "Data de vencimento do título, quando houver. Nula em renda variável e conta corrente. Chega como texto e é convertida aqui; string vazia vira NULL."
      - name: moeda_ativo
        description: "Moeda de origem do ativo (BRL, USD ou BTC)."
      - name: camada
        description: >
          Camada de alocação atribuída manualmente na planilha, em MAIÚSCULAS. Só estes quatro
          valores são aceitos — o teste abaixo falha em qualquer outro, inclusive na variação em
          minúsculas. 'NAO CLASSIFICADO' não entra aqui: é o default que o downstream aplica a
          quem ainda não tem linha nesta aba, não algo que se digite.
          Significado de cada camada: {{ doc('camada_investimento') }}
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['RESERVA', 'CRESCIMENTO', 'RENDA', 'RESERVA ESTRATEGICA']
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."


