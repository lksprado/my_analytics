version: 2

models:
  - name: stg_investimentos_faltantes_lucas
    description: "Posições reais de Lucas que nenhum relatório traz, cadastradas à mão; uma linha por ativo e mês-base."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base."
      - name: pessoa
        description: "Titular (lucas)."
      - name: instituicao
        description: "Corretora, banco ou custodiante, com nome padronizado."
      - name: emissor
        description: "Instituição emissora do título (só renda fixa)."
        meta:
          source_column: "emissor"
      - name: classe_ativo
        description: "Classe do ativo (RENDA FIXA, RENDA VARIAVEL ou DISPONIBILIDADE)."
      - name: tipo_ativo
        description: "Tipo do ativo (ACAO, FUNDO, TITULO PUBLICO, TITULO PRIVADO ou CONTA CORRENTE)."
      - name: codigo_ativo
        description: "Código do ativo na seed (ex.: RDB100CAIX00)."
      - name: ativo
        description: "Nome do ativo."
      - name: indexador
        description: "Indexador de rentabilidade (ex.: CDI, IPCA, PREFIXADO)."
      - name: data_emissao
        description: "Data de emissão do título; vazia nas linhas antigas."
      - name: data_vencimento
        description: "Data de vencimento do título (só renda fixa)."
      - name: vlr_atualizado_brl
        description: "Valor de mercado da posição, em reais."
      - name: moeda_ativo
        description: "Moeda do ativo (BRL)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

