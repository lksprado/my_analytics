  - name: stg_usd
    description: "Cotação de venda do dólar no último dia útil de cada mês, um registro por mês."
    columns:
      - name: data_referencia
        description: "Último dia do mês de referência."
      - name: vlr_usd
        description: "Cotação de venda do dólar no último dia útil do mês, em reais."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: stg_de_para_instituicoes_fgc
    description: "De-para de instituição emissora para conglomerado financeiro do FGC, uma linha por instituição."
    columns:
      - name: instituicao
        description: "Nome da instituição emissora, sem sufixo societário nem pontuação."
      - name: conglomerado
        description: "Conglomerado financeiro FGC ao qual a instituição pertence."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: stg_datas_especiais
    description: >
      Datas especiais da família (aniversários e efemérides), um registro por evento recorrente
      por dia e mês. Explicam picos de gasto em role e diversos.
    columns:
      - name: dia
        description: "Dia do mês em que o evento cai (1-31)."
      - name: mes_num
        description: "Mês do evento (1-12)."
      - name: ano_inicio
        description: "Primeiro ano em que o evento vale; nulo quando vale para toda a série."
      - name: motivo
        description: "Descrição do evento, em maiúsculas."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."
