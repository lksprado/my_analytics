version: 2

models:
  - name: stg_atacadao
    description: "Preços do Atacadão (seed histórico + scraper atual) por SKU e data de extração, com unidade e quantidade extraídas do nome do produto. Só as categorias de supermercado; linhas sem unidade reconhecível ficam de fora."
    columns:
      - name: created_date
        description: "Data da extração."
        data_tests:
          - not_null
      - name: sku
        data_tests:
          - not_null
      - name: product_unity
        description: "Trecho do nome do produto que informa a quantidade, ex.: '500g', '2 litros', '12 un'."
      - name: unit_normalized
        data_tests:
          - accepted_values:
              arguments:
                values: ['kilogram', 'gram', 'litre', 'millilitre', 'unit']
      - name: unity_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['weight', 'volume', 'unit', 'unknown']
      - name: unity_value
        description: "Número em product_unity, na unidade original."
      - name: unity_value_normalized
        description: "unity_value convertido para g, ml ou un."
