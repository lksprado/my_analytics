version: 2

models:
  - name: stg_weather_daily
    description: "Condições climáticas diárias com métricas de temperatura, umidade, vento, pressão e precipitação."
    columns:
      - name: weather_date
        description: "Data de referência das métricas climáticas diárias."
        data_tests:
          - unique
          - not_null
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."
