      - name: nome
        description: "Nome parlamentar."
        meta:
          source_column: "identificacaoparlamentar_nomeparlamentar"
      - name: nome_completo
        description: "Nome civil completo."
        meta:
          source_column: "identificacaoparlamentar_nomecompletoparlamentar"
      - name: sexo
        description: "Sexo (MASCULINO, FEMININO)."
        meta:
          source_column: "identificacaoparlamentar_sexoparlamentar"
      - name: forma_tratamento
        description: "Forma de tratamento (SENADOR, SENADORA)."
        meta:
          source_column: "identificacaoparlamentar_formatratamento"
      - name: email
        description: "E-mail institucional."
        meta:
          source_column: "identificacaoparlamentar_emailparlamentar"
      - name: telefones_telefone
        description: "Lista de telefones do gabinete, com número, ordem de publicação e indicador de fax."
        meta:
          source_column: "identificacaoparlamentar_telefones_telefone"
      - name: sigla_partido
        description: "Sigla do partido atual."
        meta:
          source_column: "identificacaoparlamentar_siglapartidoparlamentar"
      - name: uf
        description: "UF representada."
        meta:
          source_column: "identificacaoparlamentar_ufparlamentar"
