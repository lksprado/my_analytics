          source_column: "identificacaoparlamentar_bloco_codigobloco"
      - name: bloco_nome_bloco
        description: "Nome do bloco parlamentar."
        meta:
          source_column: "identificacaoparlamentar_bloco_nomebloco"
      - name: bloco_nome_apelido
        description: "Apelido do bloco parlamentar (ex.: BLALIANCA)."
        meta:
          source_column: "identificacaoparlamentar_bloco_nomeapelido"
      - name: membro_mesa
        description: "SIM quando o senador integra a Mesa do Senado."
        meta:
          source_column: "identificacaoparlamentar_membromesa"
      - name: membro_lideranca
        description: "SIM quando o senador exerce liderança."
        meta:
          source_column: "identificacaoparlamentar_membrolideranca"
      - name: mandato_codigomandato
        description: "Código do mandato."
        meta:
          source_column: "mandato_codigomandato"
      - name: mandato_ufparlamentar
        description: "UF do mandato."
        meta:
          source_column: "mandato_ufparlamentar"
      - name: mandato_primeiralegislaturadomandato_numerolegislatura
        description: "Número da primeira legislatura do mandato de oito anos."
        meta:
          source_column: "mandato_primeiralegislaturadomandato_numerolegislatura"
      - name: mandato_segundalegislaturadomandato_numerolegislatura
        description: "Número da segunda legislatura do mandato de oito anos."
        meta:
          source_column: "mandato_segundalegislaturadomandato_numerolegislatura"
      - name: mandato_descricaoparticipacao
        description: "Participação no mandato (TITULAR, 1O SUPLENTE, 2O SUPLENTE)."
        meta:
          source_column: "mandato_descricaoparticipacao"
      - name: mandato_suplentes_suplente
        description: "Lista dos suplentes do mandato, com participação, código e nome."
        meta:
          source_column: "mandato_suplentes_suplente"
      - name: mandato_exercicios_exercicio
        description: "Lista dos períodos de exercício no mandato, com código e datas."
        meta:
          source_column: "mandato_exercicios_exercicio"
      - name: identificacaoparlamentar_bloco_datacriacao
        description: "Data de criação do bloco parlamentar."
        meta:
          source_column: "identificacaoparlamentar_bloco_datacriacao"
      - name: mandato_primeiralegislaturadomandato_datainicio
        description: "Início da primeira legislatura do mandato."
        meta:
          source_column: "mandato_primeiralegislaturadomandato_datainicio"
      - name: mandato_primeiralegislaturadomandato_datafim
        description: "Fim da primeira legislatura do mandato."
        meta:
          source_column: "mandato_primeiralegislaturadomandato_datafim"
      - name: mandato_segundalegislaturadomandato_datainicio
        description: "Início da segunda legislatura do mandato."
        meta:
          source_column: "mandato_segundalegislaturadomandato_datainicio"
      - name: mandato_segundalegislaturadomandato_datafim
        description: "Fim da segunda legislatura do mandato."
        meta:
          source_column: "mandato_segundalegislaturadomandato_datafim"
      - name: mandato_titular_descricaoparticipacao
        description: "Participação do titular (TITULAR) quando o senador em exercício é suplente; nula se ele é o titular."
        meta:
          source_column: "mandato_titular_descricaoparticipacao"
      - name: mandato_titular_codigoparlamentar
        description: "Código do titular quando o senador em exercício é suplente; nulo se ele é o titular."
        meta:
          source_column: "mandato_titular_codigoparlamentar"
      - name: mandato_titular_nomeparlamentar
        description: "Nome do titular quando o senador em exercício é suplente; nulo se ele é o titular."
        meta:
          source_column: "mandato_titular_nomeparlamentar"
      - name: loaded_at_utc
        description: "Data/hora (UTC) de ingestão do registro na camada raw."
        meta:
          source_column: "loaded_at_utc"
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

