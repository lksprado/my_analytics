version: 2

models:

  - name: stg_senado_senadores
    description: "Senadores em exercício. Grão: um senador."
    columns:
      - name: senador_id_nk
        description: "Chave natural do senador na API do Senado."
      - name: codigo_publico_na_leg_atual
        description: "Código público do senador na legislatura atual."
      - name: nome
        description: "Nome parlamentar do senador."
      - name: nome_completo
        description: "Nome civil completo do senador."
      - name: sexo
        description: "Sexo informado no cadastro (M/F)."
      - name: forma_tratamento
        description: "Forma de tratamento do senador (ex: Senador, Senadora)."
      - name: email
        description: "E-mail institucional do senador."
      - name: telefones_telefone
        description: "Telefone(s) do gabinete em formato semi-estruturado."
      - name: sigla_partido
        description: "Sigla do partido no momento mais recente da carga."
      - name: uf
        description: "UF representada pelo senador."
      - name: bloco_codigo_bloco
        description: "Código do bloco parlamentar ao qual o senador pertence."
      - name: bloco_nome_bloco
        description: "Nome do bloco parlamentar."
      - name: bloco_nome_apelido
        description: "Nome/apelido do bloco parlamentar."
      - name: membro_mesa
        description: "Indica se o senador é membro da Mesa Diretora."
      - name: membro_lideranca
        description: "Indica se o senador exerce função de liderança."
      - name: mandato_codigomandato
        description: "Código identificador do mandato."
      - name: mandato_ufparlamentar
        description: "UF do mandato (pode diferir da UF de identificação)."
      - name: mandato_primeiralegislaturadomandato_numerolegislatura
        description: "Número da primeira legislatura coberta pelo mandato."
      - name: mandato_segundalegislaturadomandato_numerolegislatura
        description: "Número da segunda legislatura coberta pelo mandato."
      - name: mandato_descricaoparticipacao
        description: "Condição no mandato (TITULAR, SUPLENTE)."
      - name: mandato_suplentes_suplente
        description: "Dados do(s) suplente(s) do senador em formato semi-estruturado."
      - name: mandato_exercicios_exercicio
        description: "Períodos de exercício do mandato (JSON)."
      - name: identificacaoparlamentar_bloco_datacriacao
        description: "Data de criação do bloco parlamentar."
      - name: mandato_primeiralegislaturadomandato_datainicio
        description: "Data de início da primeira legislatura do mandato."
      - name: mandato_primeiralegislaturadomandato_datafim
        description: "Data de fim da primeira legislatura do mandato."
      - name: mandato_segundalegislaturadomandato_datainicio
        description: "Data de início da segunda legislatura do mandato."
      - name: mandato_segundalegislaturadomandato_datafim
        description: "Data de fim da segunda legislatura do mandato."
      - name: mandato_titular_descricaoparticipacao
        description: "Participação do titular do mandato; nula se o senador é titular."
      - name: mandato_titular_codigoparlamentar
        description: "Código do titular do mandato; nulo se o senador é titular."
      - name: mandato_titular_nomeparlamentar
        description: "Nome do titular do mandato; nulo se o senador é titular."
      - name: loaded_at_utc
        description: "Data/hora (UTC) de ingestão do registro na camada raw."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: stg_senado_legislaturas
    description: "Senadores por legislatura. Grão: senador × legislatura."
    columns:
      - name: senador_id_nk
        description: "Chave natural do senador na API do Senado."
      - name: nome
        description: "Nome parlamentar do senador (upper)."
      - name: nome_completo
        description: "Nome completo do senador (upper)."
      - name: sexo
        description: "Sexo do senador (upper)."
      - name: forma_tratamento
        description: "Forma de tratamento do senador (upper)."
      - name: mandatos_mandato
        description: "Mandatos do senador (JSON)."
      - name: email
        description: "E-mail institucional do senador."
      - name: sigla_partido
        description: "Sigla do partido do senador."
      - name: codigo_publico_na_leg_atual
        description: "Código público do senador na legislatura atual."
      - name: uf
        description: "UF representada pelo senador."
      - name: loaded_at_utc
        description: "Data/hora (UTC) de ingestão do registro na camada raw."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: stg_senado_processo
    description: "Processos legislativos do Senado. Grão: um processo."
    columns:
      - name: processo_id_nk
        description: "Chave natural do processo legislativo na API do Senado."
      - name: tramitando
        description: "Indica se o processo está em tramitação."
      - name: autoria
        description: "Autoria do processo."
      - name: codigo_materia
        description: "Código da matéria associada ao processo."
      - name: data_apresentacao
        description: "Data de apresentação do processo."
      - name: data_deliberacao
        description: "Data de deliberação do processo."
      - name: data_situacao_atual
        description: "Data da situação atual do processo."
      - name: sigla_tipo
        description: "Sigla do tipo do processo."
      - name: identificacao
        description: "Identificação textual do processo (ex: PL 123/2024)."
      - name: norma_gerada
        description: "Norma gerada pelo processo, quando houver."
      - name: objetivo
        description: "Objetivo do processo (upper)."
      - name: sigla_tipo_deliberacao
        description: "Sigla do tipo de deliberação."
      - name: situacao_atual
        description: "Situação atual do processo (upper)."
      - name: tipo_conteudo
        description: "Tipo de conteúdo do processo (upper)."
      - name: tipo_documento
        description: "Tipo de documento do processo (upper)."
      - name: loaded_at_utc
        description: "Data/hora (UTC) de ingestão do registro na camada raw."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: stg_senado_status
    description: "Status de tramitação das proposições do Senado. Grão: uma proposição."
    columns:
      - name: proposicao_id_nk
        description: "Id da proposição no Senado."
      - name: codigo_materia
        description: "Código da matéria associada à proposição."
      - name: identificacao
        description: "Identificação textual da proposição (ex: PL 123/2024)."
      - name: sigla_proposicao
        description: "Sigla do tipo de proposição."
      - name: apelido
        description: "Apelido pelo qual a proposição é conhecida (upper)."
      - name: codigo_casa
        description: "Código da casa identificadora (SF, CN)."
      - name: casa
        description: "Casa identificadora (Senado Federal, Congresso Nacional)."
      - name: codigo_ente
        description: "Código do ente vinculado à proposição."
      - name: ementa
        description: "Ementa da proposição (upper)."
      - name: tipo_proposicao
        description: "Tipo do documento da proposição (upper)."
      - name: data_apresentacao
        description: "Data de apresentação da proposição."
      - name: autoria
        description: "Autoria da proposição."
      - name: tramitando
        description: "Indica se a proposição está em tramitação."
      - name: data_deliberacao
        description: "Data da deliberação da proposição."
      - name: codigo_deliberacao
        description: "Código do tipo de deliberação."
      - name: link_documento
        description: "URL do documento da proposição."
      - name: objetivo
        description: "Objetivo da proposição."
      - name: norma_gerada
        description: "Norma gerada pela proposição, quando houver."
      - name: ultima_informacao_atualizada
        description: "Data/hora da última atualização da informação na origem."
      - name: loaded_at_utc
        description: "Data/hora (UTC) de ingestão do registro na camada raw."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."


  - name: stg_senado_votacoes
    description: "Votações do Senado. Grão: uma votação."
    columns:
      - name: codigo_materia
        description: "Código da matéria votada."
      - name: codigo_sessao
        description: "Código da sessão."
      - name: codigo_sessao_legislativa
        description: "Código da sessão legislativa."
      - name: votacao_id_nk
        description: "Id da sessão de votação no Senado."
      - name: votacao_sve_id
        description: "Id da votação no sistema eletrônico do Senado (desde 2019)."
      - name: processo_id_nk
        description: "Chave natural do processo legislativo associado à votação."
      - name: identificacao
        description: "Identificação da matéria votada."
      - name: numero
        description: "Número da matéria."
      - name: numero_sessao
        description: "Número da sessão."
      - name: sigla
        description: "Sigla do tipo de matéria (PL, PEC, etc.)."
      - name: descricao_votacao
        description: "Descrição textual da votação."
      - name: sigla_tipo_sessao
        description: "Sigla do tipo de sessão (ex. O, E)."
      - name: total_votos_abstencao
        description: "Total de votos de abstenção."
      - name: total_votos_contra
        description: "Total de votos contrários."
      - name: total_votos_favor
        description: "Total de votos favoráveis."
      - name: data_votacao
        description: "Data da sessão de votação."
      - name: resultado_votacao
        description: "Resultado da votação (APROVADO, REPROVADO, PREJUDICADO, EMPATE)."
      - name: votacao_secreta
        description: "Indica se a votação foi secreta (SIM/NAO)."
      - name: aprovado
        description: "1 quando a votação foi aprovada."
      - name: loaded_at_utc
        description: "Data/hora (UTC) de ingestão do registro na camada raw."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: stg_senado_votos_senadores
    description: "Votos dos senadores. Grão: senador × votação."
    columns:
      - name: codigo_materia
        description: "Código da matéria votada."
      - name: codigo_sessao
        description: "Código da sessão."
      - name: codigo_sessao_legislativa
        description: "Código da sessão legislativa."
      - name: votacao_id_fk
        description: "Id da votação."
      - name: votacao_sve_id
        description: "Id da votação no sistema eletrônico do Senado (desde 2019)."
      - name: data_votacao
        description: "Data da sessão de votação."
      - name: processo_id_nk
        description: "Chave natural do processo legislativo associado à votação."
      - name: identificacao
        description: "Identificação da matéria votada."
      - name: numero
        description: "Número da matéria."
      - name: numero_sessao
        description: "Número da sessão."
      - name: sigla
        description: "Sigla do tipo de matéria."
      - name: sigla_tipo_sessao
        description: "Sigla do tipo de sessão."
      - name: senador_id_nk
        description: "Chave natural do senador na API do Senado."
      - name: descricao_voto
        description: "Descrição textual do voto do senador (upper)."
      - name: sigla_partido
        description: "Sigla do partido do senador no momento do voto (upper)."
      - name: sigla_voto
        description: "Sigla do voto registrado (SIM, NAO, ABSTENCAO, etc.) (upper)."
      - name: loaded_at_utc
        description: "Data/hora (UTC) de ingestão do registro na camada raw."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: stg_senado_votos_orientacao
    description: "Orientações das lideranças do Senado. Grão: liderança × votação."
    columns:
      - name: votacao_id_fk
        description: "Id da votação no sistema eletrônico do Senado."
      - name: sigla_tipo_materia
        description: "Sigla do tipo de matéria votada."
      - name: numero_materia
        description: "Número da matéria votada."
      - name: total_votos_favor
        description: "Total de votos favoráveis registrados."
      - name: total_votos_contra
        description: "Total de votos contrários registrados."
      - name: total_votos_abstencao
        description: "Total de abstenções registradas."
      - name: data_votacao
        description: "Data da votação."
      - name: partido
        description: "Sigla do partido que recebeu a orientação (upper)."
      - name: orientacao_voto
        description: "Orientação de voto (SIM, NAO, OBSTRUCAO, LIBERADO)."
      - name: loaded_at_utc
        description: "Data/hora (UTC) de ingestão do registro na camada raw."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: stg_senado_tipos_decisao
    description: "Tipos de deliberação do Senado."
    columns:
      - name: codigo_deliberacao
        description: "Código identificador do tipo de deliberação"
      - name: descricao_deliberacao
        description: "Descrição textual do tipo de deliberação"
      - name: tipo_deliberacao
        description: "Categoria do tipo de deliberação"
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: stg_senado_tipos_entes
    description: "Tipos de ente vinculado às proposições do Senado."
    columns:
      - name: codigo_ente
        description: "Código identificador do ente"
        tests:
          - not_null
          - unique
      - name: nome_ente
        description: "Nome do ente (ex: Senado Federal, Câmara dos Deputados)"
      - name: tipo_ente
        description: "Categoria do ente"
      - name: codigo_casa
        description: "Código da casa legislativa à qual o ente pertence"
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: stg_senado_tipos_projetos
    description: "Tipos de proposição do Senado."
    columns:
      - name: sigla_proposicao
        description: "Sigla do tipo de proposição (ex: PL, PEC, MPV)"
      - name: descricao_proposicao
        description: "Descrição completa do tipo de proposição"
      - name: data_inicio
        description: "Data de início de vigência do tipo de proposição"
      - name: data_fim
        description: "Fim de vigência do tipo; nulo se ativo."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."
