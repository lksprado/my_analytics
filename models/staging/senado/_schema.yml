  - name: stg_senado_processo
    description: "Processos legislativos que tramitam ou já tramitaram no Senado Federal ou no Congresso Nacional. Grão: um processo."
    columns:
      - name: processo_id_nk
        description: "Id do processo no Senado."
        meta:
          source_column: "id"
        data_tests:
          - unique
          - not_null
      - name: tramitando
        description: "SIM quando o processo ainda tramita; NAO quando encerrado."
        meta:
          source_column: "tramitando"
      - name: autoria
        description: "Autoria do processo (ex.: CAMARA DOS DEPUTADOS, SENADOR FULANO)."
        meta:
          source_column: "autoria"
      - name: codigo_materia
        description: "Código legado da matéria no sistema MATE."
        meta:
          source_column: "codigomateria"
      - name: data_apresentacao
        description: "Data de apresentação do processo."
        meta:
          source_column: "dataapresentacao"
      - name: data_deliberacao
        description: "Data da deliberação do processo."
        meta:
          source_column: "datadeliberacao"
      - name: data_situacao_atual
        description: "Data da situação atual do processo."
        meta:
          source_column: "datasituacaoatual"
      - name: sigla_tipo
        description: "Sigla do tipo do processo (ex.: PL, PEC, PDL)."
        meta:
          source_column: "identificacao"
      - name: identificacao
        description: "Identificação do processo (ex.: PL 21/2020)."
        meta:
          source_column: "identificacao"
      - name: ementa
        description: "Ementa do processo."
        meta:
          source_column: "ementa"
      - name: norma_gerada
        description: "Norma jurídica gerada pelo processo; nula se não houver."
        meta:
          source_column: "normagerada"
      - name: objetivo
        description: "Papel do Senado no processo (INICIADORA, REVISORA, EMENDA, SUBSTITUTIVO)."
        meta:
          source_column: "objetivo"
      - name: sigla_tipo_deliberacao
        description: "Sigla do tipo de deliberação (ex.: APROVADA_NO_PLENARIO)."
        meta:
          source_column: "siglatipodeliberacao"
      - name: situacao_atual
        description: "Situação atual do processo (ex.: MATERIA COM A RELATORIA)."
        meta:
          source_column: "situacaoatual"
      - name: tipo_conteudo
        description: "Tipo de conteúdo do documento iniciador (ex.: NORMA GERAL)."
        meta:
          source_column: "tipoconteudo"
      - name: tipo_documento
        description: "Tipo do documento iniciador (ex.: PROJETO DE LEI ORDINARIA)."
