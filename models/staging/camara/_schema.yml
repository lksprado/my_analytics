version: 2

models:
  - name: stg_camara_deputados
    description: "Seleção mínima de colunas da API da Câmara para deputados. Renaming e enriquecimento ocorrem em int_deputados_padronizados."
    columns:
      - name: deputado_id_nk
        description: "Chave natural do deputado na API da Câmara."
      - name: nome_civil
        description: "Nome civil do deputado."
      - name: nome_eleitoral
        description: "Nome eleitoral do último status do deputado."
      - name: sexo
        description: "Sexo informado no cadastro (M/F)."
      - name: rede_social
        description: "Campo único da API com links de redes sociais (texto ou JSON)."
      - name: data_nascimento
        description: "Data de nascimento."
      - name: data_falecimento
        description: "Data de falecimento, quando houver."
      - name: uf_nascimento
        description: "UF de nascimento."
      - name: uf_municipio_nascimento
        description: "Município de nascimento."
      - name: escolaridade
        description: "Grau de escolaridade informado."
      - name: email
        description: "E-mail institucional — COALESCE de ultimostatus_email e ultimostatus_gabinete_email."
      - name: loaded_at_utc
        description: "Data/hora (UTC) de ingestão do registro na camada raw."
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: stg_camara_legislaturas
    description: "Modelo staging com o mapeamento de deputados por legislatura. Roster histórico usado para complementar deputados ausentes do endpoint de detalhes em int_deputados_padronizados."
    columns:
      - name: legislatura_id_nk
        description: "Chave natural da legislatura."
      - name: deputado_id_fk
        description: "Chave estrangeira do deputado na API da Câmara."
      - name: uf
        description: "UF de representação do deputado na legislatura (siglauf)."
      - name: partido_id_fk
        description: "Chave estrangeira do partido na API da Câmara."
      - name: loaded_at_utc
        description: "Data/hora (UTC) de ingestão do registro na camada raw."
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."
  - name: stg_camara_votacoes
    description: "Modelo staging com as sessões de votação da Câmara."
    columns:
      - name: votacao_id_nk
        description: "Chave natural da votação."
      - name: data_votacao
        description: "Data da votação."
      - name: datahora_votacao
        description: "Data e hora do registro da votação."
      - name: sigla_orgao
        description: "Sigla do órgão que realizou a votação (ex: PLEN, CSPCCO)."
      - name: proposicao_objeto
        description: "Descrição da proposição objeto da votação."
      - name: descricao
        description: "Descrição da votação."
      - name: proposicao_id_fk
        description: "Chave estrangeira da proposição objeto da votação na API da Câmara."
      - name: aprovado
        description: "1 se a votação foi aprovada, 0 caso contrário, nulo se o resultado não foi informado."
      - name: resultado_votacao
        description: "Resultado da votação (APROVADO, REPROVADO). Coluna conformada com stg_senado_votacoes, que ainda distingue PREJUDICADO e EMPATE."
      - name: loaded_at_utc
        description: "Data/hora (UTC) de ingestão do registro na camada raw."
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: stg_camara_votacoes_orientacao
    description: "Modelo staging com a orientação de cada partido/liderança por votação."
    columns:
      - name: votacao_id_fk
        description: "Chave estrangeira da votação à qual a orientação se refere."
      - name: orientacao_voto
        description: "Orientação de voto dada pelo líder (SIM, NÃO, LIBERADO, OBSTRUÇÃO)."
      - name: codigo_tipo_lideranca
        description: "Código do tipo de liderança que deu a orientação."
      - name: codigo_partido_bloco
        description: "Código do partido ou bloco que recebeu a orientação."
      - name: sigla_partido_bloco
        description: "Sigla do partido ou bloco que recebeu a orientação."
      - name: loaded_at_utc
        description: "Data/hora (UTC) de ingestão do registro na camada raw."
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: stg_camara_votos_deputados
    description: "Modelo staging com o voto individual de cada deputado por votação."
    columns:
      - name: deputado_id_nk
        description: "Chave natural do deputado na API da Câmara."
      - name: nome
        description: "Nome eleitoral do deputado conforme registrado no voto. Usado como roster de fallback em int_deputados_padronizados."
      - name: uf
        description: "Sigla da UF do deputado conforme registrada no voto. Usada como roster de fallback em int_deputados_padronizados."
      - name: voto
        description: "Tipo do voto registrado (SIM, NÃO, ABSTENCAO, OBSTRUÇÃO, ARTIGO17)."
      - name: legislatura_id_fk
        description: "Chave estrangeira da legislatura na qual o voto foi registrado."
      - name: votacao_id_fk
        description: "Chave estrangeira da votação à qual o voto se refere."
      - name: partido_id_fk
        description: "Chave estrangeira do partido na API da Câmara."
      - name: loaded_at_utc
        description: "Data/hora (UTC) de ingestão do registro na camada raw."
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: stg_camara_proposicao_tema
    description: "Modelo staging com os temas de uma proposição."
    columns:
      - name: proposicao_id_nk
        description: "Chave natural da proposição na API da Câmara."
      - name: tema
        description: "Nome do tema."
      - name: codigo_tema
        description: "Código do tema."
      - name: relevancia
        description: "Não identificado. Tudo zero."
      - name: loaded_at_utc
        description: "Data/hora (UTC) de ingestão do registro na camada raw."
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: stg_camara_proposicao
    description: "Modelo staging com as proposições da Câmara."
    columns:
      - name: proposicao_id_nk
        description: "Chave natural da proposição na API da Câmara."
      - name: codigo_tipo
        description: "Código numérico do tipo de proposição. Junta com seed_camara_tipos_proposicao.cod."
      - name: descricao_tipo
        description: "Descrição do tipo de proposição."
      - name: data_proposicao
        description: "Data de apresentação da proposição."
      - name: palavras_chave
        description: "Palavras-chave do que se trata a proposição."
      - name: loaded_at_utc
        description: "Data/hora (UTC) de ingestão do registro na camada raw."
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."
