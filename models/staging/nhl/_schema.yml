          source_column: "awayTeam.placeName.default"
      - name: away_team_commonname
        description: "Nome do time visitante sem a cidade, em minúsculas."
        meta:
          source_column: "awayTeam.commonName.default"
      - name: away_team_logo
        description: "URL do logo do time visitante."
        meta:
          source_column: "awayTeam.logo"
      - name: away_team_darklogo
        description: "URL do logo do time visitante para fundo escuro."
        meta:
          source_column: "awayTeam.darkLogo"
      - name: home_team_abbrev
        description: "Sigla de três letras do time mandante."
        meta:
          source_column: "homeTeam.abbrev"
      - name: home_team_placename
        description: "Cidade do time mandante, em minúsculas."
        meta:
          source_column: "homeTeam.placeName.default"
      - name: home_team_commonname
        description: "Nome do time mandante sem a cidade, em minúsculas."
        meta:
          source_column: "homeTeam.commonName.default"
      - name: home_team_logo
        description: "URL do logo do time mandante."
        meta:
          source_column: "homeTeam.logo"
      - name: home_team_darklogo
        description: "URL do logo do time mandante para fundo escuro."
        meta:
          source_column: "homeTeam.darkLogo"
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

