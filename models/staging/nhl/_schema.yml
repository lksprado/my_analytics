version: 2

models:
  - name: vw_stg_request_seasons_id
    description: "Parâmetros de temporadas NHL, identificando a temporada corrente com base no maior season_id."
    columns:
      - name: season_id
        description: "Temporada no formato AAAAAAAA (ex.: 20242025)."
        meta:
          source_column: "payload"
      - name: is_current
        description: "Indica se é a temporada corrente."
        meta:
          source_column: "payload"
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: stg_base_all_games_details
    description: "Base ephemeral de detalhes de jogos NHL com campos comuns já parseados do payload bruto."
    columns:
      - name: payload
        description: "Payload JSON bruto do detalhe do jogo."
        meta:
          source_column: "payload"
      - name: game_id
        description: "Identificador único do jogo na NHL."
        meta:
          source_column: "id"
      - name: season_id
        description: "Temporada no formato AAAAAAAA (ex.: 20242025)."
        meta:
          source_column: "season"
      - name: game_type_id
        description: "Tipo de jogo (2 temporada regular, 3 playoffs; demais códigos: eventos especiais)."
        meta:
          source_column: "gameType"
      - name: game_date
        description: "Data do jogo."
        meta:
          source_column: "gameDate"
      - name: regular_periods
        description: "Quantidade de períodos regulamentares do jogo."
        meta:
          source_column: "regPeriods"
      - name: game_outcome_total_periods
        description: "Número do último período disputado."
        meta:
          source_column: "periodDescriptor.number"
      - name: game_state
        description: "Estado do jogo na API da NHL (FUT, LIVE, FINAL, OFF = encerrado oficialmente)."
        meta:
          source_column: "gameState"
      - name: game_outcome_last_period
        description: "Tipo do último período (REG, OT, SO)."
        meta:
          source_column: "gameOutcome.lastPeriodType"
      - name: special_event_name
        description: "Nome do evento especial (ex.: Winter Classic), quando houver."
        meta:
          source_column: "specialEvent.name.default"
      - name: game_start_timestamp_utc
        description: "Início do jogo em UTC, como texto ISO."
        meta:
          source_column: "startTimeUTC"
      - name: game_schedule_state
        description: "Situação do jogo no calendário (OK, PPD, CNCL)."
        meta:
          source_column: "gameScheduleState"

  - name: stg_all_games_details
    description: "Detalhes por jogo da NHL com metadados da partida e informações dos times mandante e visitante."
    columns:
      - name: game_id
        description: "Identificador único do jogo na NHL."
        meta:
          source_column: "id"
        data_tests:
          - unique
          - not_null
      - name: season_id
        description: "Temporada no formato AAAAAAAA (ex.: 20242025)."
        meta:
          source_column: "season"
      - name: game_type_id
        description: "Tipo de jogo (2 temporada regular, 3 playoffs; demais códigos: eventos especiais)."
        meta:
          source_column: "gameType"
      - name: game_date
        description: "Data do jogo."
        meta:
          source_column: "gameDate"
      - name: game_state
        description: "Estado do jogo na API da NHL em minúsculas (fut, live, final, off = encerrado oficialmente)."
        meta:
          source_column: "gameState"
      - name: regular_periods
        description: "Quantidade de períodos regulamentares do jogo."
        meta:
          source_column: "regPeriods"
      - name: game_outcome_last_period
        description: "Tipo do último período em minúsculas (reg, ot, so)."
        meta:
          source_column: "gameOutcome.lastPeriodType"
      - name: game_outcome_total_periods
        description: "Número do último período disputado."
        meta:
          source_column: "periodDescriptor.number"
      - name: special_event_name
