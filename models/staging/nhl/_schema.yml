      - name: away_team_id
        description: "Identificador do time visitante."
        meta:
          source_column: "awayTeam.id"
      - name: away_team_sog
        description: "Chutes a gol do time visitante."
        meta:
          source_column: "awayTeam.sog"
      - name: away_team_score
        description: "Gols do time visitante."
        meta:
          source_column: "awayTeam.score"
      - name: home_team_id
        description: "Identificador do time mandante."
        meta:
          source_column: "homeTeam.id"
      - name: home_team_sog
        description: "Chutes a gol do time mandante."
        meta:
          source_column: "homeTeam.sog"
      - name: home_team_score
