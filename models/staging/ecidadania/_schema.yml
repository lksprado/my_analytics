version: 2

models:
  - name: eph_ecidadania_votacoes
    description: "Proposições do e-Cidadania das páginas de listagem e dos mais votados, antes da deduplicação."
    columns:
      - name: dt_extracao
        description: "Data de extração dos dados da fonte"
        meta:
          source_column: "dt_extracao"
      - name: sigla
        description: "Sigla do tipo de proposição (ex: PL, PEC)"
        meta:
          source_column: "sigla"
      - name: numero
        description: "Número da proposição."
        meta:
          source_column: "numero"
      - name: ano
        description: "Ano de apresentação da proposição"
        meta:
          source_column: "ano"
      - name: titulo
        description: "Chave natural da proposição na fonte (título, ex: PL 123/2024)."
        meta:
          source_column: "titulo"
      - name: tipo_proposicao
        description: "Tipo da proposição como publicado na fonte."
        meta:
          source_column: "tipo_proposicao"
      - name: descritivo
        description: "Ementa descritiva da proposição"
        meta:
          source_column: "descritivo"
      - name: votos_sim
        description: "Quantidade de votos favoráveis à proposição"
        meta:
          source_column: "votos_sim"
      - name: votos_nao
        description: "Quantidade de votos contrários à proposição"
        meta:
          source_column: "votos_nao"
      - name: link
        description: "URL da proposição na plataforma e-Cidadania"
        meta:
          source_column: "link"

  - name: stg_ecidadania_bignumbers
    description: "Totais de votações e votantes do e-Cidadania."
    columns:
      - name: data_extracao
        description: "Data de extração dos dados da fonte"
        meta:
          source_column: "dt_extracao"
      - name: total_proposicoes_votadas
        description: "Quantidade total de proposições que receberam votos"
      - name: total_pessoas_votaram
        description: "Quantidade total de pessoas distintas que votaram"
      - name: total_votos_registrados
        description: "Quantidade total de votos registrados na plataforma"
      - name: votos_por_pessoa
        description: "Média de votos por pessoa (total_votos / total_pessoas)"
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: stg_ecidadania_votacoes
    description: "Proposições do e-Cidadania. Grão: uma proposição."
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "resultado_consulta = CASE WHEN votos_sim > votos_nao THEN 'SIM' WHEN votos_nao > votos_sim THEN 'NAO' ELSE 'EMPATE' END"
    columns:
      - name: data_extracao
        description: "Data de extração dos dados da fonte"
        meta:
          source_column: "dt_extracao"
      - name: sigla
        description: "Sigla do tipo de proposição (ex: PL, PEC)"
        meta:
          source_column: "sigla"
      - name: numero
        description: "Número da proposição."
        meta:
          source_column: "numero"
      - name: ano
        description: "Ano de apresentação da proposição"
        meta:
          source_column: "ano"
      - name: identificacao
        description: "Chave natural da proposição na fonte (título, ex: PL 123/2024)."
      - name: tipo_proposicao
        description: "Tipo da proposição normalizado (ex: PROJETO DE LEI)."
        meta:
          source_column: "tipo_proposicao"
      - name: ementa
        description: "Ementa descritiva da proposição"
        meta:
          source_column: "descritivo"
      - name: votos_sim
        description: "Quantidade de votos favoráveis à proposição"
        meta:
          source_column: "votos_sim"
      - name: votos_nao
        description: "Quantidade de votos contrários à proposição"
        meta:
          source_column: "votos_nao"
      - name: total_votos
        description: "Total de votos registrados para a proposição"
        meta:
          source_column: "votos_sim, votos_nao"
      - name: resultado_consulta
        description: "Resultado da consulta (SIM, NAO, EMPATE) pela maioria dos votos."
        tests:
          - accepted_values:
              arguments:
                values: ['SIM', 'NAO', 'EMPATE']
      - name: link
        description: "URL da proposição na plataforma e-Cidadania"
        meta:
          source_column: "link"
