version: 2

models:
  - name: stg_ecidadania_bignumbers
    description: "Modelo staging com os totais agregados de votações e votantes na plataforma e-Cidadania"
    columns:
      - name: data_extracao
        description: "Data de extração dos dados da fonte"
      - name: total_proposicoes_votadas
        description: "Quantidade total de proposições que receberam votos"
      - name: total_pessoas_votaram
        description: "Quantidade total de pessoas distintas que votaram"
      - name: total_votos_registrados
        description: "Quantidade total de votos registrados na plataforma"
      - name: votos_por_pessoa
        description: "Média de votos por pessoa (total_votos / total_pessoas)"
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: stg_ecidadania_votacoes
    description: "Modelo staging com todas as proposições legislativas (em andamento e encerradas) na plataforma e-Cidadania"
    columns:
      - name: data_extracao
        description: "Data de extração dos dados da fonte"
      - name: ano_proposicao
        description: "Ano de apresentação da proposição"
      - name: sigla_proposicao
        description: "Sigla do tipo de proposição (ex: PL, PEC)"
      - name: proposicao_id_nk
        description: "Chave natural da proposição na fonte (título, ex: PL 123/2024)."
      - name: ementa
        description: "Ementa descritiva da proposição"
      - name: votos_sim
        description: "Quantidade de votos favoráveis à proposição"
      - name: votos_nao
        description: "Quantidade de votos contrários à proposição"
      - name: total_votos
        description: "Total de votos registrados para a proposição"
      - name: vontade_popular
        description: "Indicador da vontade popular (SIM/NÃO) com base na maioria dos votos"
      - name: link
        description: "URL da proposição na plataforma e-Cidadania"
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."
