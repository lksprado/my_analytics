version: 2

models:
  - name: stg_assets
    description: "Posições na Avenue, uma linha por ativo, titular e período do extrato, em USD."
    columns:
      - name: period_start
        description: "Início do período do extrato."
      - name: period_end
        description: "Fim do período do extrato."
      - name: asset_class
        description: "Classe do ativo na Avenue (ex.: FIXED INCOME, EQUITIES, CASH)."
      - name: market_value
        description: "Valor de mercado da posição, em dólares (USD)."
      - name: pessoa
        description: "Titular (lucas, jessica ou deusa)."
      - name: description
        description: "Descrição do ativo ('US TREASURY' nos títulos do tesouro americano)."
      - name: symbol_cusip
        description: "Símbolo ou CUSIP do ativo."
      - name: moeda_ativo
        description: "Moeda do ativo (USD)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: stg_dividends_interest
    description: "Dividendos e juros líquidos de impostos na Avenue, uma linha por titular e período do extrato, em USD."
    columns:
      - name: period_start
        description: "Início do período do extrato."
      - name: period_end
        description: "Fim do período do extrato."
      - name: vlr_liquido_usd
        description: "Dividendos e juros líquidos de impostos no período, em dólares (USD)."
      - name: pessoa
        description: "Titular (lucas, jessica ou deusa)."
      - name: moeda_ativo
        description: "Moeda do valor (USD)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."
