version: 2

models:
  - name: stg_acoes
    description: "Posições em ações na B3, uma linha por ativo, titular e mês-base."
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base."
      - name: pessoa
        description: "Titular (lucas, jessica ou deusa)."
      - name: produto
        description: "Nome do produto/ativo conforme extrato da B3."
      - name: instituicao
        description: "Corretora, banco ou custodiante, com nome padronizado."
      - name: codigo_ativo
        description: "Código de negociação da ação na B3."
      - name: cnpj_empresa
        description: "CNPJ da empresa emissora, apenas dígitos."
      - name: tipo
        description: "Tipo do ativo conforme classificação da B3 (ex.: ON, PN)."
      - name: escriturador
        description: "Instituição escrituradora do ativo."
      - name: quantidade
        description: "Quantidade total de ativos na posição."
      - name: quantidade_disponivel
        description: "Quantidade disponível para negociação."
      - name: quantidade_indisponivel
        description: "Quantidade indisponível (bloqueada ou em garantia)."
      - name: motivo_indisponibilidade
        description: "Motivo da indisponibilidade, quando houver."
      - name: vlr_fechamento
        description: "Preço de fechamento unitário do ativo no mês-base."
      - name: vlr_atualizado_brl
        description: "Valor de mercado da posição, em reais."
      - name: moeda_ativo
        description: "Moeda do ativo (BRL)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

