        meta:
          source_column: "price_new"
      - name: discount
        description: "Variação do preço promocional sobre o de lista (fração negativa = desconto)."
        meta:
          source_column: "price_new"
      - name: created_date
        description: "Data da coleta."
        meta:
          source_column: "created_at"
      - name: author
        description: "Autor do livro, em minúsculas e sem acentos; uma linha por autor."
        meta:
          source_column: "author_name"
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."
