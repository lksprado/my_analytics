version: 2

models:
  - name: stg_radarcongresso_governismo_deputados
    description: >
      Governismo de deputados publicado pelo Radar Congresso. Grão: deputado × trimestre, mas as
      três colunas de legislatura são o acumulado do mandato repetido nas doze linhas do
      parlamentar — só perc_governismo_trimestre varia entre elas.
    columns:
      - name: id_parlamentar_radar
        description: "Identificador do parlamentar no Radar Congresso (idparlamentarvoz), não o id oficial da casa. Join com stg_radarcongresso_parlamentares."
        tests:
          - not_null
      - name: qt_votos_alinhados_legislatura
        description: "Votos do deputado alinhados ao governo no acumulado do mandato."
      - name: qt_votos_legislatura
        description: "Denominador do cálculo: total de votos do deputado em votações com orientação do governo, no acumulado do mandato. A fonte chama essa coluna de n."
      - name: perc_governismo_legislatura
        description: "Percentual de alinhamento ao governo no acumulado do mandato, inteiro. Igual a ROUND(100 * qt_votos_alinhados_legislatura / qt_votos_legislatura) em 100% das linhas."
      - name: data_trimestre
        description: "Marcador do trimestre de referência: o dia seguinte ao fim do trimestre medido, exceto o primeiro, que vem como 2023-03-31."
      - name: perc_governismo_trimestre
        description: "Percentual de alinhamento ao governo no trimestre, inteiro. Nulo quando o deputado não votou em votação orientada no período."
      - name: loaded_at_utc
        description: "Data/hora (UTC) de ingestão do registro na camada raw"
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas. Serve para auditar a atualidade dos dados."

  - name: stg_radarcongresso_governismo_senadores
    description: >
      Governismo de senadores publicado pelo Radar Congresso, mesma estrutura do modelo de
      deputados. É a única medida de governismo de senador no warehouse: o cálculo próprio não
      cobre o Senado, por defeito de extração da orientação de bancada.
    columns:
      - name: id_parlamentar_radar
        description: "Identificador do parlamentar no Radar Congresso (idparlamentarvoz), não o id oficial da casa. Join com stg_radarcongresso_parlamentares."
        tests:
          - not_null
      - name: qt_votos_alinhados_legislatura
        description: "Votos do senador alinhados ao governo no acumulado do mandato."
      - name: qt_votos_legislatura
        description: "Denominador do cálculo: total de votos do senador em votações com orientação do governo, no acumulado do mandato. A fonte chama essa coluna de n."
      - name: perc_governismo_legislatura
        description: "Percentual de alinhamento ao governo no acumulado do mandato, inteiro. Igual a ROUND(100 * qt_votos_alinhados_legislatura / qt_votos_legislatura) em 100% das linhas."
      - name: data_trimestre
        description: "Marcador do trimestre de referência: o dia seguinte ao fim do trimestre medido, exceto o primeiro, que vem como 2023-03-31."
      - name: perc_governismo_trimestre
        description: "Percentual de alinhamento ao governo no trimestre, inteiro. Nulo quando o senador não votou em votação orientada no período."
      - name: loaded_at_utc
        description: "Data/hora (UTC) de ingestão do registro na camada raw"
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas. Serve para auditar a atualidade dos dados."

  - name: stg_radarcongresso_parlamentares
    description: >
      De-para entre o id do Radar Congresso e o id oficial da Câmara ou do Senado. Cobre só quem
      estava em exercício na extração: 513 deputados e 81 senadores, todos casando com
      dim_parlamentares.
    columns:
      - name: id_parlamentar_radar
        description: "Identificador do parlamentar no Radar Congresso (idparlamentarvoz). Chave das tabelas de governismo."
        tests:
          - not_null
          - unique
      - name: id_parlamentar_congresso
        description: "Identificador do parlamentar na API oficial da Câmara ou do Senado. O id do radar é este número prefixado por 1 na Câmara e por 2 no Senado."
        tests:
          - not_null
          - unique
      - name: nome_eleitoral
        description: "Nome eleitoral do parlamentar conforme o Radar Congresso"
      - name: uf
        description: "Unidade federativa representada"
      - name: is_ativo
        description: "Booleano indicando se o parlamentar está em exercício"
      - name: casa
        description: "Casa legislativa (CAMARA ou SENADO), conformada com o resto do domínio."
        tests:
          - accepted_values:
              arguments:
                values: ['CAMARA', 'SENADO']
      - name: partido_dict
        description: "Dicionário Python serializado com id e sigla do partido, como vem da fonte. Não parseado: o partido usado no domínio sai de fct_votos."
      - name: nome_completo
        description: "Nome completo do parlamentar"
      - name: arquivo_origem
        description: "Identificador do arquivo de origem da extração"
      - name: loaded_at_utc
        description: "Data/hora (UTC) de ingestão do registro na camada raw"
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas. Serve para auditar a atualidade dos dados."
