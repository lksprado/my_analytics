version: 2

models:
  - name: stg_radarcongresso_governismo_deputados
    description: "Governismo de deputados publicado pelo Radar Congresso. Grão: deputado × trimestre."
    columns:
      - name: radar_parlamentar_id_nk
        description: "Id do parlamentar no Radar Congresso."
        tests:
          - not_null
      - name: qt_votos_alinhados_legislatura
        description: "Votos do deputado alinhados ao governo no acumulado do mandato."
      - name: qt_votos_legislatura
        description: "Votos em votações orientadas pelo Governo no mandato."
      - name: perc_governismo_legislatura
        description: "Percentual de governismo no mandato (0–100)."
      - name: data_trimestre
        description: "Data de referência do trimestre no Radar."
      - name: perc_governismo_trimestre
        description: "Percentual de governismo no trimestre (0–100)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: stg_radarcongresso_governismo_senadores
    description: "Governismo de senadores publicado pelo Radar Congresso. Grão: senador × trimestre."
    columns:
      - name: radar_parlamentar_id_nk
        description: "Id do parlamentar no Radar Congresso."
        tests:
          - not_null
      - name: qt_votos_alinhados_legislatura
        description: "Votos do senador alinhados ao governo no acumulado do mandato."
      - name: qt_votos_legislatura
        description: "Votos em votações orientadas pelo Governo no mandato."
      - name: perc_governismo_legislatura
        description: "Percentual de governismo no mandato (0–100)."
      - name: data_trimestre
        description: "Data de referência do trimestre no Radar."
      - name: perc_governismo_trimestre
        description: "Percentual de governismo no trimestre (0–100)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: stg_radarcongresso_parlamentares
    description: "De-para entre o id do Radar Congresso e o id da casa. Grão: um parlamentar."
    columns:
      - name: radar_parlamentar_id_nk
        description: "Id do parlamentar no Radar Congresso."
        tests:
          - not_null
          - unique
      - name: parlamentar_id_fk
        description: "Id do parlamentar na casa."
        tests:
          - not_null
          - unique
      - name: nome_eleitoral
        description: "Nome eleitoral do parlamentar conforme o Radar Congresso"
      - name: uf
        description: "Unidade federativa representada"
      - name: is_ativo
        description: "Booleano indicando se o parlamentar está em exercício"
      - name: casa
        description: "Casa legislativa (CAMARA ou SENADO), conformada com o resto do domínio."
        tests:
          - accepted_values:
              arguments:
                values: ['CAMARA', 'SENADO']
      - name: partido_dict
        description: "Partido do parlamentar como vem da fonte (texto serializado)."
      - name: nome_completo
        description: "Nome completo do parlamentar"
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."
