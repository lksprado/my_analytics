version: 2

models:
  - name: votacoes
    description: "Votações da Câmara e do Senado, com placar, orientação e resultado. Grão: uma votação."
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(fl_resultado_alinhado_governo IS NULL) = (resultado_alinhado_governo NOT IN ('ALINHADO', 'NAO ALINHADO'))"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "modalidade_votacao = 'NOMINAL ABERTA' OR qt_votantes IS NULL"
    columns:
      - name: sk_votacao
        description: "Chave da votação."
        tests:
          - not_null
          - unique
      - name: votacao_id_nk
        description: "Chave natural da votação na casa."
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: sessao_id
        description: "Id da sessão em que a votação ocorreu."
      - name: data_votacao
        description: "Data em que a votação ocorreu."
      - name: ano
        description: "Ano da votação."
      - name: trimestre
        description: "Trimestre do ano da votação (1 a 4)."
      - name: legislatura
        description: "Número da legislatura."
      - name: presidente
        description: "Presidente da República em exercício."
      - name: mandato
        description: "Número do mandato do presidente (1, 2 ou 3)."
      - name: sigla_orgao
        description: "Sigla do órgão que votou."
      - name: tipo_orgao
        description: "Tipo do órgão (PLENARIO, MESA DIRETORA, CPI, COMISSAO ESPECIAL, COMISSAO, OUTROS)."
      - name: classe_votacao
        description: "Classe da votação (MERITO, EMENDA/DESTAQUE, URGENCIA, REQUERIMENTO PROCEDIMENTAL, PARECER, AUTORIDADE, OUTROS)."
      - name: grupo_votacao
        description: "Grupo da classe (MERITO, PROCEDIMENTAL, ADMISSIBILIDADE, AUTORIDADE, OUTROS)."
      - name: modalidade_votacao
        description: "Modalidade (NOMINAL ABERTA, NOMINAL SECRETA, SEM REGISTRO NOMINAL)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NOMINAL ABERTA', 'NOMINAL SECRETA', 'SEM REGISTRO NOMINAL']
      - name: descricao
        description: "Descrição da votação."
      - name: tipo_proposicao
        description: "Tipo da proposição votada."
      - name: proposicao_id_nk
        description: "Id da proposição votada na casa."
      - name: identificacao_proposicao
        description: "Identificação da proposição votada (ex.: PL 1234/2023)."
      - name: ementa
        description: "Ementa da proposição votada (só Câmara)."
      - name: data_proposicao
        description: "Data de apresentação da proposição votada."
      - name: fl_aprovada
        description: "1 quando a votação foi aprovada, 0 quando rejeitada; nulo quando o resultado não é binário."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: resultado
        description: "Resultado da votação (APROVADA, REJEITADA, NAO BINARIO)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['APROVADA', 'REJEITADA', 'NAO BINARIO']
      - name: qt_votantes
        description: "Votantes (SIM, NÃO ou OBSTRUÇÃO); nulo sem registro nominal aberto."
      - name: qt_votos_sim
        description: "Votos SIM."
      - name: qt_votos_nao
        description: "Votos NÃO."
      - name: qt_obstrucao
        description: "Votos de OBSTRUÇÃO."
      - name: qt_abstencao
        description: "Abstenções."
      - name: qt_partidos
        description: "Partidos distintos entre os votantes."
      - name: margem
        description: "Votos SIM menos votos NÃO."
      - name: sim_pct
        description: "Percentual de SIM sobre os votantes (0–100)."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: orientacao_governo
        description: "Orientação do Governo (SIM, NAO, OBSTRUCAO, LIBERADO, ABSTENCAO); nula sem orientação."
      - name: fl_governo_orientou
        description: "1 quando o Governo orientou SIM, NÃO ou OBSTRUÇÃO."
      - name: fl_resultado_alinhado_governo
        description: "1 quando o resultado seguiu a orientação do Governo, 0 quando contrariou."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: resultado_alinhado_governo
        description: "Resultado frente à orientação do Governo (ALINHADO, NAO ALINHADO) ou motivo de não classificar."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['ALINHADO', 'NAO ALINHADO', 'SEM ORIENTACAO', 'LIBERADO', 'ORIENTACAO ABSTENCAO', 'RESULTADO NAO BINARIO']
      - name: fl_unanimidade
        description: "1 quando a votação nominal aberta teve só SIM ou só NÃO."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: votos_parlamentares
    description: "Todos os registros de voto, mais as ausências inferidas no Plenário da Câmara. Grão: parlamentar × votação."
    columns:
      - name: sk_voto
        description: "Chave do registro de voto."
        tests:
          - not_null
          - unique
      - name: sk_votacao
        description: "Chave da votação."
        tests:
          - not_null
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
      - name: sk_partido
        description: "Chave do partido."
      - name: sk_bancada
        description: "Chave da federação ou bloco do partido do parlamentar na data; desconhecido sem bancada."
      - name: votacao_id_nk
        description: "Chave natural da votação na casa."
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: data_votacao
        description: "Data em que a votação ocorreu."
      - name: ano
        description: "Ano da votação."
      - name: trimestre
        description: "Trimestre do ano da votação (1 a 4)."
      - name: legislatura
        description: "Número da legislatura em que a votação ocorreu."
      - name: presidente
        description: "Presidente da República em exercício na data da votação."
      - name: mandato
        description: "Número do mandato do presidente (1, 2 ou 3)."
      - name: tipo_orgao
        description: "Tipo do órgão (PLENARIO, MESA DIRETORA, CPI, COMISSAO ESPECIAL, COMISSAO, OUTROS)."
      - name: classe_votacao
        description: "Classe da votação (MERITO, EMENDA/DESTAQUE, URGENCIA, REQUERIMENTO PROCEDIMENTAL, PARECER, AUTORIDADE, OUTROS)."
      - name: grupo_votacao
        description: "Grupo da classe (MERITO, PROCEDIMENTAL, ADMISSIBILIDADE, AUTORIDADE, OUTROS)."
      - name: tipo_proposicao
        description: "Tipo da proposição ou matéria votada."
      - name: identificacao_proposicao
        description: "Identificação da proposição votada (ex.: PL 1234/2023)."
      - name: fl_aprovada
        description: "1 quando a votação foi aprovada."
      - name: nome
        description: "Nome parlamentar."
      - name: sexo
        description: "Sexo (MASCULINO, FEMININO)."
      - name: uf
        description: "UF de representação no momento do voto."
      - name: regiao
        description: "Região da UF do voto."
      - name: idade
        description: "Idade do parlamentar na data da votação (só Câmara)."
      - name: partido
        description: "Sigla do partido no momento do voto; nula na ausência inferida."
      - name: partido_rotulo
        description: "Nome de exibição do partido; siglas reutilizadas levam o período."
      - name: bancada
        description: "Sigla da federação ou bloco do partido na data do voto."
      - name: tipo_bancada
        description: "Tipo da bancada (FEDERACAO, BLOCO)."
      - name: voto
        description: "Posição do voto (SIM, NAO, OBSTRUCAO, ABSTENCAO, BRANCO); nula quando não é voto."
        tests:
          - accepted_values:
              arguments:
                values: ['SIM', 'NAO', 'OBSTRUCAO', 'ABSTENCAO', 'BRANCO']
      - name: categoria
        description: "Categoria do registro (VOTOU, VOTO SECRETO, PRESENTE SEM VOTO, PRESIDENCIA, AUSENCIA JUSTIFICADA, AUSENCIA NAO JUSTIFICADA, AUSENCIA INFERIDA, NAO INFORMADO)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['VOTOU', 'VOTO SECRETO', 'PRESENTE SEM VOTO', 'PRESIDENCIA', 'AUSENCIA JUSTIFICADA', 'AUSENCIA NAO JUSTIFICADA', 'AUSENCIA INFERIDA', 'NAO INFORMADO']
      - name: fl_presente
        description: "1 quando o parlamentar esteve presente, 0 quando ausente; nulo quando a origem não informa."
      - name: fl_ausencia_inferida
        description: "1 quando a ausência é inferida (deputado sem registro no período de exercício)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: orientacao_governo
        description: "Orientação do Governo (SIM, NAO, OBSTRUCAO, LIBERADO, ABSTENCAO); nula sem orientação."
      - name: orientacao_partido
        description: "Orientação do partido do parlamentar (SIM, NAO, OBSTRUCAO, LIBERADO, ABSTENCAO); nula sem orientação."
      - name: orientacao_bancada
        description: "Orientação da federação ou bloco do partido na votação."
      - name: fl_seguiu_governo
        description: "1 quando o voto seguiu a orientação do Governo, 0 quando divergiu."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: fl_seguiu_partido
        description: "1 quando o voto seguiu a orientação do partido, 0 quando divergiu."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: fl_seguiu_bancada
        description: "1 quando o voto seguiu a orientação da federação ou bloco, 0 quando divergiu."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: fl_votou_com_resultado
        description: "1 quando o voto ficou do lado vencedor, 0 quando perdeu."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: alinhamento
        description: "Alinhamento do voto (GOVERNO E PARTIDO, SO GOVERNO, SO PARTIDO, CONTRA AMBOS)."
        tests:
          - accepted_values:
              arguments:
                values:
                  - "GOVERNO E PARTIDO"
                  - "SO GOVERNO"
                  - "SO PARTIDO"
                  - "CONTRA AMBOS"
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: proposicoes
    description: "Proposições com situação, datas, autoria e votações. Grão: uma proposição."
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "qt_votacoes_nominais <= qt_votacoes AND qt_votacoes_aprovadas <= qt_votacoes"
    columns:
      - name: sk_proposicao
        description: "Chave da proposição."
        tests:
          - not_null
          - unique
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: proposicao_id_nk
        description: "Id da proposição na casa."
      - name: tipo_proposicao
        description: "Tipo da proposição (PL, PEC...)."
      - name: identificacao
        description: "Identificação da proposição (ex.: PL 1234/2023)."
      - name: ementa
        description: "Ementa (só Câmara)."
      - name: data_apresentacao
        description: "Data de apresentação."
      - name: ano_apresentacao
        description: "Ano de apresentação."
      - name: situacao_atual
        description: "Situação atual de tramitação."
      - name: data_situacao_atual
        description: "Data da situação atual."
      - name: fl_tramitando
        description: "1 quando a proposição está em tramitação (só Senado)."
      - name: regime
        description: "Regime de tramitação atual (só Câmara)."
      - name: autoria
        description: "Autoria (só Senado)."
      - name: norma_gerada
        description: "Norma gerada pela proposição (só Senado)."
      - name: relator_atual
        description: "Nome do deputado relator atual (só Câmara)."
      - name: qt_votacoes
        description: "Votações em que a proposição é o objeto."
      - name: qt_votacoes_nominais
        description: "Votações nominais em que a proposição é o objeto."
      - name: qt_votacoes_aprovadas
        description: "Votações aprovadas em que a proposição é o objeto."
      - name: data_primeira_votacao
        description: "Data da primeira votação da proposição."
      - name: data_ultima_votacao
        description: "Data da última votação da proposição."
      - name: qt_temas
        description: "Temas da proposição."
      - name: temas
        description: "Temas da proposição, para exibição (use proposicoes_temas para agregar)."
      - name: qt_proposicoes_relacionadas
        description: "Proposições relacionadas (principal, anterior, posterior)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: proposicoes_temas
    description: "Proposições por tema, sem peso: a proposição aparece em cada tema. Totais por tema não se somam entre temas. Grão: proposição × tema."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_proposicao
              - sk_tema
    columns:
      - name: sk_proposicao
        description: "Chave da proposição."
        tests:
          - not_null
      - name: sk_tema
        description: "Chave do tema."
        tests:
          - not_null
      - name: codigo_tema
        description: "Código do tema na Câmara."
      - name: tema
        description: "Nome do tema."
      - name: relevancia
        description: "Relevância do tema para a proposição, segundo a Câmara."
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: tipo_proposicao
        description: "Tipo da proposição (PL, PEC...)."
      - name: identificacao
        description: "Identificação da proposição (ex.: PL 1234/2023)."
      - name: ano_apresentacao
        description: "Ano de apresentação."
      - name: situacao_atual
        description: "Situação atual de tramitação."
      - name: qt_votacoes
        description: "Votações em que a proposição é o objeto."
      - name: qt_votacoes_aprovadas
        description: "Votações aprovadas em que a proposição é o objeto."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: comportamento_partidario
    description: "Comportamento das bancadas: coesão, governismo e disciplina. Grão: casa × partido × legislatura × presidente × trimestre."
    columns:
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: sk_partido
        description: "Chave do partido."
      - name: partido
        description: "Sigla do partido no momento do voto."
      - name: siglas_no_periodo
        description: "Siglas usadas pela entidade partidária nos votos do período."
      - name: legislatura
        description: "Número da legislatura."
      - name: presidente
        description: "Presidente da República em exercício no período."
      - name: mandato
        description: "Número do mandato do presidente."
      - name: ano
        description: "Ano das votações agregadas."
      - name: trimestre
        description: "Trimestre do ano das votações agregadas (1 a 4)."
      - name: data_trimestre
        description: "Primeiro dia do trimestre."
      - name: qt_parlamentares
        description: "Parlamentares distintos da bancada que votaram."
      - name: qt_votacoes
        description: "Votações em que a bancada votou."
      - name: qt_votos
        description: "Votos da bancada."
      - name: qt_votacoes_coesao
        description: "Votações com ao menos dois votos SIM/NÃO da bancada."
      - name: indice_rice_medio
        description: "Índice de Rice médio da bancada (0 = dividida, 1 = unânime)."
      - name: qt_votos_governismo
        description: "Votos da bancada em votações orientadas pelo Governo."
      - name: qt_votos_alinhados_governo
        description: "Votos da bancada alinhados ao Governo."
      - name: governismo_pct_modelo
        description: "Governismo da bancada calculado pelo modelo (0–100)."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: qt_votos_disciplina
        description: "Votos da bancada em votações orientadas pelo partido."
      - name: qt_votos_disciplinados
        description: "Votos da bancada que seguiram o partido."
      - name: disciplina_pct
        description: "Disciplina da bancada (0–100)."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - sk_partido
              - legislatura
              - presidente
              - mandato
              - ano
              - trimestre

  - name: comportamento_bancada
    description: "Comportamento das federações e blocos: coesão, governismo e disciplina de bancada. Grão: casa × bancada × legislatura × presidente × trimestre."
    columns:
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: sk_bancada
        description: "Chave da federação ou bloco."
      - name: bancada
        description: "Sigla da federação ou bloco."
      - name: tipo_bancada
        description: "Tipo da bancada (FEDERACAO, BLOCO)."
      - name: siglas_no_periodo
        description: "Siglas dos partidos cujos parlamentares votaram na bancada no período."
      - name: legislatura
        description: "Número da legislatura."
      - name: presidente
        description: "Presidente da República em exercício no período."
      - name: mandato
        description: "Número do mandato do presidente."
      - name: ano
        description: "Ano das votações agregadas."
      - name: trimestre
        description: "Trimestre do ano das votações agregadas (1 a 4)."
      - name: data_trimestre
        description: "Primeiro dia do trimestre."
      - name: qt_parlamentares
        description: "Parlamentares distintos da bancada que votaram."
      - name: qt_votacoes
        description: "Votações em que a bancada votou."
      - name: qt_votos
        description: "Votos da bancada."
      - name: qt_votacoes_coesao
        description: "Votações com ao menos dois votos SIM/NÃO da bancada."
      - name: indice_rice_medio
        description: "Índice de Rice médio da bancada (0 = dividida, 1 = unânime)."
      - name: qt_votos_governismo
        description: "Votos da bancada em votações orientadas pelo Governo."
      - name: qt_votos_alinhados_governo
        description: "Votos da bancada alinhados ao Governo."
      - name: governismo_pct_modelo
        description: "Governismo da bancada calculado pelo modelo (0–100)."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: qt_votos_disciplina
        description: "Votos em votações orientadas pela federação ou bloco."
      - name: qt_votos_disciplinados
        description: "Votos que seguiram a orientação da federação ou bloco."
      - name: disciplina_pct
        description: "Disciplina em relação à orientação da federação ou bloco (0–100)."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - sk_bancada
              - legislatura
              - presidente
              - mandato
              - ano
              - trimestre

  - name: parlamentar_legislatura
    description: "Participação, governismo e disciplina do parlamentar no período. Grão: parlamentar × legislatura."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_parlamentar
              - legislatura
      - dbt_utils.expression_is_true:
          arguments:
            expression: "qt_votacoes_participadas <= qt_votacoes_elegiveis AND qt_presencas <= qt_votacoes_nominais_elegiveis AND qt_votos_alinhados_governo <= qt_votos_governismo"
    columns:
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
      - name: deputado_id_nk
        description: "Id do deputado na Câmara."
      - name: senador_id_nk
        description: "Id do senador no Senado."
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: nome
        description: "Nome parlamentar."
      - name: sexo
        description: "Sexo (MASCULINO, FEMININO)."
      - name: legislatura
        description: "Número da legislatura."
        tests:
          - not_null
      - name: periodo_inicio
        description: "Primeiro dia do período."
      - name: periodo_fim
        description: "Último dia do período."
      - name: uf
        description: "UF com mais votos do parlamentar no período."
      - name: regiao
        description: "Região da UF do período."
      - name: sk_partido
        description: "Chave do partido com mais votos do parlamentar no período."
      - name: partido
        description: "Partido com mais votos do parlamentar no período (rótulo da entidade)."
      - name: siglas_no_periodo
        description: "Siglas partidárias usadas pelo parlamentar nos votos do período."
      - name: qt_votacoes_nominais_elegiveis
        description: "Votações nominais do Plenário em que o parlamentar estava em exercício."
      - name: qt_presencas
        description: "Votações nominais do Plenário com presença registrada."
      - name: presenca_pct
        description: "Percentual de presença nas votações nominais do Plenário (0–100)."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: qt_ausencias_justificadas
        description: "Ausências justificadas (só Senado)."
      - name: qt_ausencias_nao_justificadas
        description: "Ausências não justificadas (só Senado)."
      - name: qt_ausencias_inferidas
        description: "Ausências inferidas (só Câmara)."
      - name: qt_votacoes_elegiveis
        description: "Votações nominais abertas do Plenário, orientadas pelo Governo, em que o parlamentar estava em exercício."
      - name: qt_votacoes_participadas
        description: "Votações elegíveis em que o parlamentar votou SIM, NÃO ou OBSTRUÇÃO."
      - name: participacao_pct
        description: "Percentual de participação nas votações elegíveis (0–100)."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: qt_votos_governismo
        description: "Votos em votações orientadas pelo Governo, inclusive em comissões."
      - name: qt_votos_alinhados_governo
        description: "Votos alinhados à orientação do Governo."
      - name: governismo_pct_modelo
