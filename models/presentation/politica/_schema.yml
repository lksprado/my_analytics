      - name: participacao_pct
        description: "Percentual das votações nominais da casa em que o parlamentar votou (0–100)."
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_parlamentar
              - legislatura

  - name: score_vs_governismo
    description: "Ranking dos Políticos × governismo. Grão: parlamentar × ano."
    columns:
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
      - name: deputado_id_nk
        description: "Id do deputado na Câmara."
      - name: senador_id_nk
        description: "Id do senador no Senado."
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: nome
