unit_tests:

  - name: consultas_publicas_aderencia
    description: >
      A aderência compara o resultado da consulta (maioria SIM ou NÃO na última extração) com a
      deliberação da matéria no Senado. Empate, matéria sem decisão, decisão que não é aprovação
      nem rejeição e matéria fora do Senado deixam a aderência nula, com o motivo.
    model: consultas_publicas
    given:
      - input: ref('fct_consultas_publicas')
        rows:
          - {identificacao: PL 1/2023, sk_proposicao: p1, data_extracao: '2026-09-01', votos_sim: 10, votos_nao: 2, total_votos: 12}
          - {identificacao: PL 1/2023, sk_proposicao: p1, data_extracao: '2026-09-22', votos_sim: 30, votos_nao: 5, total_votos: 35}
          - {identificacao: PL 2/2023, sk_proposicao: p2, data_extracao: '2026-09-22', votos_sim: 1, votos_nao: 9, total_votos: 10}
          - {identificacao: PL 3/2023, sk_proposicao: p3, data_extracao: '2026-09-22', votos_sim: 9, votos_nao: 1, total_votos: 10}
          - {identificacao: PL 4/2023, sk_proposicao: p4, data_extracao: '2026-09-22', votos_sim: 5, votos_nao: 5, total_votos: 10}
          - {identificacao: PL 5/2023, sk_proposicao: p5, data_extracao: '2026-09-22', votos_sim: 7, votos_nao: 3, total_votos: 10}
          - {identificacao: PL 6/2023, sk_proposicao: p6, data_extracao: '2026-09-22', votos_sim: 7, votos_nao: 3, total_votos: 10}
          - {identificacao: PL 7/2023, sk_proposicao: '0', data_extracao: '2026-09-22', votos_sim: 7, votos_nao: 3, total_votos: 10}
      - input: ref('dim_proposicoes')
        rows:
          - {sk_proposicao: p1, casa: SENADO, tipo_proposicao: PROJETO DE LEI, ementa: A, situacao_atual: X, fl_tramitando: 0, codigo_deliberacao: APROVADA_NO_PLENARIO, data_deliberacao: '2026-08-01'}
          - {sk_proposicao: p2, casa: SENADO, tipo_proposicao: PROJETO DE LEI, ementa: B, situacao_atual: X, fl_tramitando: 0, codigo_deliberacao: APROVADA_NO_PLENARIO, data_deliberacao: '2026-08-01'}
          - {sk_proposicao: p3, casa: SENADO, tipo_proposicao: PROJETO DE LEI, ementa: C, situacao_atual: X, fl_tramitando: 0, codigo_deliberacao: REJEITADO_PLENARIO, data_deliberacao: '2026-08-01'}
          - {sk_proposicao: p4, casa: SENADO, tipo_proposicao: PROJETO DE LEI, ementa: D, situacao_atual: X, fl_tramitando: 0, codigo_deliberacao: APROVADA_NO_PLENARIO, data_deliberacao: '2026-08-01'}
          - {sk_proposicao: p5, casa: SENADO, tipo_proposicao: PROJETO DE LEI, ementa: E, situacao_atual: X, fl_tramitando: 1, codigo_deliberacao: null, data_deliberacao: null}
          - {sk_proposicao: p6, casa: SENADO, tipo_proposicao: PROJETO DE LEI, ementa: F, situacao_atual: X, fl_tramitando: 0, codigo_deliberacao: PREJUDICADO, data_deliberacao: '2026-08-01'}
      - input: ref('seed_senado_deliberacoes_resultado')
        rows:
          - {codigo_deliberacao: APROVADA_NO_PLENARIO, resultado_legislativo: APROVADA}
          - {codigo_deliberacao: REJEITADO_PLENARIO, resultado_legislativo: REJEITADA}
          - {codigo_deliberacao: PREJUDICADO, resultado_legislativo: OUTRO}
    expect:
      rows:
        - {identificacao: PL 1/2023, votos_sim_ecidadania: 30, votos_nao_ecidadania: 5, total_votos_ecidadania: 35, qt_extracoes: 2, resultado_consulta: SIM, resultado_votacao: APROVADA, aderencia_consulta_publica: 1, motivo_aderencia_nula: null}
        - {identificacao: PL 2/2023, votos_sim_ecidadania: 1, votos_nao_ecidadania: 9, total_votos_ecidadania: 10, qt_extracoes: 1, resultado_consulta: NAO, resultado_votacao: APROVADA, aderencia_consulta_publica: 0, motivo_aderencia_nula: null}
        - {identificacao: PL 3/2023, votos_sim_ecidadania: 9, votos_nao_ecidadania: 1, total_votos_ecidadania: 10, qt_extracoes: 1, resultado_consulta: SIM, resultado_votacao: REJEITADA, aderencia_consulta_publica: 0, motivo_aderencia_nula: null}
        - {identificacao: PL 4/2023, votos_sim_ecidadania: 5, votos_nao_ecidadania: 5, total_votos_ecidadania: 10, qt_extracoes: 1, resultado_consulta: EMPATE, resultado_votacao: APROVADA, aderencia_consulta_publica: null, motivo_aderencia_nula: EMPATE NA CONSULTA}
        - {identificacao: PL 5/2023, votos_sim_ecidadania: 7, votos_nao_ecidadania: 3, total_votos_ecidadania: 10, qt_extracoes: 1, resultado_consulta: SIM, resultado_votacao: null, aderencia_consulta_publica: null, motivo_aderencia_nula: SEM DELIBERACAO}
        - {identificacao: PL 6/2023, votos_sim_ecidadania: 7, votos_nao_ecidadania: 3, total_votos_ecidadania: 10, qt_extracoes: 1, resultado_consulta: SIM, resultado_votacao: OUTRO, aderencia_consulta_publica: null, motivo_aderencia_nula: DELIBERACAO NAO BINARIA}
        - {identificacao: PL 7/2023, votos_sim_ecidadania: 7, votos_nao_ecidadania: 3, total_votos_ecidadania: 10, qt_extracoes: 1, resultado_consulta: SIM, resultado_votacao: null, aderencia_consulta_publica: null, motivo_aderencia_nula: MATERIA NAO ENCONTRADA NO SENADO}
