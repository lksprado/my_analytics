        description: "Verdadeiro quando os componentes do ano estão na escala 0 a 1 em vez de 0 a 10."
      - name: qt_votos_governismo
        description: "Votos em votações orientadas pelo Governo no ano."
      - name: qt_votos_alinhados_governo
        description: "Votos alinhados ao Governo no ano."
      - name: governismo_pct_modelo
        description: "Governismo calculado pelo modelo no ano (0–100)."
        tests:
          - dbt_utils.accepted_range:
