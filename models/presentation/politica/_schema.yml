version: 2

models:
  - name: governismo
    description: "Votos em votações orientadas pelo Governo. Grão: parlamentar × votação."
    columns:
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: sk_voto
        description: "Chave do registro de voto."
        tests:
          - not_null
          - unique
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
      - name: sk_votacao
        description: "Chave da votação."
        tests:
          - not_null
      - name: deputado_id_nk
        description: "Id do deputado na Câmara."
      - name: senador_id_nk
        description: "Id do senador no Senado."
      - name: nome
        description: "Nome parlamentar."
      - name: uf
        description: "UF de representação."
      - name: partido
        description: "Sigla do partido no momento do voto."
      - name: partido_nome
        description: "Nome do partido no momento do voto."
      - name: votacao_id_nk
        description: "Chave natural da votação na casa."
      - name: tipo_proposicao
        description: Tipo da proposição ou matéria votada.
      - name: legislatura
        description: Número da legislatura em que a votação ocorreu.
      - name: presidente
        description: Presidente da República em exercício na data da votação.
      - name: mandato
        description: Número do mandato do presidente (1, 2 ou 3).
      - name: aprovado
        description: 1 se a votação resultou em aprovação, 0 caso contrário.
      - name: voto
        description: "Voto do parlamentar (SIM, NAO, OBSTRUCAO)."
      - name: voto_governo
        description: "Orientação do Governo (SIM, NAO, OBSTRUCAO)."
      - name: voto_alinhado
        description: "1 quando o voto seguiu a orientação do Governo, 0 quando divergiu."
      - name: data_proposicao
        description: Data de apresentação da proposição votada.
      - name: data_votacao
        description: Data em que a votação ocorreu.
      - name: ano
        description: Ano da votação.
      - name: trimestre
        description: Trimestre do ano da votação (1 a 4).
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: governismo_por_parlamentar_legislatura
    description: "Governismo bruto. Grão: parlamentar × legislatura."
    columns:
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
      - name: deputado_id_nk
        description: "Id do deputado na Câmara."
      - name: senador_id_nk
        description: "Id do senador no Senado."
      - name: nome
        description: "Nome parlamentar."
      - name: uf
        description: "UF de representação."
      - name: legislatura
        description: Número da legislatura.
        tests:
          - not_null
      - name: qt_votos
        description: "Votos em votações orientadas pelo Governo."
      - name: qt_votacoes
        description: "Votações orientadas em que o parlamentar votou."
      - name: qt_votos_alinhados
        description: Votos em que o parlamentar seguiu a orientação do Governo.
      - name: qt_votos_nao_alinhados
        description: "Votos contrários à orientação do Governo."
      - name: perc_governismo
        description: "Percentual de governismo (0–100)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: governismo_por_parlamentar_legislatura_ajustado
    description: "Governismo bruto e ajustado por participação. Grão: parlamentar × legislatura."
    columns:
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
      - name: deputado_id_nk
        description: "Id do deputado na Câmara."
      - name: senador_id_nk
        description: "Id do senador no Senado."
      - name: legislatura
        description: Número da legislatura.
        tests:
          - not_null
      - name: qt_votos
        description: "Votos em votações orientadas pelo Governo."
      - name: qt_votacoes
        description: "Votações orientadas em que o parlamentar votou."
      - name: qt_votos_alinhados
        description: Votos em que o parlamentar seguiu a orientação do Governo.
      - name: qt_votos_nao_alinhados
        description: "Votos contrários à orientação do Governo."
      - name: perc_governismo
        description: "Percentual de governismo (0–100)."
      - name: score_governismo_ponderado
        description: "Governismo ajustado por participação (média bayesiana da casa e legislatura)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: votacoes_placar
    description: "Placar das votações nominais. Grão: uma votação."
    columns:
      - name: sk_votacao
        description: "Chave da votação."
        tests:
          - not_null
          - unique
      - name: votacao_id_nk
        description: "Chave natural da votação na casa."
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: data_votacao
        description: Data em que a votação ocorreu.
      - name: ano
        description: Ano da votação.
      - name: trimestre
        description: Trimestre do ano da votação (1 a 4).
      - name: legislatura
        description: "Número da legislatura."
      - name: presidente
        description: "Presidente da República em exercício."
      - name: mandato
        description: Número do mandato do presidente (1, 2 ou 3).
      - name: tipo_proposicao
        description: "Tipo da proposição votada."
      - name: proposicao_id_nk
        description: "Id da proposição votada na casa."
      - name: data_proposicao
        description: Data de apresentação da proposição objeto da votação.
      - name: aprovado
        description: 1 se a votação resultou em aprovação, 0 caso contrário.
      - name: qt_votantes
        description: "Votantes (SIM, NÃO ou OBSTRUÇÃO)."
      - name: qt_votos_sim
        description: Votos SIM.
      - name: qt_votos_nao
        description: Votos NAO.
      - name: qt_obstrucao
        description: Votos de OBSTRUCAO.
      - name: qt_partidos
        description: "Partidos distintos entre os votantes."
      - name: margem
        description: "Votos SIM menos votos NÃO."
      - name: perc_sim
        description: "Percentual de SIM sobre os votantes."
      - name: orientacao_governo
        description: "Orientação do Governo."
      - name: flag_unanimidade
        description: "Verdadeiro quando a votação teve só SIM ou só NÃO."
      - name: flag_votacao_apertada
        description: Verdadeiro quando perc_sim fica entre 45 e 55.
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: disciplina_partidaria
    description: "Votos em votações orientadas pelo próprio partido. Grão: parlamentar × votação."
    columns:
      - name: sk_voto
        description: "Chave do registro de voto."
        tests:
          - not_null
          - unique
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
      - name: sk_votacao
        description: "Chave da votação."
        tests:
          - not_null
      - name: votacao_id_nk
        description: "Chave natural da votação na casa."
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: nome
        description: "Nome parlamentar."
      - name: uf
        description: "UF de representação."
      - name: partido
        description: Sigla do partido vigente no momento do voto.
      - name: partido_nome
        description: Nome do partido vigente no momento do voto.
      - name: tipo_proposicao
        description: Tipo da proposição objeto da votação.
      - name: legislatura
        description: Número da legislatura em que a votação ocorreu.
      - name: presidente
        description: Presidente da República em exercício na data da votação.
      - name: mandato
        description: Número do mandato do presidente.
      - name: aprovado
        description: 1 se a votação resultou em aprovação, 0 caso contrário.
      - name: voto
        description: "Voto registrado pelo parlamentar (SIM, NAO, OBSTRUCAO)."
      - name: orientacao_partido
        description: "Orientação do partido do parlamentar."
      - name: voto_segue_partido
        description: "1 quando o voto seguiu a orientação do partido, 0 quando divergiu."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: data_votacao
        description: Data em que a votação ocorreu.
      - name: ano
        description: Ano da votação.
      - name: trimestre
        description: Trimestre do ano da votação (1 a 4).
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: comportamento_partidario
    description: "Comportamento das bancadas: coesão, governismo e disciplina. Grão: casa × partido × legislatura × presidente × trimestre."
    columns:
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: partido
        description: Sigla do partido vigente no momento dos votos agregados.
      - name: legislatura
        description: Número da legislatura.
      - name: presidente
        description: Presidente da República em exercício no período.
      - name: mandato
        description: Número do mandato do presidente.
      - name: ano
        description: Ano das votações agregadas.
      - name: trimestre
        description: Trimestre do ano das votações agregadas (1 a 4).
      - name: qt_parlamentares
        description: "Parlamentares distintos da bancada que votaram."
      - name: qt_votacoes
        description: "Votações em que a bancada votou."
      - name: qt_votos
        description: "Votos da bancada."
      - name: qt_votacoes_coesao
        description: "Votações com ao menos dois votos SIM/NÃO da bancada."
      - name: indice_rice_medio
        description: "Índice de Rice médio da bancada (0 = dividida, 1 = unânime)."
      - name: qt_votos_governismo
        description: "Votos da bancada em votações orientadas pelo Governo."
      - name: qt_votos_alinhados_governo
        description: "Votos da bancada alinhados ao Governo."
      - name: perc_governismo
        description: "Percentual de governismo da bancada (0–100)."
      - name: qt_votos_disciplina
        description: "Votos da bancada em votações orientadas pelo partido."
      - name: qt_votos_disciplinados
        description: "Votos da bancada que seguiram o partido."
      - name: perc_disciplina
        description: "Percentual de disciplina da bancada (0–100)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - partido
              - legislatura
              - presidente
              - mandato
              - ano
              - trimestre

  - name: painel_parlamentar
    description: "Painel do parlamentar com governismo, disciplina, participação e Ranking dos Políticos. Grão: parlamentar × legislatura."
    columns:
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
      - name: deputado_id_nk
        description: "Id do deputado na Câmara."
      - name: senador_id_nk
        description: "Id do senador no Senado."
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: nome
        description: "Nome parlamentar."
      - name: nome_completo
        description: Nome civil do parlamentar.
      - name: sexo
        description: "Sexo do parlamentar (MASCULINO, FEMININO)."
      - name: uf
        description: "UF de representação."
      - name: partido_predominante
        description: "Partido com mais votos do parlamentar na legislatura."
      - name: legislatura
        description: Número da legislatura.
        tests:
          - not_null
      - name: qt_votos_legislatura
        description: "Votos do parlamentar na legislatura."
      - name: qt_votacoes_legislatura
        description: "Votações em que o parlamentar votou na legislatura."
      - name: qt_votacoes_casa
        description: "Votações nominais da casa na legislatura."
      - name: perc_participacao
        description: "Percentual das votações da casa em que o parlamentar votou."
      - name: qt_votos_governismo
        description: Votos do parlamentar em votações com orientação do Governo.
      - name: qt_votos_alinhados_governo
        description: Votos em que o parlamentar seguiu a orientação do Governo.
      - name: perc_governismo
        description: "Percentual de governismo na legislatura (0–100)."
      - name: score_governismo_ponderado
        description: "Governismo ajustado por participação."
      - name: qt_votos_disciplina
        description: "Votos em votações orientadas pelo partido."
      - name: qt_votos_disciplinados
        description: "Votos que seguiram a orientação do partido."
      - name: perc_disciplina
        description: "Percentual de disciplina partidária (0–100)."
      - name: pontuacao_geral
        description: "Pontuação atual no Ranking dos Políticos; só na legislatura corrente."
      - name: ranking_geral
        description: Posição no ranking geral do Ranking dos Políticos.
      - name: ranking_casa
        description: Posição no ranking dentro da casa.
      - name: ranking_partido
        description: Posição no ranking dentro do partido.
      - name: ranking_estado
        description: Posição no ranking dentro do estado.
      - name: ranking_casa_estado
        description: Posição no ranking dentro da casa e do estado.
      - name: percentil_governismo
        description: "Percentil de governismo na casa e legislatura (0 a 1)."
      - name: percentil_pontuacao
        description: "Percentil de pontuação no Ranking dos Políticos (0 a 1)."
      - name: gap_percentil
        description: "Percentil de pontuação menos percentil de governismo."
      - name: quadrante
        description: "Quadrante governismo × pontuação, pelas medianas da casa e legislatura."
        tests:
          - accepted_values:
              arguments:
                values:
                  - governista bem avaliado
                  - governista mal avaliado
                  - oposicao bem avaliada
                  - oposicao mal avaliada
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_parlamentar
              - legislatura

  - name: score_vs_governismo
    description: "Ranking dos Políticos × governismo. Grão: parlamentar × ano."
    columns:
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
      - name: deputado_id_nk
        description: "Id do deputado na Câmara."
      - name: senador_id_nk
        description: "Id do senador no Senado."
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: nome
        description: "Nome parlamentar."
      - name: uf
        description: "UF de representação."
      - name: partido_predominante
        description: "Partido com mais votos do parlamentar no ano."
      - name: ano
        description: "Ano de referência."
      - name: legislatura
        description: "Legislatura com mais votos do parlamentar no ano."
      - name: pontuacao
        description: "Pontuação no Ranking dos Políticos no ano (0 a 10)."
      - name: nota_base_votacoes
        description: "Nota de votações; depende da posição de voto, portanto correlacionada ao governismo."
      - name: nota_base_gastos
        description: "Nota de gastos."
      - name: nota_base_presenca
        description: "Nota de presença."
      - name: nota_base_privilegios
        description: "Nota de privilégios."
      - name: bonus_processos
        description: "Bônus ou penalidade por processos."
      - name: bonus_producao_legislativa
        description: "Bônus por produção legislativa."
      - name: bonus_articulacao_legislativa
        description: "Bônus por articulação legislativa."
      - name: flag_componentes_normalizados
        description: "Verdadeiro quando os componentes do ano estão na escala 0 a 1 em vez de 0 a 10."
      - name: qt_votos_governismo
        description: "Votos em votações orientadas pelo Governo no ano."
      - name: qt_votos_alinhados_governo
        description: "Votos alinhados ao Governo no ano."
      - name: perc_governismo
        description: "Percentual de governismo no ano (0–100)."
      - name: qt_votos_disciplina
        description: Votos do ano em votações com orientação do próprio partido.
      - name: perc_disciplina
        description: "Percentual de disciplina partidária no ano (0–100)."
      - name: percentil_governismo
        description: "Percentil de governismo na casa e ano (0 a 1)."
      - name: percentil_pontuacao
        description: "Percentil de pontuação no Ranking dos Políticos (0 a 1)."
      - name: gap_percentil
        description: "Percentil de pontuação menos percentil de governismo."
      - name: quadrante
        description: Cruzamento dos dois eixos pelas medianas da casa e do ano.
        tests:
          - accepted_values:
              arguments:
                values:
                  - governista bem avaliado
                  - governista mal avaliado
                  - oposicao bem avaliada
                  - oposicao mal avaliada
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_parlamentar
              - ano

  - name: score_vs_governismo_por_partido
    description: "Ranking dos Políticos × governismo por bancada. Grão: casa × partido × ano."
    columns:
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: partido
        description: Sigla predominante dos parlamentares agregados.
      - name: ano
        description: Ano da avaliação.
      - name: qt_parlamentares
        description: "Parlamentares da bancada no ano."
      - name: pontuacao_media
        description: Média simples da pontuação dos parlamentares da bancada.
      - name: nota_base_votacoes_media
        description: "Nota de votações média."
      - name: nota_base_gastos_media
        description: Média da nota de gastos.
      - name: nota_base_presenca_media
        description: Média da nota de presença.
      - name: perc_governismo_medio
        description: "Governismo médio dos parlamentares (0–100)."
      - name: perc_governismo_ponderado
        description: "Governismo da bancada ponderado por votos (0–100)."
      - name: perc_disciplina_ponderado
        description: "Disciplina da bancada ponderada por votos (0–100)."
      - name: flag_componentes_normalizados
        description: "Verdadeiro quando os componentes do ano estão na escala 0 a 1."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - partido
              - ano

  - name: ecidadania_bignumbers
    description: "Totais de votações e votantes do e-Cidadania. Grão: um dia."
    columns:
      - name: data_extracao
        description: Data de extração dos dados da fonte.
      - name: total_proposicoes_votadas
        description: Quantidade total de proposições que receberam votos.
      - name: total_pessoas_votaram
        description: Quantidade total de pessoas distintas que votaram.
      - name: total_votos_registrados
        description: Quantidade total de votos registrados na plataforma.
      - name: votos_por_pessoa
        description: "Média de votos por pessoa."
      - name: ano
        description: "Ano."
      - name: mes_do_ano
        description: "Mês do ano (1–12)."
      - name: dia_do_ano
        description: "Dia do ano (1–366)."
      - name: nome_dia_semana
        description: "Nome do dia da semana."
      - name: nome_dia_semana_abrev
        description: "Dia da semana abreviado."
      - name: nome_mes
        description: "Nome do mês."
      - name: nome_mes_abrev
        description: "Mês abreviado."
      - name: fl_fim_de_semana
        description: "Verdadeiro aos sábados e domingos."
      - name: fl_feriado
        description: "Verdadeiro em feriado nacional ou ponto facultativo bancário."

  - name: ecidadania_proposicoes
    description: "Proposições do e-Cidadania com tramitação do Senado (desabilitado)."
    columns:
      - name: data_extracao
        description: Data de extração dos dados da fonte.
      - name: sk_proposicao_ecidadania
        description: "Chave da proposição no e-Cidadania."
        tests:
          - not_null
      - name: proposicao_id_nk
        description: "Identificação da proposição (ex.: PL 123/2024)."
      - name: ano_proposicao
        description: Ano de apresentação da proposição.
      - name: apelido
        description: Apelido ou nome popular da proposição.
      - name: ementa
        description: Ementa descritiva da proposição.
      - name: tramitando
        description: Indica se a proposição está em tramitação ativa.
      - name: votos_sim
        description: Quantidade de votos favoráveis à proposição.
      - name: votos_nao
        description: Quantidade de votos contrários à proposição.
      - name: total_votos
        description: Total de votos registrados para a proposição.
      - name: vontade_popular
        description: "Vontade popular (SIM, NÃO) pela maioria dos votos."
      - name: tipo_deliberacao
        description: Categoria do tipo de deliberação da proposição.
      - name: aderencia_vontade_popular
        description: "Aderência entre a deliberação e a vontade popular."
      - name: flag_mais_votado_no_dia
        description: "Verdadeiro quando a proposição estava entre as mais votadas do dia."
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: status_consultado
        description: Status da consulta pública associada à proposição.
      - name: nome_ente
        description: Nome do ente vinculado à proposição.
      - name: descricao_proposicao
        description: Descrição completa do tipo de proposição.
      - name: data_apresentacao
        description: Data de apresentação da proposição.
      - name: autoria
        description: "Autoria da proposição."
      - name: descricao_deliberacao
        description: Descrição textual do tipo de deliberação.
      - name: data_deliberacao
        description: Data da deliberação/votação mais recente.
      - name: norma_gerada
        description: Norma jurídica gerada pela proposição, se aprovada.
      - name: link_documento
        description: URL para o documento oficial da proposição.
      - name: link_votacao
        description: URL para a votação da proposição na plataforma e-Cidadania.

  - name: comparativo_governismo_legislatura
    description: "Governismo calculado × publicado pelo Radar Congresso, na legislatura corrente. Grão: parlamentar."
    columns:
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
          - unique
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: deputado_id_nk
        description: "Id do deputado na Câmara."
      - name: senador_id_nk
        description: "Id do senador no Senado."
      - name: nome
        description: "Nome parlamentar."
      - name: uf
        description: "UF de representação."
      - name: partido_predominante
        description: "Partido com mais votos do parlamentar na legislatura."
      - name: id_parlamentar_radar
        description: "Id do parlamentar no Radar Congresso."
      - name: qt_votos_oficial
        description: "Votos em votações orientadas, no cálculo próprio."
      - name: qt_votos_alinhados_oficial
        description: "Votos alinhados ao Governo, no cálculo próprio."
      - name: qt_votos_radar
        description: "Votos em votações orientadas, segundo o Radar."
      - name: qt_votos_alinhados_radar
