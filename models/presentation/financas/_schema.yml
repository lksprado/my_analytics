        description: "Datas especiais do mês (separadas por ' / ') ou 'NORMAL'; explica picos em role e diversos."
      - name: trimestre
        description: "Trimestre do ano (1 a 4)."
      - name: ano
        description: "Ano com quatro dígitos."
