  - name: resultado
    description: >
      DRE mensal do casal (receita por origem, despesa por categoria e resultado), um registro por mês
      de competência. Contém meses futuros com as fixas pré-agendadas, que não entram em média nem diagnóstico.
    columns:
      - name: mes_debito
        description: >
          Primeiro dia do mês de competência.
          {{ doc('ciclo_fatura') }}
        data_tests:
          - unique
          - not_null
      - name: fl_mes_especial
        description: "Indica se o mês tem data especial."
