  - name: luz
    description: >
      Conta de energia por mês, para separar efeito preço (preco_kwh) de efeito consumo (kwh_dia).
      É parcela da categoria apartamento; nunca some os dois.
    columns:
      - name: mes
        description: "Primeiro dia do mês de referência da conta."
      - name: trimestre
        description: "Trimestre do ano (1 a 4)."
      - name: ano
        description: "Ano com quatro dígitos."
      - name: vlr_fatura
        description: "Valor da fatura de energia, em reais."
      - name: kwh
        description: "Consumo de energia no período, em kWh."
      - name: dias
        description: "Dias do período de faturamento."
      - name: kwh_dia
        description: "Consumo médio diário, em kWh."
      - name: preco_kwh
        description: "Preço médio por kWh, em reais."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."
