  - name: consumo
    description: >
      Despesa diária do casal por categoria, em reais, um registro por data. Contém meses futuros
      com as fixas pré-agendadas, que não entram em média nem diagnóstico.
    columns:
      - name: mes
        description: >
          Primeiro dia do mês de competência.
