  - name: indicadores
    description: >
      Indexadores mensais (inflação pessoal, IPCA, IGP-M, Selic e CDI), com a taxa do mês e o índice
      acumulado. Mês recente com taxa nula é índice ainda não publicado ou não digitado.
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base."
        tests:
          - unique
          - not_null
      - name: trimestre
        description: "Trimestre do ano (1 a 4)."
      - name: ano
