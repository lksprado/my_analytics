version: 2

models:
  - name: carteira
    description: >
      Uma linha por posição (mês, titular, instituição e ativo), com camada, conglomerado FGC e
      vencimento. Base dos marts de carteira e de risco FGC.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mes_base
              - pessoa
              - instituicao
              - codigo_ativo
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base."
      - name: mes_final
        description: "Último dia do mês-base."
      - name: trimestre
        description: "Trimestre do ano (1 a 4)."
      - name: ano
        description: "Ano com quatro dígitos."
      - name: pessoa
        description: "Titular (lucas, jessica ou deusa)."
      - name: instituicao
        description: "Corretora, banco ou custodiante, com nome padronizado."
      - name: emissor
        description: "Instituição emissora do título (só renda fixa)."
      - name: conglomerado_fgc
        description: "Conglomerado financeiro do emissor, para o limite de garantia do FGC."
      - name: classe_ativo
        description: "Classe do ativo (RENDA FIXA, RENDA VARIAVEL ou DISPONIBILIDADE)."
      - name: tipo_ativo
        description: "Tipo do ativo (ACAO, FUNDO, TITULO PUBLICO, TITULO PRIVADO ou CONTA CORRENTE)."
      - name: codigo_ativo
        description: "Código do ativo na fonte (ticker B3, ISIN do Tesouro, CUSIP da Avenue ou código sintético da conta)."
      - name: camada
        description: '{{ doc("camada_investimento") }}'
      - name: ativo
        description: "Nome do ativo ('SALDO EM CONTA' nas disponibilidades)."
      - name: indexador
        description: "Indexador de rentabilidade (renda fixa e conta remunerada)."
      - name: data_vencimento
        description: "Data de vencimento do título (só renda fixa)."
      - name: vencimento_em_dias
        description: "Dias até o vencimento; nulo se vencido ou sem vencimento."
      - name: fl_vencido
        description: "Indica se o título já venceu."
      - name: vlr_atualizado_brl
        description: "Valor de mercado da posição, em reais inteiros."
      - name: moeda_ativo
        description: "Moeda de origem do ativo (BRL, USD ou BTC)."
      - name: fonte_dado
        description: '{{ doc("fonte_dado") }}'
        data_tests:
          - accepted_values:
              arguments:
                values: ['RELATORIO B3', 'RELATORIO AVENUE', 'SEED', 'GOOGLE SHEETS']
      - name: fl_mes_atual
        description: "Indica se a linha é do mês-base mais recente da carteira."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: carteira_agregada
    description: >
      Total da carteira por titular e mês, com a separação investido x disponível e uma coluna por
      instituição. As colunas por instituição somam total_geral.
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base."
      - name: mes_final
        description: "Último dia do mês-base."
      - name: pessoa
        description: "Titular (lucas, jessica ou deusa)."
      - name: total_geral
        description: "Total da carteira do titular no mês, em reais inteiros."
      - name: total_disponibilidades
        description: "Parcela em DISPONIBILIDADE (saldo em conta, cashback, Wise, bitcoin e caixa da Avenue), em reais inteiros."
      - name: total_investido
        description: "Parcela investida (renda fixa e renda variável), em reais inteiros."
      - name: autocustodia
        description: "Total em autocustódia no mês, em reais inteiros."
      - name: avenue
        description: "Total na Avenue no mês, em reais inteiros."
      - name: banco_do_brasil
        description: "Total no Banco do Brasil no mês, em reais inteiros."
      - name: bradesco
        description: "Total no Bradesco no mês, em reais inteiros."
      - name: daycoval
        description: "Total no Daycoval no mês, em reais inteiros."
      - name: itau
        description: "Total no Itaú no mês, em reais inteiros."
      - name: nubank
        description: "Total no Nubank no mês, em reais inteiros."
      - name: sofisa
        description: "Total no Sofisa no mês, em reais inteiros."
      - name: wise
        description: "Total na Wise no mês, em reais inteiros."
      - name: vlr_liquido_usd
        description: "Saldo da Avenue na moeda original (USD); não somar às colunas em reais."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

