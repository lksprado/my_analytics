      - name: ajuste_realizado
        description: '{{ doc("ajuste") }}'
      - name: total_despesas
        description: "Despesa total do mês, em reais."
      - name: resultado
        description: "Receita total menos despesa total do mês, em reais."
      - name: total_salario
        description: "Receita de salário no mês, em reais."
      - name: total_dividendo
