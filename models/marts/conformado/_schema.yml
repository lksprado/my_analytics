version: 2

models:
  - name: dim_datas
    description: >
      Dimensão de datas do warehouse pessoal: o calendário de int_dates (data_sk, atributos de
      calendário, feriados e dia útil) acrescido das marcações de data especial vindas do seed
      seed_datas_especiais. Um registro por dia, de 1900-01-01 a 2100-12-31. É a dimensão de junção
      de finanças, energia, livros e nhl — carteira, patrimônio, consumo e DRE ligam-se a ela por
      mes_base/data.
      As datas especiais são aniversários e efemérides da família; eventos com ano_inicio (ex.:
      casamento) só passam a valer a partir daquele ano. Servem para explicar picos de gasto em
      `role` e `diversos` como sazonalidade conhecida, e não como descontrole.
    columns:
      - name: data_sk
        description: "Chave surrogate da data no formato AAAAMMDD como inteiro (ex.: 20260131), herdada de int_dates."
        tests:
          - not_null
          - unique
      - name: date_day
        description: "Data do dia — chave natural, herdada de int_dates. As demais colunas de calendário estão descritas em int_dates."
      - name: data
        description: "Alias para date_day em português."
      - name: fl_data_especial
        description: "1 quando o dia exato é uma data especial (dia + mês batem, respeitado o ano_inicio); 0 caso contrário."
      - name: fl_mes_especial
        description: "1 quando o MÊS contém alguma data especial vigente; 0 caso contrário. É mais abrangente que fl_data_especial — todo dia de um mês especial recebe 1."
      - name: motivo
        description: "Descrição da data especial em maiúsculas (ex.: ANIVERSARIO), ou 'NORMAL' quando o dia não é especial."
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: dim_dates
    description: >
      English-language mirror of dim_datas: date dimension with calendar attributes and
      national holidays, without family-specific date markings. One row per day from 1900-01-01 to
      2100-12-31. Safe for publication in public domains; sensitive fields (fl_data_especial/motivo)
      are not exposed.
    columns:
      - name: date_sk
        description: "Date surrogate key in YYYYMMDD format as integer (e.g., 20260131)."
        tests:
          - not_null
          - unique
      - name: date_day
        description: "Calendar day — natural key. Other calendar attributes are described in int_dates."
      - name: holiday_name
        description: "Name of the holiday (e.g., CHRISTMAS, GOOD FRIDAY); multiple holidays on the same day are joined with ' / '. NULL for non-holiday dates."
      - name: holiday_type
        description: "NATIONAL for national holidays, OPTIONAL HOLIDAY for Carnival and Corpus Christi (which close banks and exchanges). NULL for non-holiday dates."
        tests:
          - accepted_values:
              arguments:
                values: ['NATIONAL', 'OPTIONAL HOLIDAY']
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."
