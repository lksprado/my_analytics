version: 2

models:
  - name: dim_products
    description: "Dimensão conformed de produtos do Atacadão com normalização de nome, marca, unidade e quantidade."
    columns:
      - name: sku
        description: "Identificador único do produto."
        data_tests:
          - unique
          - not_null
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: fct_products
    description: "Preços históricos de produtos do Atacadão por data de extração."
    columns:
      - name: product_sk
        data_tests:
          - not_null
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."
