
version: 2

models:
  - name: fct_book_pricing
    description: >
      Preços dos livros — uma linha por livro por dia observado. O estado atual
      de cada livro é `WHERE is_latest_observation`. Colunas `*_ever`,
      `last_observed_at`, `reference_date`, `days_since_last_observed`,
      `is_stale_price`, `price_vs_min_ever`, `pct_above_min_ever` e
      `is_at_record_low` comparam com o histórico inteiro, visto de hoje; as
      demais valem para a data da linha. Ver `int_books_prices` para a
      descrição de cada coluna.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - book_sk
              - created_date
    columns:
      - name: book_sk
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_book')
                field: book_sk
      - name: created_date
        data_tests:
          - not_null
      - name: price_new
        data_tests:
          - not_null
  - name: dim_book
    description: "Todos os livros"
    columns:
      - name: book_sk
        data_tests:
          - unique
          - not_null
