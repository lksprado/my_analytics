          - {casa: CAMARA, votacao_id_nk: '2-1', sigla_lideranca: FDR PSOLREDE, partido_id_senado: null, orientacao_voto: SIM}
      - input: ref('dim_partidos')
        rows:
          - {sk_partido: pt71, partido_id_nk: 71}
          - {sk_partido: psol458, partido_id_nk: 458}
          - {sk_partido: pl523, partido_id_nk: 523}
      - input: ref('dim_parlamentares')
        rows:
          - {sk_parlamentar: d1, casa: CAMARA, deputado_id_nk: 1}
          - {sk_parlamentar: d2, casa: CAMARA, deputado_id_nk: 2}
          - {sk_parlamentar: d3, casa: CAMARA, deputado_id_nk: 3}
      - input: ref('dim_tipo_voto')
        rows:
