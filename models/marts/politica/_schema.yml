unit_tests:

  - name: fct_votacoes_placar_e_resultado_alinhado_governo
    description: >
      Votantes são só SIM, NÃO e OBSTRUÇÃO. O resultado é alinhado ao Governo quando segue a
      orientação SIM, ou NÃO/OBSTRUÇÃO com rejeição; sem classificação, o motivo fica explícito.
      A modalidade separa nominal aberta, nominal secreta e sem registro nominal.
    model: fct_votacoes
    given:
      - input: ref('int_votacoes_unificadas')
        rows:
          - {casa: CAMARA, votacao_id_nk: '1-1', sessao_id: '395', data_votacao: '2023-05-10', sigla_orgao: PLEN, descricao: A, proposicao_id_nk: 10, aprovado: 1, fl_secreta: 0, classe_votacao: MERITO}
          - {casa: CAMARA, votacao_id_nk: '1-2', sessao_id: '395', data_votacao: '2023-05-10', sigla_orgao: CCJC, descricao: B, proposicao_id_nk: null, aprovado: 0, fl_secreta: 0, classe_votacao: PARECER}
          - {casa: SENADO, votacao_id_nk: '99', sessao_id: '7', data_votacao: '2023-05-11', sigla_orgao: PLEN, descricao: C, proposicao_id_nk: 20, aprovado: 1, fl_secreta: 1, qt_votos_sim_secreta: 50, qt_votos_nao_secreta: 20, qt_abstencao_secreta: 2, classe_votacao: AUTORIDADE}
          - {casa: CAMARA, votacao_id_nk: '1-3', sessao_id: '396', data_votacao: '2023-05-12', sigla_orgao: PLEN, descricao: D, proposicao_id_nk: null, aprovado: 0, fl_secreta: 0, classe_votacao: MERITO}
          - {casa: CAMARA, votacao_id_nk: '1-4', sessao_id: '396', data_votacao: '2023-05-12', sigla_orgao: PLEN, descricao: E, proposicao_id_nk: null, aprovado: null, fl_secreta: 0, classe_votacao: MERITO}
          - {casa: CAMARA, votacao_id_nk: '1-5', sessao_id: '396', data_votacao: '2023-05-12', sigla_orgao: PLEN, descricao: F, proposicao_id_nk: null, aprovado: 1, fl_secreta: 0, classe_votacao: MERITO}
