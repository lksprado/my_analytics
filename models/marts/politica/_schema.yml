  - name: fct_presencas_plenario_cobertura
    description: >
      Câmara: o deputado é elegível às votações nominais do Plenário entre o seu primeiro e o seu
      último voto na legislatura; sem registro nesse intervalo, a ausência é inferida e herda a UF
      e o partido do voto anterior. Comissões ficam de fora. Senado: vale a lista de registros.
    model: fct_presencas_plenario
    given:
      - input: ref('fct_votacoes')
        rows:
          - {sk_votacao: v1, casa: CAMARA, sk_data: 20230110, sk_orgao: plen_c, modalidade_votacao: NOMINAL ABERTA, fl_governo_orientou: 1}
          - {sk_votacao: v2, casa: CAMARA, sk_data: 20230111, sk_orgao: plen_c, modalidade_votacao: NOMINAL ABERTA, fl_governo_orientou: 1}
          - {sk_votacao: v3, casa: CAMARA, sk_data: 20230112, sk_orgao: plen_c, modalidade_votacao: NOMINAL ABERTA, fl_governo_orientou: 0}
          - {sk_votacao: v4, casa: CAMARA, sk_data: 20230113, sk_orgao: plen_c, modalidade_votacao: NOMINAL ABERTA, fl_governo_orientou: 1}
          - {sk_votacao: vc, casa: CAMARA, sk_data: 20230111, sk_orgao: ccjc, modalidade_votacao: NOMINAL ABERTA, fl_governo_orientou: 1}
          - {sk_votacao: v0, casa: CAMARA, sk_data: 20230111, sk_orgao: plen_c, modalidade_votacao: SEM REGISTRO NOMINAL, fl_governo_orientou: 0}
          - {sk_votacao: vs1, casa: SENADO, sk_data: 20230110, sk_orgao: plen_s, modalidade_votacao: NOMINAL ABERTA, fl_governo_orientou: 1}
          - {sk_votacao: vs2, casa: SENADO, sk_data: 20230111, sk_orgao: plen_s, modalidade_votacao: NOMINAL SECRETA, fl_governo_orientou: 0}
      - input: ref('fct_votos')
        rows:
          - {sk_voto: a, sk_votacao: v1, sk_parlamentar: d1, casa: CAMARA, sk_tipo_voto: t_sim, voto: SIM, sk_partido: pt, uf: SP}
          - {sk_voto: b, sk_votacao: v3, sk_parlamentar: d1, casa: CAMARA, sk_tipo_voto: t_nao, voto: NAO, sk_partido: pt, uf: SP}
          - {sk_voto: c, sk_votacao: vc, sk_parlamentar: d1, casa: CAMARA, sk_tipo_voto: t_sim, voto: SIM, sk_partido: pt, uf: SP}
          - {sk_voto: d, sk_votacao: vs1, sk_parlamentar: s1, casa: SENADO, sk_tipo_voto: t_aj, voto: null, sk_partido: mdb, uf: RS}
          - {sk_voto: e, sk_votacao: vs2, sk_parlamentar: s1, casa: SENADO, sk_tipo_voto: t_sec, voto: null, sk_partido: mdb, uf: RS}
      - input: ref('dim_orgaos')
        rows:
          - {sk_orgao: plen_c, tipo_orgao: PLENARIO}
          - {sk_orgao: ccjc, tipo_orgao: COMISSAO}
          - {sk_orgao: plen_s, tipo_orgao: PLENARIO}
      - input: ref('dim_tipo_voto')
        rows:
          - {sk_tipo_voto: t_sim, categoria: VOTOU, fl_presente: 1}
          - {sk_tipo_voto: t_nao, categoria: VOTOU, fl_presente: 1}
          - {sk_tipo_voto: t_aj, categoria: AUSENCIA JUSTIFICADA, fl_presente: 0}
          - {sk_tipo_voto: t_sec, categoria: VOTO SECRETO, fl_presente: 1}
      - input: ref('dim_calendario_legislativo')
        rows:
          - {data_sk: 20230110, data: '2023-01-10', legislatura: 56}
          - {data_sk: 20230111, data: '2023-01-11', legislatura: 56}
          - {data_sk: 20230112, data: '2023-01-12', legislatura: 56}
          - {data_sk: 20230113, data: '2023-01-13', legislatura: 56}
    expect:
      rows:
        - {sk_parlamentar: d1, sk_votacao: v1, casa: CAMARA, categoria_presenca: VOTOU, fl_presente: 1, fl_ausencia_inferida: 0, fl_votou_com_posicao: 1, fl_governo_orientou: 1, sk_partido: pt, uf: SP}
        - {sk_parlamentar: d1, sk_votacao: v2, casa: CAMARA, categoria_presenca: AUSENCIA INFERIDA, fl_presente: 0, fl_ausencia_inferida: 1, fl_votou_com_posicao: 0, fl_governo_orientou: 1, sk_partido: pt, uf: SP}
        - {sk_parlamentar: d1, sk_votacao: v3, casa: CAMARA, categoria_presenca: VOTOU, fl_presente: 1, fl_ausencia_inferida: 0, fl_votou_com_posicao: 1, fl_governo_orientou: 0, sk_partido: pt, uf: SP}
        - {sk_parlamentar: s1, sk_votacao: vs1, casa: SENADO, categoria_presenca: AUSENCIA JUSTIFICADA, fl_presente: 0, fl_ausencia_inferida: 0, fl_votou_com_posicao: 0, fl_governo_orientou: 1, sk_partido: mdb, uf: RS}
        - {sk_parlamentar: s1, sk_votacao: vs2, casa: SENADO, categoria_presenca: VOTO SECRETO, fl_presente: 1, fl_ausencia_inferida: 0, fl_votou_com_posicao: 0, fl_governo_orientou: 0, sk_partido: mdb, uf: RS}

  - name: fct_votos_bancada_do_partido
    description: >
      A bancada do voto é a federação ou bloco que contém o partido do parlamentar na data da
      votação; a disciplina de bancada compara o voto com a orientação dela. Participação
      encerrada não vale.
    model: fct_votos
    given:
      - input: ref('int_votos_unificados')
        rows:
          - {casa: CAMARA, parlamentar_id_nk: 1, votacao_id_nk: '2-1', partido: PT, partido_id_senado: 71, codigo_voto: SIM, voto: SIM}
          - {casa: CAMARA, parlamentar_id_nk: 2, votacao_id_nk: '2-1', partido: PSOL, partido_id_senado: 458, codigo_voto: NAO, voto: NAO}
          - {casa: CAMARA, parlamentar_id_nk: 3, votacao_id_nk: '2-1', partido: PL, partido_id_senado: 523, codigo_voto: SIM, voto: SIM}
      - input: ref('fct_votacoes')
        rows:
          - {sk_votacao: v21, casa: CAMARA, votacao_id_nk: '2-1', sk_data: 20230510, sk_proposicao: '0', sk_orgao: o_plen_c, sk_tipo_votacao: tv, orientacao_governo: SIM, fl_aprovada: 1, fl_governo_orientou: 1}
      - input: ref('int_orientacoes_unificadas')
        rows:
