version: 2

models:

  - name: dim_parlamentares
    description: Dimensão conformada unificada de parlamentares (senadores e deputados). União direta de int_deputados_padronizados e int_senadores_padronizados com sk_parlamentar gerado.
    columns:
      - name: sk_parlamentar
        description: Chave substituta estável do parlamentar.
        tests:
          - not_null
          - unique
      - name: deputado_id_nk
        description: Chave natural do deputado na fonte da Câmara. Nulo para senadores.
      - name: senador_id_nk
        description: Chave natural do senador na fonte do Senado. Nulo para deputados.
      - name: radar_deputado_id_fk
        description: "Identificador do deputado no Radar Congresso (idparlamentarvoz), não o id oficial da casa. Nulo para senadores."
      - name: radar_senador_id_fk
        description: "Identificador do senador no Radar Congresso (idparlamentarvoz), não o id oficial da casa. Nulo para deputados."
      - name: casa
        description: Casa legislativa (CAMARA ou SENADO).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CAMARA', 'SENADO', 'desconhecido']
      - name: nome
        description: Nome eleitoral / parlamentar.
      - name: nome_completo
        description: Nome civil completo.
      - name: sexo
        description: Sexo informado no cadastro (MASCULINO/FEMININO).
        tests:
          - accepted_values:
              arguments:
                values: ['MASCULINO', 'FEMININO', 'desconhecido']
      - name: uf
        description: UF de representação do mandato mais recente, nas duas casas.
      - name: regiao
        description: Região da UF de representação (NORTE, NORDESTE, CENTRO-OESTE, SUDESTE, SUL).
        tests:
          - accepted_values:
              arguments:
                values: ['NORTE', 'NORDESTE', 'CENTRO-OESTE', 'SUDESTE', 'SUL', 'desconhecido']
      - name: data_nascimento
        description: Data de nascimento; só a Câmara traz. Para faixa etária, calcular contra a data do voto.
      - name: escolaridade
        description: Escolaridade declarada; só a Câmara traz.
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: dim_proposicoes
    description: "Dimensão de proposições unificada (Câmara e Senado) com linha dummy para chaves órfãs. Alimenta fct_votacoes e, por herança, fct_votos."
    columns:
      - name: sk_proposicao
        description: Chave substituta da proposição (casa + id).
        tests:
          - not_null
          - unique
      - name: casa
        description: Casa legislativa de origem da proposição (CAMARA ou SENADO).
      - name: proposicao_id_nk
        description: Chave natural da proposição na casa de origem.
      - name: tipo_proposicao
        description: Tipo da proposição padronizado em maiúsculas (ex. PL, PEC).
      - name: data_proposicao
        description: Data de apresentação da proposição.
      - name: identificacao
        description: "Identificação legível (sigla número/ano, ex.: PL 1234/2023)."
      - name: ementa
        description: Ementa da proposição; só a Câmara traz.
      - name: situacao_atual
        description: Situação atual de tramitação (foto da última carga, não histórico).
      - name: regime
        description: Regime de tramitação atual (urgência, prioridade...); só a Câmara traz.
      - name: autoria
        description: Autoria da proposição; só o Senado traz.
      - name: norma_gerada
        description: Norma gerada quando a proposição foi transformada em lei; só o Senado traz.
      - name: sk_data
        description: Chave substituta de data (YYYYMMDD) da apresentação da proposição.
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: dim_tipo_voto
    description: >
      Dimensão do registro de voto: cada código de origem das duas casas (seed_tipos_voto) com a
      posição normalizada e a categoria de presença. É o que permite a fct_votos guardar abstenção,
      presidência, voto secreto, presença sem voto e ausências sem misturá-los com o placar.
    columns:
      - name: sk_tipo_voto
        description: Chave substituta do tipo de voto (casa + código de origem).
        tests:
          - not_null
          - unique
      - name: casa
        description: Casa legislativa (CAMARA ou SENADO).
      - name: codigo_origem
        description: "Código do voto como vem da origem (tipovoto da Câmara, sigla_voto do Senado; 'NAO INFORMADO' quando vazio)."
      - name: descricao
        description: Descrição legível do código.
      - name: posicao
        description: "Posição normalizada (SIM, NAO, OBSTRUCAO, ABSTENCAO, BRANCO). Nula quando o registro não é voto: presidência, voto secreto, presença sem voto e ausências."
      - name: categoria
        description: Categoria do registro.
        tests:
          - accepted_values:
              arguments:
                values: ['VOTOU', 'VOTO SECRETO', 'PRESENTE SEM VOTO', 'PRESIDENCIA', 'AUSENCIA JUSTIFICADA', 'AUSENCIA NAO JUSTIFICADA', 'NAO INFORMADO', 'desconhecido']
      - name: fl_presente
        description: 1 quando o registro implica presença na sessão, 0 quando é ausência; nulo quando a origem não informa.
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: dim_calendario_legislativo
    description: >
      Calendário do domínio político: o recorte público de dim_datas (mesma chave data_sk, sem as
      datas especiais da família) acrescido de legislatura, sessão legislativa, presidente em
      exercício e anos eleitorais. É onde o recorte temporal e institucional das votações é resolvido
      uma vez só; as fatos ligam-se a ele por sk_data.
    columns:
      - name: data_sk
        description: "Chave surrogate da data no formato AAAAMMDD como inteiro (ex.: 20260131), a mesma de dim_datas."
        tests:
          - not_null
          - unique
      - name: data
        description: Data do dia. As demais colunas de calendário estão descritas em dim_datas e int_dates.
      - name: legislatura
        description: Número da legislatura (49 a 58), de seed_legislaturas. Nula fora da cobertura da seed.
      - name: sessao_legislativa
        description: "Sessão legislativa dentro da legislatura (1 a 4), contada de 1º/fev a 31/jan: janeiro ainda pertence à sessão do ano anterior."
      - name: presidente
        description: >
          Presidente da República em exercício na data, de seed_executivo_presidente. A seed encosta o
          fim de um mandato no início do seguinte (Dilma 2 e Temer em 2016-08-31, Temer e Bolsonaro em
          2019-01-01); no dia da posse vale quem assume.
      - name: mandato_presidencial
        description: Número do mandato do presidente em exercício (1, 2 ou 3).
      - name: fl_ano_eleicao_geral
        description: Verdadeiro nos anos de eleição geral (presidente, governadores e Congresso), de 1994 em diante.
      - name: fl_ano_eleicao_municipal
        description: Verdadeiro nos anos de eleição municipal, de 1996 em diante.
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: dim_partidos
    description: >
      Dimensão conformada de partidos. Grão: a entidade partidária (id_senado de seed_partidos), que
      agrupa rebrands (PR→PL, PPS→CIDADANIA, PRB→REPUBLICANOS, PMDB→MDB) e separa siglas reutilizadas
      por partidos diferentes (PL de 1985 × PL de 2006, PSD de 1987 × PSD de 2011). É por ela que voto
      e orientação partidária se encontram, não pela sigla.
    columns:
      - name: sk_partido
        description: Chave substituta da entidade partidária.
        tests:
          - not_null
          - unique
      - name: partido_id_nk
        description: Chave natural da entidade (id_senado de seed_partidos).
      - name: sigla
        description: Sigla vigente (a do rebrand mais recente), maiúscula e sem acento.
      - name: nome
        description: Nome vigente, maiúsculo e sem acento.
      - name: siglas_historicas
        description: Siglas que a entidade já usou na Câmara, separadas por vírgula.
      - name: data_criacao
        description: Data de criação da entidade (a mais antiga entre as siglas).
      - name: data_extincao
        description: Data de extinção, só quando todas as siglas da entidade foram extintas.
      - name: fl_extinto
        description: Verdadeiro quando a entidade foi extinta (fusão ou incorporação).
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: dim_orgaos
    description: >
      Dimensão dos órgãos que votam. Grão: casa + sigla do órgão. A origem só traz a sigla, então o
      tipo é inferido por regra; a extração do Senado só tem Plenário.
    columns:
      - name: sk_orgao
        description: Chave substituta do órgão (casa + sigla).
        tests:
          - not_null
          - unique
      - name: casa
        description: Casa legislativa (CAMARA ou SENADO).
      - name: sigla_orgao
        description: Sigla do órgão (PLEN, CCJC, PEC00619...).
      - name: tipo_orgao
        description: >
          PLENARIO, MESA DIRETORA, CPI, COMISSAO ESPECIAL (sigla com o número da proposição, ex.
          PEC00619), COMISSAO ou OUTROS.
        tests:
          - accepted_values:
              arguments:
                values: ['PLENARIO', 'MESA DIRETORA', 'CPI', 'COMISSAO ESPECIAL', 'COMISSAO', 'OUTROS', 'desconhecido']
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: dim_tipo_votacao
    description: >
      Junk dimension do tipo de votação: todas as combinações de classe (tirada da descrição), grupo,
      nominal e secreta, montadas de antemão. Serve para separar governismo e sucesso do governo em
      votações de mérito das procedimentais.
    columns:
      - name: sk_tipo_votacao
        description: Chave substituta da combinação (classe + nominal + secreta).
        tests:
          - not_null
          - unique
      - name: classe_votacao
        description: MERITO, EMENDA/DESTAQUE, URGENCIA, REQUERIMENTO PROCEDIMENTAL, PARECER, AUTORIDADE ou OUTROS.
        tests:
          - accepted_values:
              arguments:
                values: ['MERITO', 'EMENDA/DESTAQUE', 'URGENCIA', 'REQUERIMENTO PROCEDIMENTAL', 'PARECER', 'AUTORIDADE', 'OUTROS', 'desconhecido']
      - name: grupo_votacao
        description: "Agrupamento da classe: MERITO (mérito e emendas), PROCEDIMENTAL (requerimentos e urgência), ADMISSIBILIDADE (parecer), AUTORIDADE ou OUTROS."
      - name: fl_nominal
        description: 1 quando a votação tem voto nominal registrado.
      - name: fl_secreta
        description: 1 quando a votação foi secreta.
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: fct_votacoes
    description: >
      Fato das votações (Câmara e Senado). Grão: uma votação, com ou sem voto nominal registrado.
      É o cabeçalho de que os votos de fct_votos são as linhas; substitui a antiga dim_votacoes,
      que era um evento com resultado tratado como dimensão. O placar vem dos votos individuais e
      só conta como votante quem marcou SIM, NÃO ou OBSTRUÇÃO.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - votacao_id_nk
      - dbt_utils.expression_is_true:
          arguments:
            expression: "qt_votantes = qt_votos_sim + qt_votos_nao + qt_obstrucao"
    columns:
      - name: sk_votacao
        description: Chave substituta da votação (casa + id natural).
        tests:
          - not_null
          - unique
      - name: votacao_id_nk
        description: "Chave natural da votação na casa de origem, como texto: id da Câmara no formato da API (ex.: 2265603-43) ou codigovotacaosve do Senado."
      - name: casa
        description: Casa legislativa (CAMARA ou SENADO).
      - name: sk_data
        description: Chave da data da votação (AAAAMMDD), join com dim_calendario_legislativo.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_calendario_legislativo')
                field: data_sk
      - name: sk_proposicao
        description: "Chave substituta da proposição objeto da votação; null_key quando a votação não declara proposição ou a proposição não está em dim_proposicoes."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_proposicoes')
                field: sk_proposicao
      - name: sk_orgao
        description: Chave do órgão que votou, join com dim_orgaos.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_orgaos')
                field: sk_orgao
      - name: sk_tipo_votacao
        description: Chave do tipo de votação (classe, nominal, secreta), join com dim_tipo_votacao.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tipo_votacao')
                field: sk_tipo_votacao
      - name: descricao
        description: "Dimensão degenerada: descrição da votação, maiúscula e sem acento."
      - name: orientacao_governo
        description: "Dimensão degenerada: orientação da liderança do Governo, inclusive LIBERADO; nula quando não houve orientação."
      - name: fl_aprovada
        description: 1 se aprovada, 0 caso contrário, nula quando a origem não informa.
      - name: fl_nominal
        description: 1 quando a votação tem ao menos um SIM, NÃO ou OBSTRUÇÃO registrado; é o grão de votacoes_placar.
      - name: fl_secreta
        description: 1 quando a votação foi secreta (só existe no Senado).
      - name: fl_governo_orientou
        description: 1 quando o Governo orientou SIM, NÃO ou OBSTRUÇÃO; LIBERADO não conta.
      - name: fl_governo_venceu
        description: >
          1 quando o resultado seguiu a orientação do Governo (SIM e aprovada, ou NÃO e rejeitada), 0
          quando contrariou. Nula quando o Governo não orientou SIM ou NÃO ou o resultado não é
          conhecido. A média é a taxa de sucesso do Executivo.
      - name: qt_votos_sim
        description: Votos SIM.
      - name: qt_votos_nao
        description: Votos NÃO.
      - name: qt_obstrucao
        description: Votos de OBSTRUÇÃO.
      - name: qt_abstencao
        description: Abstenções. Não entram em qt_votantes.
      - name: qt_votantes
        description: Parlamentares que marcaram posição (SIM, NÃO ou OBSTRUÇÃO).
      - name: qt_presentes_sem_voto
        description: Parlamentares presentes que não registraram voto (P-NRV do Senado).
      - name: qt_ausentes
        description: Parlamentares ausentes, com ou sem justificativa (só o Senado registra).
      - name: qt_partidos
        description: Partidos distintos entre os votantes.
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: fct_votos
    description: >
      Fato de registros de voto (Câmara e Senado). Grão: um parlamentar por votação, com todos os
      registros da origem — além de SIM, NÃO e OBSTRUÇÃO, entram abstenção, presidência, voto secreto,
      presença sem voto e ausências, classificados por dim_tipo_voto. As métricas filtram o que usam.
      Herda do cabeçalho (fct_votacoes) as chaves de data e proposição e a orientação do Governo.
    columns:
      - name: sk_voto
        description: Chave substituta do registro de voto (casa + parlamentar + votação, pelas chaves naturais).
        tests:
          - not_null
          - unique
      - name: sk_votacao
        description: "Dimensão degenerada: chave da votação, join com fct_votacoes."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_votacoes')
                field: sk_votacao
      - name: sk_parlamentar
        description: Chave substituta do parlamentar, join com dim_parlamentares; null_key quando o parlamentar não está na dimensão.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_parlamentares')
                field: sk_parlamentar
      - name: sk_partido
        description: Chave da entidade partidária do parlamentar no momento do voto, join com dim_partidos; null_key sem partido.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_partidos')
                field: sk_partido
      - name: sk_data
        description: Chave da data da votação (AAAAMMDD), join com dim_calendario_legislativo.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_calendario_legislativo')
                field: data_sk
      - name: sk_proposicao
        description: Chave da proposição objeto da votação, herdada de fct_votacoes.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_proposicoes')
                field: sk_proposicao
      - name: sk_orgao
        description: Chave do órgão que votou, herdada de fct_votacoes.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_orgaos')
                field: sk_orgao
      - name: sk_tipo_votacao
        description: Chave do tipo de votação, herdada de fct_votacoes.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tipo_votacao')
                field: sk_tipo_votacao
      - name: sk_tipo_voto
        description: Chave do tipo de registro, join com dim_tipo_voto.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tipo_voto')
                field: sk_tipo_voto
      - name: casa
        description: Casa legislativa do voto (CAMARA ou SENADO).
      - name: votacao_id_nk
        description: "Dimensão degenerada: chave natural da votação na casa de origem."
      - name: partido
        description: "Dimensão degenerada: sigla do partido do parlamentar no momento do voto."
      - name: partido_nome
        description: "Dimensão degenerada: nome do partido no momento do voto ('desconhecido' quando não há partido)."
      - name: voto
        description: "Posição normalizada (SIM, NAO, OBSTRUCAO, ABSTENCAO, BRANCO); nula quando o registro não é voto."
        tests:
          - accepted_values:
              arguments:
                values: ['SIM', 'NAO', 'OBSTRUCAO', 'ABSTENCAO', 'BRANCO']
      - name: orientacao_governo
        description: "Dimensão degenerada: orientação do Governo na votação, herdada de fct_votacoes."
      - name: orientacao_partido
        description: "Dimensão degenerada: orientação da liderança do próprio partido na votação, inclusive LIBERADO. Casa pela entidade partidária, não pela sigla (PR orienta o PL)."
      - name: fl_governo_orientou
        description: 1 quando o Governo orientou SIM, NÃO ou OBSTRUÇÃO na votação.
      - name: fl_seguiu_governo
        description: >
          1 se o voto coincidiu com a orientação do Governo, 0 se divergiu. Só existe para voto SIM,
          NÃO ou OBSTRUÇÃO em votação orientada; SUM/COUNT desta coluna é o governismo.
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: fl_partido_orientou
        description: 1 quando o partido do parlamentar orientou SIM, NÃO ou OBSTRUÇÃO na votação.
      - name: fl_seguiu_partido
        description: >
          1 se o voto coincidiu com a orientação do próprio partido, 0 se divergiu. Só existe para voto
          SIM, NÃO ou OBSTRUÇÃO com orientação do partido; SUM/COUNT desta coluna é a disciplina.
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: fl_votou_com_resultado
        description: 1 se o voto SIM/NÃO ficou do lado vencedor, 0 se perdeu; nula para os demais registros.
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: fct_orientacoes
    description: >
      Fato sem fato das orientações de voto (Câmara e Senado). Grão: uma liderança (partido, bloco,
      Governo, Maioria, Minoria, Oposição) por votação. LIBERADO e ABSTENCAO ficam, porque são
      eventos. No Senado o codigovotacaosve do endpoint orientacaoBancada é outro espaço de chave;
      a votação é resolvida pela matéria no dia com desempate pelo placar
      (int_orientacoes_senado_filtradas), e o que não se resolve cai em null_key — o teste de
      relationships avisa quantas.
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - votacao_origem_id
              - sigla_lideranca
    columns:
      - name: sk_votacao
        description: Chave da votação resolvida contra fct_votacoes; null_key quando a orientação não casa com nenhuma votação.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_votacoes')
                field: sk_votacao
              config:
                severity: warn
      - name: sk_data
        description: Chave da data da votação; na orientação órfã do Senado, vem da data que a própria orientação traz.
      - name: sk_partido
        description: Chave da entidade partidária quando a liderança é um partido, join com dim_partidos; null_key para Governo, blocos e federações.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_partidos')
                field: sk_partido
      - name: casa
        description: Casa legislativa (CAMARA ou SENADO).
      - name: votacao_id_nk
        description: "Dimensão degenerada: chave da votação na casa; no Senado, a resolvida pela matéria no dia (nula quando ficou sem par)."
      - name: votacao_origem_id
        description: "Dimensão degenerada: chave da votação como vem do endpoint de orientação."
      - name: sigla_lideranca
        description: Sigla do partido, bloco ou liderança que emitiu a orientação (GOVERNO, MAIORIA...).
      - name: tipo_lideranca
        description: "Tipo de liderança (BANCADA ou PARTIDO). 'desconhecido' no Senado."
      - name: orientacao_voto
        description: Orientação emitida.
        tests:
          - accepted_values:
              arguments:
                values: ['SIM', 'NAO', 'OBSTRUCAO', 'LIBERADO', 'ABSTENCAO']
      - name: model_run_at
