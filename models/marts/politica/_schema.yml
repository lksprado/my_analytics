version: 2

models:

  - name: dim_parlamentares
    description: "Parlamentares (deputados e senadores). Grão: um parlamentar por casa."
    columns:
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
          - unique
      - name: deputado_id_nk
        description: "Id do deputado na Câmara."
      - name: senador_id_nk
        description: "Id do senador no Senado."
      - name: radar_deputado_id_fk
        description: "Id do deputado no Radar Congresso."
      - name: radar_senador_id_fk
        description: "Id do senador no Radar Congresso."
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CAMARA', 'SENADO', 'desconhecido']
      - name: nome
        description: "Nome parlamentar."
      - name: nome_completo
        description: Nome civil completo.
      - name: sexo
        description: "Sexo (MASCULINO, FEMININO)."
        tests:
          - accepted_values:
              arguments:
                values: ['MASCULINO', 'FEMININO', 'desconhecido']
      - name: uf_mandato_recente
        description: "UF de representação no mandato mais recente; para votos, use a UF do voto."
      - name: regiao
        description: "Região da UF de representação."
        tests:
          - accepted_values:
              arguments:
                values: ['NORTE', 'NORDESTE', 'CENTRO-OESTE', 'SUDESTE', 'SUL', 'desconhecido']
      - name: data_nascimento
        description: "Data de nascimento (só Câmara)."
      - name: escolaridade
        description: "Escolaridade (só Câmara)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_proposicoes
    description: "Proposições da Câmara e do Senado. Grão: uma proposição por casa."
    columns:
      - name: sk_proposicao
        description: "Chave da proposição."
        tests:
          - not_null
          - unique
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: proposicao_id_nk
        description: "Id da proposição na casa."
      - name: tipo_proposicao
        description: "Tipo da proposição (PL, PEC...)."
      - name: data_proposicao
        description: Data de apresentação da proposição.
      - name: identificacao
        description: "Identificação da proposição (ex.: PL 1234/2023)."
      - name: ementa
        description: "Ementa (só Câmara)."
      - name: situacao_atual
        description: "Situação atual de tramitação."
      - name: regime
        description: "Regime de tramitação atual (só Câmara)."
      - name: autoria
        description: "Autoria (só Senado)."
      - name: norma_gerada
        description: "Norma gerada pela proposição (só Senado)."
      - name: sk_data
        description: "Chave da data de apresentação."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_tipo_voto
    description: "Tipos de registro de voto. Grão: casa × código de voto da origem."
    columns:
      - name: sk_tipo_voto
        description: "Chave do tipo de voto."
        tests:
          - not_null
          - unique
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: codigo_origem
        description: "Código do voto na origem."
      - name: descricao
        description: Descrição legível do código.
      - name: posicao
        description: "Posição do voto (SIM, NAO, OBSTRUCAO, ABSTENCAO, BRANCO); nula quando não é voto."
      - name: categoria
        description: "Categoria do registro de voto."
        tests:
          - accepted_values:
              arguments:
                values: ['VOTOU', 'VOTO SECRETO', 'PRESENTE SEM VOTO', 'PRESIDENCIA', 'AUSENCIA JUSTIFICADA', 'AUSENCIA NAO JUSTIFICADA', 'NAO INFORMADO', 'desconhecido']
      - name: fl_presente
        description: "1 quando o registro indica presença na sessão."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_casa
    description: "Casas legislativas. Grão: uma casa."
    columns:
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
        tests:
          - not_null
          - unique
      - name: nome_casa
        description: "Nome oficial da casa."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_uf
    description: "Unidades da federação. Grão: uma UF."
    columns:
      - name: uf
        description: "Sigla da UF."
        tests:
          - not_null
          - unique
      - name: nome_uf
        description: "Nome da UF."
      - name: regiao
        description: "Região da UF."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NORTE', 'NORDESTE', 'CENTRO-OESTE', 'SUDESTE', 'SUL', 'desconhecido']
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_legislatura
    description: "Legislaturas. Grão: uma legislatura."
    columns:
      - name: legislatura
        description: "Número da legislatura."
        tests:
          - not_null
          - unique
      - name: inicio
        description: "Primeiro dia da legislatura."
        tests:
          - not_null
      - name: fim
        description: "Último dia da legislatura."
        tests:
          - not_null
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_sessao_legislativa
    description: "Sessões legislativas (ano legislativo). Grão: legislatura × sessão."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - legislatura
              - sessao_legislativa
      - dbt_utils.expression_is_true:
          arguments:
            expression: "inicio <= fim"
    columns:
      - name: sk_sessao_legislativa
        description: "Chave da sessão legislativa."
        tests:
          - not_null
          - unique
      - name: legislatura
        description: "Número da legislatura."
      - name: sessao_legislativa
        description: "Sessão legislativa dentro da legislatura (1 a 4)."
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
      - name: inicio
        description: "Primeiro dia da sessão legislativa."
      - name: fim
        description: "Último dia da sessão legislativa."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_governo
    description: "Governos do Executivo federal. Grão: presidente × mandato."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - presidente
              - mandato
    columns:
      - name: sk_governo
        description: "Chave do governo."
        tests:
          - not_null
          - unique
      - name: presidente
        description: "Presidente da República."
      - name: mandato
        description: "Número do mandato do presidente."
      - name: governo
        description: "Rótulo do governo (presidente e mandato)."
        tests:
          - unique
      - name: inicio
        description: "Primeiro dia do governo."
      - name: fim
        description: "Último dia do governo."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_calendario_legislativo
    description: "Calendário do domínio político. Grão: um dia."
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "EXTRACT(ISODOW FROM inicio_semana) = 1 AND data - inicio_semana BETWEEN 0 AND 6"
    columns:
      - name: data_sk
        description: "Chave da data (AAAAMMDD)."
        tests:
          - not_null
          - unique
      - name: data
        description: "Data."
      - name: inicio_semana
        description: "Segunda-feira da semana ISO da data."
        tests:
          - not_null
      - name: legislatura
        description: "Número da legislatura."
      - name: sessao_legislativa
        description: "Sessão legislativa dentro da legislatura (1 a 4)."
      - name: sk_sessao_legislativa
        description: "Chave da sessão legislativa."
        tests:
          - relationships:
              arguments:
                to: ref('dim_sessao_legislativa')
                field: sk_sessao_legislativa
      - name: presidente
        description: "Presidente da República em exercício."
      - name: mandato_presidencial
        description: "Número do mandato do presidente em exercício."
      - name: sk_governo
        description: "Chave do governo em exercício."
        tests:
          - relationships:
              arguments:
                to: ref('dim_governo')
                field: sk_governo
      - name: fl_ano_eleicao_geral
        description: "Ano de eleição geral."
      - name: fl_ano_eleicao_municipal
        description: "Ano de eleição municipal."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_bancada
    description: "Lideranças que orientam votações: partidos, federações, blocos, Governo, Maioria, Minoria e Oposição. Grão: casa × sigla da liderança × partido."
    columns:
      - name: sk_bancada
        description: "Chave da bancada."
        tests:
          - not_null
          - unique
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: sigla_bancada
        description: "Sigla da liderança como aparece nas orientações."
        tests:
          - not_null
      - name: tipo_bancada
        description: "Tipo da bancada (PARTIDO, FEDERACAO, BLOCO, GOVERNO, MAIORIA, MINORIA, OPOSICAO, BANCADA TEMATICA, OUTRA)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PARTIDO', 'FEDERACAO', 'BLOCO', 'GOVERNO', 'MAIORIA', 'MINORIA', 'OPOSICAO', 'BANCADA TEMATICA', 'OUTRA', 'desconhecido']
      - name: sk_partido
        description: "Chave do partido quando a bancada é um partido; desconhecido nos demais tipos."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_partidos')
                field: sk_partido
      - name: partidos_membros
        description: "Siglas dos partidos que compõem a federação ou o bloco, segundo a seed de composição."
      - name: primeira_orientacao
        description: "Data da primeira orientação da bancada."
      - name: ultima_orientacao
        description: "Data da última orientação da bancada."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: bridge_bancadas_partidos
    description: "Composição das federações e blocos, com vigência. Grão: bancada × partido × início."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_bancada
              - sk_partido
              - inicio
    columns:
      - name: sk_bancada
        description: "Chave da bancada."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_bancada')
                field: sk_bancada
      - name: sk_partido
        description: "Chave do partido membro."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_partidos')
                field: sk_partido
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: sigla_bancada
        description: "Sigla da bancada."
      - name: tipo_bancada
        description: "Tipo da bancada (FEDERACAO, BLOCO)."
        tests:
          - accepted_values:
              arguments:
                values: ['FEDERACAO', 'BLOCO']
      - name: inicio
        description: "Início da participação do partido na bancada."
        tests:
          - not_null
      - name: fim
        description: "Fim da participação; nulo quando vigente."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_partidos
    description: "Partidos. Grão: entidade partidária, que agrupa as siglas de um mesmo partido."
    columns:
      - name: sk_partido
        description: "Chave do partido."
        tests:
          - not_null
          - unique
      - name: partido_id_nk
        description: "Id da entidade partidária."
      - name: sigla
        description: "Sigla atual do partido."
      - name: rotulo
        description: "Nome de exibição do partido; siglas reutilizadas levam o período (ex.: PL (1985-2006))."
        tests:
          - unique
      - name: nome
        description: "Nome atual do partido."
      - name: siglas_historicas
        description: "Siglas já usadas pelo partido."
      - name: data_criacao
        description: "Data de criação do partido."
      - name: data_extincao
        description: "Data de extinção do partido."
      - name: fl_extinto
        description: "1 quando o partido foi extinto."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_orgaos
    description: "Órgãos que votam. Grão: casa × sigla do órgão."
    columns:
      - name: sk_orgao
        description: "Chave do órgão."
        tests:
          - not_null
          - unique
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: sigla_orgao
        description: Sigla do órgão (PLEN, CCJC, PEC00619...).
      - name: tipo_orgao
        description: "Tipo do órgão (PLENARIO, MESA DIRETORA, CPI, COMISSAO ESPECIAL, COMISSAO, OUTROS)."
        tests:
          - accepted_values:
              arguments:
                values: ['PLENARIO', 'MESA DIRETORA', 'CPI', 'COMISSAO ESPECIAL', 'COMISSAO', 'OUTROS', 'desconhecido']
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_tipo_votacao
    description: "Tipos de votação (junk dimension). Grão: classe × nominal × secreta."
    columns:
      - name: sk_tipo_votacao
        description: "Chave do tipo de votação."
        tests:
          - not_null
          - unique
      - name: classe_votacao
        description: "Classe da votação (MERITO, EMENDA/DESTAQUE, URGENCIA, REQUERIMENTO PROCEDIMENTAL, PARECER, AUTORIDADE, OUTROS)."
        tests:
          - accepted_values:
              arguments:
                values: ['MERITO', 'EMENDA/DESTAQUE', 'URGENCIA', 'REQUERIMENTO PROCEDIMENTAL', 'PARECER', 'AUTORIDADE', 'OUTROS', 'desconhecido']
      - name: grupo_votacao
        description: "Grupo da classe (MERITO, PROCEDIMENTAL, ADMISSIBILIDADE, AUTORIDADE, OUTROS)."
      - name: fl_nominal
        description: "1 quando a votação teve votos nominais."
      - name: fl_secreta
        description: 1 quando a votação foi secreta.
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: fct_votacoes
    description: "Votações da Câmara e do Senado, com placar e resultado. Grão: uma votação."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - votacao_id_nk
      - dbt_utils.expression_is_true:
          arguments:
            expression: "qt_votantes = qt_votos_sim + qt_votos_nao + qt_obstrucao"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(fl_resultado_alinhado_governo IS NULL) = (motivo_resultado_nao_classificado IS NOT NULL)"
    columns:
      - name: sk_votacao
        description: "Chave da votação."
        tests:
          - not_null
          - unique
      - name: votacao_id_nk
        description: "Chave natural da votação na casa."
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: sessao_id
        description: "Id da sessão em que a votação ocorreu."
      - name: sk_data
        description: "Chave da data da votação."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_calendario_legislativo')
                field: data_sk
      - name: sk_proposicao
        description: "Chave da proposição votada."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_proposicoes')
                field: sk_proposicao
      - name: sk_orgao
        description: "Chave do órgão que votou."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_orgaos')
                field: sk_orgao
      - name: sk_tipo_votacao
        description: "Chave do tipo de votação."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tipo_votacao')
                field: sk_tipo_votacao
      - name: descricao
        description: "Descrição da votação."
      - name: modalidade_votacao
        description: "Modalidade (NOMINAL ABERTA, NOMINAL SECRETA, SEM REGISTRO NOMINAL)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NOMINAL ABERTA', 'NOMINAL SECRETA', 'SEM REGISTRO NOMINAL']
      - name: orientacao_governo
        description: "Orientação do Governo (SIM, NAO, OBSTRUCAO, LIBERADO, ABSTENCAO)."
      - name: fl_aprovada
        description: "1 quando a votação foi aprovada, 0 quando rejeitada; nulo quando o resultado não é binário."
      - name: fl_nominal
        description: "1 quando a votação teve votos nominais."
      - name: fl_secreta
        description: "1 quando a votação foi secreta."
      - name: fl_governo_orientou
        description: "1 quando o Governo orientou SIM, NÃO ou OBSTRUÇÃO."
      - name: fl_resultado_alinhado_governo
        description: "1 quando o resultado seguiu a orientação do Governo, 0 quando contrariou."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: motivo_resultado_nao_classificado
        description: "Motivo de o resultado não ser classificado (SEM ORIENTACAO, LIBERADO, ORIENTACAO ABSTENCAO, RESULTADO NAO BINARIO)."
        tests:
          - accepted_values:
              arguments:
                values: ['SEM ORIENTACAO', 'LIBERADO', 'ORIENTACAO ABSTENCAO', 'RESULTADO NAO BINARIO']
      - name: qt_votos_sim
        description: Votos SIM.
      - name: qt_votos_nao
        description: Votos NÃO.
      - name: qt_obstrucao
        description: Votos de OBSTRUÇÃO.
      - name: qt_abstencao
        description: "Abstenções."
      - name: qt_votantes
        description: "Votantes (SIM, NÃO ou OBSTRUÇÃO)."
      - name: qt_presentes_sem_voto
        description: "Presentes que não votaram."
      - name: qt_ausentes
        description: "Parlamentares ausentes."
      - name: qt_partidos
        description: Partidos distintos entre os votantes.
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: fct_votos
    description: "Registros de voto da Câmara e do Senado, incluindo abstenções, presenças e ausências. Grão: parlamentar × votação."
    columns:
      - name: sk_voto
        description: "Chave do registro de voto."
        tests:
          - not_null
          - unique
      - name: sk_votacao
        description: "Chave da votação."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_votacoes')
                field: sk_votacao
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_parlamentares')
                field: sk_parlamentar
      - name: sk_partido
        description: "Chave do partido do parlamentar no momento do voto."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_partidos')
                field: sk_partido
      - name: sk_bancada
        description: "Chave da federação ou bloco do partido do parlamentar na data do voto; desconhecido sem bancada."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_bancada')
                field: sk_bancada
      - name: sk_data
        description: "Chave da data da votação."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_calendario_legislativo')
                field: data_sk
      - name: sk_proposicao
        description: "Chave da proposição votada."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_proposicoes')
                field: sk_proposicao
      - name: sk_orgao
        description: "Chave do órgão que votou."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_orgaos')
                field: sk_orgao
      - name: sk_tipo_votacao
        description: "Chave do tipo de votação."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tipo_votacao')
                field: sk_tipo_votacao
      - name: sk_tipo_voto
        description: "Chave do tipo de voto."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tipo_voto')
                field: sk_tipo_voto
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: uf
        description: "UF de representação do parlamentar no momento do voto."
        tests:
          - relationships:
              arguments:
                to: ref('dim_uf')
                field: uf
      - name: votacao_id_nk
        description: "Chave natural da votação na casa."
      - name: partido
        description: "Sigla do partido no momento do voto."
      - name: partido_nome
        description: "Nome do partido no momento do voto."
      - name: voto
        description: "Posição do voto (SIM, NAO, OBSTRUCAO, ABSTENCAO, BRANCO); nula quando não é voto."
        tests:
          - accepted_values:
              arguments:
                values: ['SIM', 'NAO', 'OBSTRUCAO', 'ABSTENCAO', 'BRANCO']
      - name: orientacao_governo
        description: "Orientação do Governo na votação."
      - name: orientacao_partido
        description: "Orientação do partido do parlamentar na votação."
      - name: orientacao_bancada
        description: "Orientação da federação ou bloco do partido do parlamentar na votação."
      - name: fl_governo_orientou
        description: "1 quando o Governo orientou SIM, NÃO ou OBSTRUÇÃO."
      - name: fl_seguiu_governo
        description: "1 quando o voto seguiu a orientação do Governo, 0 quando divergiu."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: fl_partido_orientou
        description: "1 quando o partido do parlamentar orientou a votação."
      - name: fl_seguiu_partido
        description: "1 quando o voto seguiu a orientação do partido, 0 quando divergiu."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: fl_seguiu_bancada
        description: "1 quando o voto seguiu a orientação da federação ou bloco, 0 quando divergiu."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: fl_votou_com_resultado
        description: "1 quando o voto ficou do lado vencedor, 0 quando perdeu."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: fct_presencas_plenario
    description: "Presença e ausência nas votações nominais do Plenário em que o parlamentar estava em exercício. Grão: parlamentar × votação."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
