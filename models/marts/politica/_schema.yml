    expect:
      rows:
        - {sk_parlamentar: d1, sk_votacao: v1, casa: CAMARA, categoria_presenca: VOTOU, fl_presente: 1, fl_ausencia_inferida: 0, fl_votou_com_posicao: 1, fl_governo_orientou: 1, sk_partido: pt, uf: SP}
