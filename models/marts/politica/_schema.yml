unit_tests:

  - name: fct_votacoes_placar_e_sucesso_do_governo
    description: >
      Votantes são só SIM, NÃO e OBSTRUÇÃO; abstenção, presença sem voto e ausência têm contagem
      própria. fl_nominal nasce do placar, não da casa. O governo vence quando o resultado segue a
      orientação SIM/NÃO; LIBERADO não é orientação. Proposição sem par na dimensão vai para null_key.
    model: fct_votacoes
    given:
      - input: ref('int_votacoes_unificadas')
        rows:
          - {casa: CAMARA, votacao_id_nk: '1-1', data_votacao: '2023-05-10', sigla_orgao: PLEN, descricao: A, proposicao_id_nk: 10, aprovado: 1, fl_secreta: 0, classe_votacao: MERITO}
          - {casa: CAMARA, votacao_id_nk: '1-2', data_votacao: '2023-05-10', sigla_orgao: CCJC, descricao: B, proposicao_id_nk: null, aprovado: 0, fl_secreta: 0, classe_votacao: PARECER}
          - {casa: SENADO, votacao_id_nk: '99', data_votacao: '2023-05-11', sigla_orgao: PLEN, descricao: C, proposicao_id_nk: 20, aprovado: 1, fl_secreta: 1, classe_votacao: AUTORIDADE}
      - input: ref('int_votos_unificados')
        rows:
          - {casa: CAMARA, parlamentar_id_nk: 1, votacao_id_nk: '1-1', partido: PT, voto: SIM, categoria: VOTOU}
          - {casa: CAMARA, parlamentar_id_nk: 2, votacao_id_nk: '1-1', partido: PL, voto: NAO, categoria: VOTOU}
          - {casa: CAMARA, parlamentar_id_nk: 3, votacao_id_nk: '1-1', partido: PL, voto: OBSTRUCAO, categoria: VOTOU}
          - {casa: CAMARA, parlamentar_id_nk: 4, votacao_id_nk: '1-1', partido: PSOL, voto: ABSTENCAO, categoria: VOTOU}
          - {casa: CAMARA, parlamentar_id_nk: 5, votacao_id_nk: '1-1', partido: MDB, voto: null, categoria: PRESIDENCIA}
          - {casa: SENADO, parlamentar_id_nk: 7, votacao_id_nk: '99', partido: PT, voto: null, categoria: VOTO SECRETO}
          - {casa: SENADO, parlamentar_id_nk: 8, votacao_id_nk: '99', partido: PL, voto: null, categoria: AUSENCIA JUSTIFICADA}
          - {casa: SENADO, parlamentar_id_nk: 9, votacao_id_nk: '99', partido: PL, voto: null, categoria: PRESENTE SEM VOTO}
      - input: ref('int_orientacoes_unificadas')
        rows:
          - {casa: CAMARA, votacao_id_nk: '1-1', sigla_lideranca: GOVERNO, orientacao_voto: SIM}
          - {casa: CAMARA, votacao_id_nk: '1-1', sigla_lideranca: PT, orientacao_voto: SIM}
          - {casa: CAMARA, votacao_id_nk: '1-2', sigla_lideranca: GOVERNO, orientacao_voto: LIBERADO}
          - {casa: SENADO, votacao_id_nk: '99', sigla_lideranca: GOVERNO, orientacao_voto: NAO}
      - input: ref('dim_proposicoes')
        rows:
          - {sk_proposicao: p10, casa: CAMARA, proposicao_id_nk: 10}
      - input: ref('dim_orgaos')
        rows:
          - {sk_orgao: o_plen_c, casa: CAMARA, sigla_orgao: PLEN}
          - {sk_orgao: o_ccjc, casa: CAMARA, sigla_orgao: CCJC}
          - {sk_orgao: o_plen_s, casa: SENADO, sigla_orgao: PLEN}
      - input: ref('dim_tipo_votacao')
        rows:
          - {sk_tipo_votacao: tv_merito_nominal, classe_votacao: MERITO, fl_nominal: 1, fl_secreta: 0}
          - {sk_tipo_votacao: tv_parecer, classe_votacao: PARECER, fl_nominal: 0, fl_secreta: 0}
          - {sk_tipo_votacao: tv_autoridade_secreta, classe_votacao: AUTORIDADE, fl_nominal: 0, fl_secreta: 1}
    expect:
      rows:
        - {votacao_id_nk: '1-1', sk_data: 20230510, sk_proposicao: p10, sk_orgao: o_plen_c, sk_tipo_votacao: tv_merito_nominal, orientacao_governo: SIM, fl_aprovada: 1, fl_nominal: 1, fl_secreta: 0, fl_governo_orientou: 1, fl_governo_venceu: 1, qt_votos_sim: 1, qt_votos_nao: 1, qt_obstrucao: 1, qt_abstencao: 1, qt_votantes: 3, qt_presentes_sem_voto: 0, qt_ausentes: 0, qt_partidos: 2}
        - {votacao_id_nk: '1-2', sk_data: 20230510, sk_proposicao: '0', sk_orgao: o_ccjc, sk_tipo_votacao: tv_parecer, orientacao_governo: LIBERADO, fl_aprovada: 0, fl_nominal: 0, fl_secreta: 0, fl_governo_orientou: 0, fl_governo_venceu: null, qt_votos_sim: 0, qt_votos_nao: 0, qt_obstrucao: 0, qt_abstencao: 0, qt_votantes: 0, qt_presentes_sem_voto: 0, qt_ausentes: 0, qt_partidos: 0}
        - {votacao_id_nk: '99', sk_data: 20230511, sk_proposicao: '0', sk_orgao: o_plen_s, sk_tipo_votacao: tv_autoridade_secreta, orientacao_governo: NAO, fl_aprovada: 1, fl_nominal: 0, fl_secreta: 1, fl_governo_orientou: 1, fl_governo_venceu: 0, qt_votos_sim: 0, qt_votos_nao: 0, qt_obstrucao: 0, qt_abstencao: 0, qt_votantes: 0, qt_presentes_sem_voto: 1, qt_ausentes: 1, qt_partidos: 0}

  - name: fct_votos_flags_de_alinhamento
    description: >
      As flags de "seguiu" só existem para voto SIM, NÃO ou OBSTRUÇÃO em votação com orientação SIM,
      NÃO ou OBSTRUÇÃO; LIBERADO não conta como orientação. O partido casa com a orientação pela
