version: 2

models:

  - name: dim_parlamentares
    description: "Parlamentares (deputados e senadores). Grão: um parlamentar por casa."
    config:
      meta:
        grain: "um parlamentar por casa"
        primary_key:
          - "sk_parlamentar"
        foreign_keys: []
        source: "raw_camara.raw_camara_deputados, raw_camara.raw_camara_legislaturas, raw_senado.raw_senado_senadores, raw_senado.raw_senado_legislaturas, raw_camara.raw_camara_votos_deputados, raw_senado.raw_senado_votos_senadores, raw_radar_congresso.raw_radar_governismo_deputados, raw_radar_congresso.raw_radar_governismo_senadores, raw_radar_congresso.raw_radar_parlamentares"
        refresh_frequency: "mensal (dia 1)"
        historical_coverage: "deputados e senadores com mandato ou voto desde 1991"
    columns:
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
          - unique
      - name: deputado_id_nk
        description: "Id do deputado na Câmara."
      - name: senador_id_nk
        description: "Id do senador no Senado."
      - name: radar_deputado_id_fk
        description: "Id do deputado no Radar Congresso."
      - name: radar_senador_id_fk
        description: "Id do senador no Radar Congresso."
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CAMARA', 'SENADO', 'desconhecido']
      - name: nome
        description: "Nome parlamentar."
      - name: nome_completo
        description: Nome civil completo.
      - name: sexo
        description: "Sexo (MASCULINO, FEMININO)."
        tests:
          - accepted_values:
              arguments:
                values: ['MASCULINO', 'FEMININO', 'desconhecido']
      - name: uf_mandato_recente
        description: "UF de representação no mandato mais recente; para votos, use a UF do voto."
      - name: regiao
        description: "Região da UF de representação."
        tests:
          - accepted_values:
              arguments:
                values: ['NORTE', 'NORDESTE', 'CENTRO-OESTE', 'SUDESTE', 'SUL', 'desconhecido']
      - name: data_nascimento
        description: "Data de nascimento (só Câmara)."
      - name: escolaridade
        description: "Escolaridade (só Câmara)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_proposicoes
    description: "Proposições da Câmara e do Senado. Grão: uma proposição por casa."
    config:
      meta:
        grain: "proposição por casa"
        primary_key:
          - "sk_proposicao"
        foreign_keys: []
        source: "raw_camara.raw_camara_proposicao, raw_camara.arquivo_proposicoes, raw_senado.raw_senado_processo, raw_senado.processos, raw_senado.raw_senado_status"
        refresh_frequency: "Câmara semanal; Senado mensal, status diário"
        historical_coverage: "todas as proposições da Câmara (1934 em diante) e processos do Senado (1946 em diante)"
    columns:
      - name: sk_proposicao
        description: "Chave da proposição."
        tests:
          - not_null
          - unique
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: proposicao_id_nk
        description: "Id da proposição na casa."
      - name: tipo_proposicao
        description: "Tipo da proposição (PL, PEC...)."
      - name: data_proposicao
        description: Data de apresentação da proposição.
      - name: identificacao
        description: "Identificação da proposição (ex.: PL 1234/2023)."
      - name: ementa
        description: "Ementa (só Câmara)."
      - name: situacao_atual
        description: "Situação atual de tramitação."
      - name: data_situacao_atual
        description: "Data da situação atual de tramitação."
      - name: fl_tramitando
        description: "1 quando a proposição está em tramitação (só Senado)."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: regime
        description: "Regime de tramitação atual (só Câmara)."
      - name: autoria
        description: "Autoria (só Senado)."
      - name: norma_gerada
        description: "Norma gerada pela proposição (só Senado)."
      - name: relator_atual_id_nk
        description: "Id do deputado relator atual (só Câmara)."
      - name: codigo_deliberacao
        description: "Código da deliberação da matéria no Senado."
      - name: data_deliberacao
        description: "Data da deliberação da matéria no Senado."
      - name: sk_data
        description: "Chave da data de apresentação."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_tema
    description: "Temas das proposições, segundo a classificação da Câmara. Grão: um tema."
    config:
      meta:
        grain: "um tema"
        primary_key:
          - "sk_tema"
        foreign_keys: []
        source: "raw_camara.raw_camara_proposicao_tema, raw_camara.arquivo_proposicoes_temas"
        refresh_frequency: "semanal (segundas)"
        historical_coverage: "temas da Câmara de 1945 em diante"
    columns:
      - name: sk_tema
        description: "Chave do tema."
        tests:
          - not_null
          - unique
      - name: codigo_tema
        description: "Código do tema na Câmara."
      - name: tema
        description: "Nome do tema."
        tests:
          - not_null
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: bridge_proposicoes_temas
    description: "Temas de cada proposição, próprios ou herdados da principal, sem peso. Grão: proposição × tema."
    config:
      meta:
        grain: "proposição × tema"
        primary_key:
          - "sk_proposicao"
          - "sk_tema"
        foreign_keys:
          - "sk_proposicao -> dim_proposicoes"
          - "sk_tema -> dim_tema"
        source: "raw_camara.raw_camara_proposicao_tema, raw_camara.arquivo_proposicoes_temas"
        refresh_frequency: "semanal (segundas)"
        historical_coverage: "proposições da Câmara de 1945 em diante"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_proposicao
              - sk_tema
    columns:
      - name: sk_proposicao
        description: "Chave da proposição."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_proposicoes')
                field: sk_proposicao
      - name: sk_tema
        description: "Chave do tema."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tema')
                field: sk_tema
      - name: relevancia
        description: "Relevância do tema para a proposição, segundo a Câmara."
      - name: origem_tema
        description: "Origem do tema (PROPRIO, HERDADO da proposição principal)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PROPRIO', 'HERDADO']
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: bridge_votacoes_proposicoes
    description: "Proposições relacionadas a cada votação, com o tipo da relação. Grão: votação × proposição × tipo de relação."
    config:
      meta:
        grain: "votação × proposição × tipo de relação"
        primary_key:
          - "sk_votacao"
          - "sk_proposicao"
          - "tipo_relacao"
        foreign_keys:
          - "sk_votacao -> fct_votacoes"
          - "sk_proposicao -> dim_proposicoes"
        source: "raw_camara.raw_camara_votacoes, raw_senado.raw_senado_votacoes"
        refresh_frequency: "Câmara semanal (segundas); Senado mensal (dia 1)"
        historical_coverage: "Câmara desde 01/1993 (nominais desde 12/2001); Senado desde 02/2001"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_votacao
              - sk_proposicao
              - tipo_relacao
    columns:
      - name: sk_votacao
        description: "Chave da votação."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_votacoes')
                field: sk_votacao
      - name: sk_proposicao
        description: "Chave da proposição."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_proposicoes')
                field: sk_proposicao
      - name: tipo_relacao
        description: "Tipo da relação (OBJETO, AFETADA, POSSIVEL_OBJETO)."
        tests:
          - accepted_values:
              arguments:
                values: ['OBJETO', 'AFETADA', 'POSSIVEL_OBJETO']
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: bridge_proposicoes_relacionadas
    description: "Relações entre proposições da Câmara (principal, anterior, posterior). Grão: proposição × relacionada × tipo."
    config:
      meta:
        grain: "proposição × relacionada × tipo"
        primary_key:
          - "sk_proposicao"
          - "proposicao_relacionada_id_nk"
          - "tipo_relacao"
        foreign_keys:
          - "sk_proposicao -> dim_proposicoes"
          - "sk_proposicao_relacionada -> dim_proposicoes"
        source: "raw_camara.raw_camara_proposicao, raw_camara.arquivo_proposicoes"
        refresh_frequency: "semanal (segundas)"
        historical_coverage: "proposições da Câmara de 1934 em diante"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_proposicao
              - proposicao_relacionada_id_nk
              - tipo_relacao
    columns:
      - name: sk_proposicao
        description: "Chave da proposição."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_proposicoes')
                field: sk_proposicao
      - name: sk_proposicao_relacionada
        description: "Chave da proposição relacionada; desconhecida quando ela não foi extraída."
        tests:
          - not_null
      - name: proposicao_relacionada_id_nk
        description: "Id da proposição relacionada na Câmara."
        tests:
          - not_null
      - name: tipo_relacao
        description: "Tipo da relação (PRINCIPAL, ANTERIOR, POSTERIOR)."
        tests:
          - accepted_values:
              arguments:
                values: ['PRINCIPAL', 'ANTERIOR', 'POSTERIOR']
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_tipo_voto
    description: "Tipos de registro de voto. Grão: casa × código de voto da origem."
    config:
      meta:
        grain: "casa × código de voto da origem"
        primary_key:
          - "sk_tipo_voto"
        foreign_keys: []
        source: "seed seed_tipos_voto"
        refresh_frequency: "manual (seed)"
        historical_coverage: "todos os códigos em uso"
    columns:
      - name: sk_tipo_voto
        description: "Chave do tipo de voto."
        tests:
          - not_null
          - unique
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: codigo_origem
        description: "Código do voto na origem."
      - name: descricao
        description: Descrição legível do código.
      - name: posicao
        description: "Posição do voto (SIM, NAO, OBSTRUCAO, ABSTENCAO, BRANCO); nula quando não é voto."
      - name: categoria
        description: "Categoria do registro de voto."
        tests:
          - accepted_values:
              arguments:
                values: ['VOTOU', 'VOTO SECRETO', 'PRESENTE SEM VOTO', 'PRESIDENCIA', 'AUSENCIA JUSTIFICADA', 'AUSENCIA NAO JUSTIFICADA', 'NAO INFORMADO', 'desconhecido']
      - name: fl_presente
        description: "1 quando o registro indica presença na sessão."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_casa
    description: "Casas legislativas. Grão: uma casa."
    config:
      meta:
        grain: "uma casa"
        primary_key:
          - "casa"
        foreign_keys: []
        source: "constante"
        refresh_frequency: "manual (seed)"
        historical_coverage: "Câmara e Senado"
    columns:
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
        tests:
          - not_null
          - unique
      - name: nome_casa
        description: "Nome oficial da casa."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_uf
    description: "Unidades da federação. Grão: uma UF."
    config:
      meta:
        grain: "uma UF"
        primary_key:
          - "uf"
        foreign_keys: []
        source: "seed seed_ufs"
        refresh_frequency: "manual (seed)"
        historical_coverage: "27 UFs"
    columns:
      - name: uf
        description: "Sigla da UF."
        tests:
          - not_null
          - unique
      - name: nome_uf
        description: "Nome da UF."
      - name: regiao
        description: "Região da UF."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NORTE', 'NORDESTE', 'CENTRO-OESTE', 'SUDESTE', 'SUL', 'desconhecido']
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_legislatura
    description: "Legislaturas. Grão: uma legislatura."
    config:
      meta:
        grain: "uma legislatura"
        primary_key:
          - "legislatura"
        foreign_keys: []
        source: "seed seed_legislaturas"
        refresh_frequency: "manual (seed)"
        historical_coverage: "legislaturas 49 a 58"
    columns:
      - name: legislatura
        description: "Número da legislatura."
        tests:
          - not_null
          - unique
      - name: inicio
        description: "Primeiro dia da legislatura."
        tests:
          - not_null
      - name: fim
        description: "Último dia da legislatura."
        tests:
          - not_null
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_sessao_legislativa
    description: "Sessões legislativas (ano legislativo). Grão: legislatura × sessão."
    config:
      meta:
        grain: "legislatura × sessão legislativa"
        primary_key:
          - "sk_sessao_legislativa"
        foreign_keys:
          - "legislatura -> dim_legislatura"
        source: "seed seed_legislaturas"
        refresh_frequency: "manual (seed)"
        historical_coverage: "legislaturas 49 a 58"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - legislatura
              - sessao_legislativa
      - dbt_utils.expression_is_true:
          arguments:
            expression: "inicio <= fim"
    columns:
      - name: sk_sessao_legislativa
        description: "Chave da sessão legislativa."
        tests:
          - not_null
          - unique
      - name: legislatura
        description: "Número da legislatura."
      - name: sessao_legislativa
        description: "Sessão legislativa dentro da legislatura (1 a 4)."
        tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
      - name: inicio
        description: "Primeiro dia da sessão legislativa."
      - name: fim
        description: "Último dia da sessão legislativa."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_governo
    description: "Governos do Executivo federal. Grão: presidente × mandato."
    config:
      meta:
        grain: "presidente × mandato"
        primary_key:
          - "sk_governo"
        foreign_keys: []
        source: "seed seed_executivo_presidente"
        refresh_frequency: "manual (seed)"
        historical_coverage: "governos desde 10/1992"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - presidente
              - mandato
    columns:
      - name: sk_governo
        description: "Chave do governo."
        tests:
          - not_null
          - unique
      - name: presidente
        description: "Presidente da República."
      - name: mandato
        description: "Número do mandato do presidente."
      - name: governo
        description: "Rótulo do governo (presidente e mandato)."
        tests:
          - unique
      - name: inicio
        description: "Primeiro dia do governo."
      - name: fim
        description: "Último dia do governo."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_calendario_legislativo
    description: "Calendário do domínio político. Grão: um dia."
    config:
      meta:
        grain: "um dia"
        primary_key:
          - "data_sk"
        foreign_keys:
          - "sk_sessao_legislativa -> dim_sessao_legislativa"
          - "sk_governo -> dim_governo"
        source: "dim_datas, seed seed_legislaturas, seed seed_executivo_presidente"
        refresh_frequency: "diária (calendário)"
        historical_coverage: "1991 em diante (legislatura 49)"
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "EXTRACT(ISODOW FROM inicio_semana) = 1 AND data - inicio_semana BETWEEN 0 AND 6"
    columns:
      - name: data_sk
        description: "Chave da data (AAAAMMDD)."
        tests:
          - not_null
          - unique
      - name: data
        description: "Data."
      - name: inicio_semana
        description: "Segunda-feira da semana ISO da data."
        tests:
          - not_null
      - name: ano
        description: "ano"
      - name: semestre
        description: "semestre"
      - name: trimestre_do_ano
        description: "trimestre_do_ano"
      - name: inicio_trimestre
        description: "inicio_trimestre"
      - name: fim_trimestre
        description: "fim_trimestre"
      - name: mes_sk
        description: "mes_sk"
      - name: mes_do_ano
        description: "mes_do_ano"
      - name: nome_mes
        description: "nome_mes"
      - name: nome_mes_abrev
        description: "nome_mes_abrev"
      - name: inicio_mes
        description: "inicio_mes"
      - name: fim_mes
        description: "fim_mes"
      - name: semana_iso_do_ano
        description: "semana_iso_do_ano"
      - name: dia_semana_num
        description: "dia_semana_num"
      - name: nome_dia_semana
        description: "nome_dia_semana"
      - name: nome_dia_semana_abrev
        description: "nome_dia_semana_abrev"
      - name: fl_fim_de_semana
        description: "fl_fim_de_semana"
      - name: fl_feriado
        description: "fl_feriado"
      - name: nome_feriado
        description: "nome_feriado"
      - name: fl_dia_util
        description: "fl_dia_util"
      - name: legislatura
        description: "Número da legislatura."
      - name: sessao_legislativa
        description: "Sessão legislativa dentro da legislatura (1 a 4)."
      - name: sk_sessao_legislativa
        description: "Chave da sessão legislativa."
        tests:
          - relationships:
              arguments:
                to: ref('dim_sessao_legislativa')
                field: sk_sessao_legislativa
      - name: presidente
        description: "Presidente da República em exercício."
      - name: mandato_presidencial
        description: "Número do mandato do presidente em exercício."
      - name: sk_governo
        description: "Chave do governo em exercício."
        tests:
          - relationships:
              arguments:
                to: ref('dim_governo')
                field: sk_governo
      - name: fl_ano_eleicao_geral
        description: "Ano de eleição geral."
      - name: fl_ano_eleicao_municipal
        description: "Ano de eleição municipal."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_bancada
    description: "Lideranças que orientam votações: partidos, federações, blocos, Governo, Maioria, Minoria e Oposição. Grão: casa × sigla da liderança × partido."
    config:
      meta:
        grain: "casa × sigla da liderança × partido"
        primary_key:
          - "sk_bancada"
        foreign_keys:
          - "sk_partido -> dim_partidos"
        source: "raw_camara.raw_camara_votacoes_orientacao, raw_senado.raw_senado_votos_orientacao, seed seed_bancadas_composicao"
        refresh_frequency: "Câmara semanal (segundas); Senado mensal (dia 1)"
        historical_coverage: "orientação do Governo: Câmara desde 12/2001; Senado desde 10/2018"
    columns:
      - name: sk_bancada
        description: "Chave da bancada."
        tests:
          - not_null
          - unique
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: sigla_bancada
        description: "Sigla da liderança como aparece nas orientações."
        tests:
          - not_null
      - name: tipo_bancada
        description: "Tipo da bancada (PARTIDO, FEDERACAO, BLOCO, GOVERNO, MAIORIA, MINORIA, OPOSICAO, BANCADA TEMATICA, OUTRA)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PARTIDO', 'FEDERACAO', 'BLOCO', 'GOVERNO', 'MAIORIA', 'MINORIA', 'OPOSICAO', 'BANCADA TEMATICA', 'OUTRA', 'desconhecido']
      - name: sk_partido
        description: "Chave do partido quando a bancada é um partido; desconhecido nos demais tipos."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_partidos')
                field: sk_partido
      - name: partidos_membros
        description: "Siglas dos partidos que compõem a federação ou o bloco, segundo a seed de composição."
      - name: primeira_orientacao
        description: "Data da primeira orientação da bancada."
      - name: ultima_orientacao
        description: "Data da última orientação da bancada."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: bridge_bancadas_partidos
    description: "Composição das federações e blocos, com vigência. Grão: bancada × partido × início."
    config:
      meta:
        grain: "bancada × partido × início"
        primary_key:
          - "sk_bancada"
          - "sk_partido"
          - "inicio"
        foreign_keys:
          - "sk_bancada -> dim_bancada"
          - "sk_partido -> dim_partidos"
        source: "seed seed_bancadas_composicao"
        refresh_frequency: "manual (seed)"
        historical_coverage: "federações desde 03/2023; blocos conforme a seed"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_bancada
              - sk_partido
              - inicio
    columns:
      - name: sk_bancada
        description: "Chave da bancada."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_bancada')
                field: sk_bancada
      - name: sk_partido
        description: "Chave do partido membro."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_partidos')
                field: sk_partido
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: sigla_bancada
        description: "Sigla da bancada."
      - name: tipo_bancada
        description: "Tipo da bancada (FEDERACAO, BLOCO)."
        tests:
          - accepted_values:
              arguments:
                values: ['FEDERACAO', 'BLOCO']
      - name: inicio
        description: "Início da participação do partido na bancada."
        tests:
          - not_null
      - name: fim
        description: "Fim da participação; nulo quando vigente."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_partidos
    description: "Partidos. Grão: entidade partidária, que agrupa as siglas de um mesmo partido."
    config:
      meta:
        grain: "entidade partidária"
        primary_key:
          - "sk_partido"
        foreign_keys: []
        source: "seed seed_partidos, seed seed_partidos_siglas"
        refresh_frequency: "manual (seed)"
        historical_coverage: "partidos desde 1962"
    columns:
      - name: sk_partido
        description: "Chave do partido."
        tests:
          - not_null
          - unique
      - name: partido_id_nk
        description: "Id da entidade partidária."
      - name: sigla
        description: "Sigla atual do partido."
      - name: rotulo
        description: "Nome de exibição do partido; siglas reutilizadas levam o período (ex.: PL (1985-2006))."
        tests:
          - unique
      - name: nome
        description: "Nome atual do partido."
      - name: siglas_historicas
        description: "Siglas já usadas pelo partido."
      - name: data_criacao
        description: "Data de criação do partido."
      - name: data_extincao
        description: "Data de extinção do partido."
      - name: fl_extinto
        description: "1 quando o partido foi extinto."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_orgaos
    description: "Órgãos que votam. Grão: casa × sigla do órgão."
    config:
      meta:
        grain: "casa × sigla do órgão"
        primary_key:
          - "sk_orgao"
        foreign_keys: []
        source: "raw_camara.raw_camara_votacoes, raw_senado.raw_senado_votacoes"
        refresh_frequency: "Câmara semanal (segundas); Senado mensal (dia 1)"
        historical_coverage: "Câmara desde 01/1993 (nominais desde 12/2001); Senado desde 02/2001"
    columns:
      - name: sk_orgao
        description: "Chave do órgão."
        tests:
          - not_null
          - unique
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: sigla_orgao
        description: Sigla do órgão (PLEN, CCJC, PEC00619...).
      - name: tipo_orgao
        description: "Tipo do órgão (PLENARIO, MESA DIRETORA, CPI, COMISSAO ESPECIAL, COMISSAO, OUTROS)."
        tests:
          - accepted_values:
              arguments:
                values: ['PLENARIO', 'MESA DIRETORA', 'CPI', 'COMISSAO ESPECIAL', 'COMISSAO', 'OUTROS', 'desconhecido']
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_tipo_votacao
    description: "Tipos de votação (junk dimension). Grão: classe × nominal × secreta."
    config:
      meta:
        grain: "classe × nominal × secreta"
        primary_key:
          - "sk_tipo_votacao"
        foreign_keys: []
        source: "constante"
        refresh_frequency: "manual (seed)"
        historical_coverage: "todas as combinações"
    columns:
      - name: sk_tipo_votacao
        description: "Chave do tipo de votação."
        tests:
          - not_null
          - unique
      - name: classe_votacao
        description: "Classe da votação (MERITO, EMENDA/DESTAQUE, URGENCIA, REQUERIMENTO PROCEDIMENTAL, PARECER, AUTORIDADE, OUTROS)."
        tests:
          - accepted_values:
              arguments:
                values: ['MERITO', 'EMENDA/DESTAQUE', 'URGENCIA', 'REQUERIMENTO PROCEDIMENTAL', 'PARECER', 'AUTORIDADE', 'OUTROS', 'desconhecido']
      - name: grupo_votacao
        description: "Grupo da classe (MERITO, PROCEDIMENTAL, ADMISSIBILIDADE, AUTORIDADE, OUTROS)."
      - name: fl_nominal
        description: "1 quando a votação teve votos nominais."
      - name: fl_secreta
        description: 1 quando a votação foi secreta.
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: fct_votacoes
    description: "Votações da Câmara e do Senado, com placar e resultado. Grão: uma votação."
    config:
      meta:
        grain: "uma votação"
        primary_key:
          - "sk_votacao"
        foreign_keys:
          - "sk_data -> dim_calendario_legislativo"
          - "sk_proposicao -> dim_proposicoes"
          - "sk_orgao -> dim_orgaos"
          - "sk_tipo_votacao -> dim_tipo_votacao"
        source: "raw_camara.raw_camara_votacoes, raw_senado.raw_senado_votacoes, raw_camara.raw_camara_votos_deputados, raw_senado.raw_senado_votos_senadores, raw_camara.raw_camara_votacoes_orientacao, raw_senado.raw_senado_votos_orientacao"
        refresh_frequency: "Câmara semanal (segundas); Senado mensal (dia 1)"
        historical_coverage: "Câmara desde 01/1993 (nominais desde 12/2001); Senado desde 02/2001; orientação do Governo: Câmara desde 12/2001; Senado desde 10/2018"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - votacao_id_nk
      - dbt_utils.expression_is_true:
          arguments:
            expression: "qt_votantes = qt_votos_sim + qt_votos_nao + qt_obstrucao"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "casa <> 'SENADO' OR qt_votantes <= 81"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(fl_resultado_alinhado_governo IS NULL) = (motivo_resultado_nao_classificado IS NOT NULL)"
    columns:
      - name: sk_votacao
        description: "Chave da votação."
        tests:
          - not_null
          - unique
      - name: votacao_id_nk
        description: "Chave natural da votação na casa."
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: sessao_id
        description: "Id da sessão em que a votação ocorreu."
      - name: sk_data
        description: "Chave da data da votação."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_calendario_legislativo')
                field: data_sk
      - name: sk_proposicao
        description: "Chave da proposição votada."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_proposicoes')
                field: sk_proposicao
      - name: sk_orgao
        description: "Chave do órgão que votou."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_orgaos')
                field: sk_orgao
      - name: sk_tipo_votacao
        description: "Chave do tipo de votação."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tipo_votacao')
                field: sk_tipo_votacao
      - name: descricao
        description: "Descrição da votação."
      - name: modalidade_votacao
        description: "Modalidade (NOMINAL ABERTA, NOMINAL SECRETA, SEM REGISTRO NOMINAL)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['NOMINAL ABERTA', 'NOMINAL SECRETA', 'SEM REGISTRO NOMINAL']
      - name: orientacao_governo
        description: "Orientação do Governo (SIM, NAO, OBSTRUCAO, LIBERADO, ABSTENCAO)."
      - name: fl_aprovada
        description: "1 quando a votação foi aprovada, 0 quando não aprovada (rejeição ou falta de quórum); nulo quando o resultado não é binário."
      - name: fl_nominal
        description: "1 quando a votação teve votos nominais."
      - name: fl_secreta
        description: "1 quando a votação foi secreta."
      - name: fl_governo_orientou
        description: "1 quando o Governo orientou SIM, NÃO ou OBSTRUÇÃO."
      - name: fl_resultado_alinhado_governo
        description: "1 quando o resultado seguiu a orientação do Governo, 0 quando contrariou."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: motivo_resultado_nao_classificado
        description: "Motivo de o resultado não ser classificado (SEM ORIENTACAO, LIBERADO, ORIENTACAO ABSTENCAO, RESULTADO NAO BINARIO)."
        tests:
          - accepted_values:
              arguments:
                values: ['SEM ORIENTACAO', 'LIBERADO', 'ORIENTACAO ABSTENCAO', 'RESULTADO NAO BINARIO']
      - name: qt_votos_sim
        description: Votos SIM.
      - name: qt_votos_nao
        description: Votos NÃO.
      - name: qt_obstrucao
        description: Votos de OBSTRUÇÃO.
      - name: qt_abstencao
        description: "Abstenções."
      - name: qt_votantes
        description: "Votantes (SIM, NÃO ou OBSTRUÇÃO)."
      - name: qt_presentes_sem_voto
        description: "Presentes que não votaram."
      - name: qt_ausentes
        description: "Parlamentares ausentes."
      - name: qt_partidos
        description: Partidos distintos entre os votantes.
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: fct_votos
    description: "Registros de voto da Câmara e do Senado, incluindo abstenções, presenças e ausências. Grão: parlamentar × votação."
    config:
      meta:
        grain: "parlamentar × votação"
        primary_key:
          - "sk_voto"
        foreign_keys:
          - "sk_votacao -> fct_votacoes"
          - "sk_parlamentar -> dim_parlamentares"
          - "sk_partido -> dim_partidos"
          - "sk_bancada -> dim_bancada"
          - "sk_data -> dim_calendario_legislativo"
          - "sk_proposicao -> dim_proposicoes"
          - "sk_orgao -> dim_orgaos"
          - "sk_tipo_votacao -> dim_tipo_votacao"
          - "sk_tipo_voto -> dim_tipo_voto"
          - "uf -> dim_uf"
        source: "raw_camara.raw_camara_votos_deputados, raw_senado.raw_senado_votos_senadores, raw_camara.raw_camara_votacoes_orientacao, raw_senado.raw_senado_votos_orientacao"
        refresh_frequency: "Câmara semanal (segundas); Senado mensal (dia 1)"
        historical_coverage: "votações nominais: Câmara desde 12/2001; Senado desde 02/2001"
    columns:
      - name: sk_voto
        description: "Chave do registro de voto."
        tests:
          - not_null
          - unique
      - name: sk_votacao
        description: "Chave da votação."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_votacoes')
                field: sk_votacao
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_parlamentares')
                field: sk_parlamentar
      - name: sk_partido
        description: "Chave do partido do parlamentar no momento do voto."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_partidos')
                field: sk_partido
      - name: sk_bancada
        description: "Chave da federação ou bloco do partido do parlamentar na data do voto; desconhecido sem bancada."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_bancada')
                field: sk_bancada
      - name: sk_data
        description: "Chave da data da votação."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_calendario_legislativo')
                field: data_sk
      - name: sk_proposicao
        description: "Chave da proposição votada."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_proposicoes')
                field: sk_proposicao
      - name: sk_orgao
        description: "Chave do órgão que votou."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_orgaos')
                field: sk_orgao
      - name: sk_tipo_votacao
        description: "Chave do tipo de votação."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tipo_votacao')
                field: sk_tipo_votacao
      - name: sk_tipo_voto
        description: "Chave do tipo de voto."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tipo_voto')
                field: sk_tipo_voto
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: uf
        description: "UF de representação do parlamentar no momento do voto."
        tests:
          - relationships:
              arguments:
                to: ref('dim_uf')
                field: uf
      - name: votacao_id_nk
        description: "Chave natural da votação na casa."
      - name: partido
        description: "Sigla do partido no momento do voto."
      - name: partido_nome
        description: "Nome do partido no momento do voto."
      - name: voto
        description: "Posição do voto (SIM, NAO, OBSTRUCAO, ABSTENCAO, BRANCO); nula quando não é voto."
        tests:
          - accepted_values:
              arguments:
                values: ['SIM', 'NAO', 'OBSTRUCAO', 'ABSTENCAO', 'BRANCO']
      - name: orientacao_governo
        description: "Orientação do Governo na votação."
      - name: orientacao_partido
        description: "Orientação do partido do parlamentar na votação."
      - name: orientacao_bancada
        description: "Orientação da federação ou bloco do partido do parlamentar na votação."
      - name: fl_governo_orientou
        description: "1 quando o Governo orientou SIM, NÃO ou OBSTRUÇÃO."
      - name: fl_seguiu_governo
        description: "1 quando o voto seguiu a orientação do Governo, 0 quando divergiu."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: fl_partido_orientou
        description: "1 quando o partido do parlamentar orientou a votação."
      - name: fl_seguiu_partido
        description: "1 quando o voto seguiu a orientação do partido, 0 quando divergiu."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: fl_seguiu_bancada
        description: "1 quando o voto seguiu a orientação da federação ou bloco, 0 quando divergiu."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: fl_votou_com_resultado
        description: "1 quando o voto ficou do lado vencedor, 0 quando perdeu."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: fct_presencas_plenario
    description: "Presença e ausência nas votações nominais do Plenário em que o parlamentar estava em exercício. Grão: parlamentar × votação."
    config:
      meta:
        grain: "parlamentar × votação nominal do Plenário em exercício"
        primary_key:
          - "sk_presenca"
        foreign_keys:
          - "sk_parlamentar -> dim_parlamentares"
          - "sk_votacao -> fct_votacoes"
          - "sk_partido -> dim_partidos"
          - "sk_tipo_voto -> dim_tipo_voto"
        source: "raw_camara.raw_camara_votos_deputados, raw_senado.raw_senado_votos_senadores, raw_camara.raw_camara_votacoes, raw_senado.raw_senado_votacoes"
        refresh_frequency: "Câmara semanal (segundas); Senado mensal (dia 1)"
        historical_coverage: "votações nominais: Câmara desde 12/2001; Senado desde 02/2001"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_parlamentar
              - sk_votacao
    columns:
      - name: sk_presenca
        description: "Chave do registro de presença."
        tests:
          - not_null
          - unique
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_parlamentares')
                field: sk_parlamentar
      - name: sk_votacao
        description: "Chave da votação."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_votacoes')
                field: sk_votacao
      - name: sk_data
        description: "Chave da data da votação."
        tests:
          - not_null
      - name: sk_tipo_voto
        description: "Chave do tipo de registro; desconhecido na ausência inferida."
        tests:
          - not_null
      - name: sk_partido
        description: "Chave do partido do parlamentar na data; na ausência inferida, o do voto anterior."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_partidos')
                field: sk_partido
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: modalidade_votacao
        description: "Modalidade da votação (NOMINAL ABERTA, NOMINAL SECRETA)."
      - name: uf
        description: "UF de representação na data; na ausência inferida, a do voto anterior."
      - name: categoria_presenca
        description: "Categoria do registro, com AUSENCIA INFERIDA para o deputado sem registro no período de exercício."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['VOTOU', 'VOTO SECRETO', 'PRESENTE SEM VOTO', 'PRESIDENCIA', 'AUSENCIA JUSTIFICADA', 'AUSENCIA NAO JUSTIFICADA', 'AUSENCIA INFERIDA', 'NAO INFORMADO']
      - name: fl_presente
        description: "1 quando o parlamentar esteve presente, 0 quando ausente; nulo quando a origem não informa."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: fl_ausencia_inferida
        description: "1 quando a ausência é inferida (deputado sem registro no período de exercício)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: fl_votou_com_posicao
        description: "1 quando o parlamentar votou SIM, NÃO ou OBSTRUÇÃO."
        tests:
          - not_null
      - name: fl_governo_orientou
        description: "1 quando o Governo orientou SIM, NÃO ou OBSTRUÇÃO na votação."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: fct_orientacoes
    description: "Orientações de voto das lideranças. Grão: liderança × votação."
    config:
      meta:
        grain: "liderança × votação"
        primary_key:
          - "casa"
          - "votacao_origem_id"
          - "sigla_lideranca"
        foreign_keys:
          - "sk_votacao -> fct_votacoes"
          - "sk_partido -> dim_partidos"
          - "sk_bancada -> dim_bancada"
          - "sk_data -> dim_calendario_legislativo"
        source: "raw_camara.raw_camara_votacoes_orientacao, raw_senado.raw_senado_votos_orientacao"
        refresh_frequency: "Câmara semanal (segundas); Senado mensal (dia 1)"
        historical_coverage: "orientação do Governo: Câmara desde 12/2001; Senado desde 10/2018"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - votacao_origem_id
              - sigla_lideranca
    columns:
      - name: sk_votacao
        description: "Chave da votação orientada."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_votacoes')
                field: sk_votacao
              config:
                severity: warn
      - name: sk_data
        description: "Chave da data da votação."
      - name: sk_partido
        description: "Chave do partido que orientou; desconhecido para lideranças não partidárias."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_partidos')
                field: sk_partido
      - name: sk_bancada
        description: "Chave da bancada que orientou."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_bancada')
                field: sk_bancada
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: votacao_id_nk
        description: "Chave natural da votação na casa."
      - name: votacao_origem_id
        description: "Chave da votação na fonte de orientações."
      - name: sigla_lideranca
        description: "Sigla da liderança que orientou (partido, bloco, GOVERNO, MAIORIA...)."
      - name: tipo_lideranca
        description: "Tipo de liderança (BANCADA, PARTIDO)."
      - name: orientacao_voto
        description: Orientação emitida.
        tests:
          - accepted_values:
              arguments:
                values: ['SIM', 'NAO', 'OBSTRUCAO', 'LIBERADO', 'ABSTENCAO']
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_indicador_externo
    description: "Indicadores publicados por fontes externas, com unidade, escala e metodologia. Grão: fonte × indicador."
    config:
      meta:
        grain: "fonte × indicador"
        primary_key:
          - "sk_indicador_externo"
        foreign_keys: []
        source: "constante"
        refresh_frequency: "manual (seed)"
        historical_coverage: "indicadores do Radar e do Ranking"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fonte
              - indicador
    columns:
      - name: sk_indicador_externo
        description: "Chave do indicador externo."
        tests:
          - not_null
          - unique
      - name: fonte
        description: "Fonte que publica o indicador (RADAR CONGRESSO, RANKING DOS POLITICOS)."
        tests:
          - accepted_values:
              arguments:
                values: ['RADAR CONGRESSO', 'RANKING DOS POLITICOS']
      - name: indicador
        description: "Nome do indicador."
      - name: descricao
        description: "O que o indicador mede, segundo a fonte."
      - name: unidade
        description: "Unidade do valor (PERCENTUAL, PONTOS, POSICAO)."
      - name: escala
        description: "Escala publicada do valor."
      - name: periodo_tipo
        description: "Período de referência do valor (TRIMESTRE, MANDATO, ANO, ATUAL)."
      - name: url_fonte
        description: "Endereço da fonte."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: fct_indicadores_externos
    description: "Valores publicados por fontes externas, preservados sem alteração e versionados pela data de coleta. Grão: indicador × parlamentar × período × coleta."
    config:
      meta:
        grain: "indicador × parlamentar × período × coleta"
        primary_key:
          - "sk_indicador_valor"
        foreign_keys:
          - "sk_indicador_externo -> dim_indicador_externo"
          - "sk_parlamentar -> dim_parlamentares"
        source: "raw_radar_congresso.raw_radar_governismo_deputados, raw_radar_congresso.raw_radar_governismo_senadores, raw_radar_congresso.raw_radar_parlamentares, raw_ranking_politicos.raw_ranking_deputados, raw_ranking_politicos.raw_ranking_senadores"
