unit_tests:

  - name: fct_votacoes_placar_e_resultado_alinhado_governo
    description: >
      Votantes são só SIM, NÃO e OBSTRUÇÃO. O resultado é alinhado ao Governo quando segue a
      orientação SIM, ou NÃO/OBSTRUÇÃO com rejeição; sem classificação, o motivo fica explícito.
      A modalidade separa nominal aberta, nominal secreta e sem registro nominal.
    model: fct_votacoes
    given:
      - input: ref('int_votacoes_unificadas')
        rows:
          - {casa: CAMARA, votacao_id_nk: '1-1', sessao_id: '395', data_votacao: '2023-05-10', sigla_orgao: PLEN, descricao: A, proposicao_id_nk: 10, aprovado: 1, fl_secreta: 0, classe_votacao: MERITO}
