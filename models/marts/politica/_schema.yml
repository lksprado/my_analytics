        - {sk_parlamentar: d2, sk_bancada: b_fdr_psol, orientacao_bancada: SIM, fl_seguiu_bancada: 0}
        - {sk_parlamentar: d3, sk_bancada: '0', orientacao_bancada: null, fl_seguiu_bancada: null}

seeds:

  - name: seed_ufs
    description: "UFs com nome e região."
    columns:
      - name: uf
        description: "Sigla da UF."
        tests:
          - not_null
          - unique
      - name: nome_uf
        description: "Nome da UF."
      - name: regiao
        description: "Região da UF."
        tests:
          - not_null

  - name: seed_bancadas_composicao
    description: "Composição das federações e blocos por partido, com vigência. Mantida manualmente."
    config:
      column_types:
        inicio: date
        fim: date
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - sigla_bancada
              - partido
              - inicio
    columns:
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: sigla_bancada
        description: "Sigla da federação ou bloco como aparece nas orientações."
      - name: partido
        description: "Sigla do partido membro."
      - name: inicio
        description: "Início da participação do partido na bancada."
      - name: fim
        description: "Fim da participação; vazio quando vigente."
