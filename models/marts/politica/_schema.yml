          - {casa: SENADO, votacao_id_nk: '99', sessao_id: '7', data_votacao: '2023-05-11', sigla_orgao: PLEN, descricao: C, proposicao_id_nk: 20, aprovado: 1, fl_secreta: 1, classe_votacao: AUTORIDADE}
