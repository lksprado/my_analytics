version: 2

models:

  - name: dim_parlamentares
    description: "Parlamentares (deputados e senadores). Grão: um parlamentar por casa."
    columns:
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
          - unique
      - name: deputado_id_nk
        description: "Id do deputado na Câmara."
      - name: senador_id_nk
        description: "Id do senador no Senado."
      - name: radar_deputado_id_fk
        description: "Id do deputado no Radar Congresso."
      - name: radar_senador_id_fk
        description: "Id do senador no Radar Congresso."
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CAMARA', 'SENADO', 'desconhecido']
      - name: nome
        description: "Nome parlamentar."
      - name: nome_completo
        description: Nome civil completo.
      - name: sexo
        description: "Sexo (MASCULINO, FEMININO)."
        tests:
          - accepted_values:
              arguments:
                values: ['MASCULINO', 'FEMININO', 'desconhecido']
      - name: uf
        description: "UF de representação no mandato mais recente."
      - name: regiao
        description: "Região da UF de representação."
        tests:
          - accepted_values:
              arguments:
                values: ['NORTE', 'NORDESTE', 'CENTRO-OESTE', 'SUDESTE', 'SUL', 'desconhecido']
      - name: data_nascimento
        description: "Data de nascimento (só Câmara)."
      - name: escolaridade
        description: "Escolaridade (só Câmara)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_proposicoes
    description: "Proposições da Câmara e do Senado. Grão: uma proposição por casa."
    columns:
      - name: sk_proposicao
        description: "Chave da proposição."
        tests:
          - not_null
          - unique
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: proposicao_id_nk
        description: "Id da proposição na casa."
      - name: tipo_proposicao
        description: "Tipo da proposição (PL, PEC...)."
      - name: data_proposicao
        description: Data de apresentação da proposição.
      - name: identificacao
        description: "Identificação da proposição (ex.: PL 1234/2023)."
      - name: ementa
        description: "Ementa (só Câmara)."
      - name: situacao_atual
        description: "Situação atual de tramitação."
      - name: regime
        description: "Regime de tramitação atual (só Câmara)."
      - name: autoria
        description: "Autoria (só Senado)."
      - name: norma_gerada
        description: "Norma gerada pela proposição (só Senado)."
      - name: sk_data
        description: "Chave da data de apresentação."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_tipo_voto
    description: "Tipos de registro de voto. Grão: casa × código de voto da origem."
    columns:
      - name: sk_tipo_voto
        description: "Chave do tipo de voto."
        tests:
          - not_null
          - unique
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: codigo_origem
        description: "Código do voto na origem."
      - name: descricao
        description: Descrição legível do código.
      - name: posicao
        description: "Posição do voto (SIM, NAO, OBSTRUCAO, ABSTENCAO, BRANCO); nula quando não é voto."
      - name: categoria
        description: "Categoria do registro de voto."
        tests:
          - accepted_values:
              arguments:
                values: ['VOTOU', 'VOTO SECRETO', 'PRESENTE SEM VOTO', 'PRESIDENCIA', 'AUSENCIA JUSTIFICADA', 'AUSENCIA NAO JUSTIFICADA', 'NAO INFORMADO', 'desconhecido']
      - name: fl_presente
        description: "1 quando o registro indica presença na sessão."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_calendario_legislativo
    description: "Calendário do domínio político. Grão: um dia."
    columns:
      - name: data_sk
        description: "Chave da data (AAAAMMDD)."
        tests:
          - not_null
          - unique
      - name: data
        description: "Data."
      - name: legislatura
        description: "Número da legislatura."
      - name: sessao_legislativa
        description: "Sessão legislativa dentro da legislatura (1 a 4)."
      - name: presidente
        description: "Presidente da República em exercício."
      - name: mandato_presidencial
        description: "Número do mandato do presidente em exercício."
      - name: fl_ano_eleicao_geral
        description: "Ano de eleição geral."
      - name: fl_ano_eleicao_municipal
        description: "Ano de eleição municipal."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_partidos
    description: "Partidos. Grão: entidade partidária, que agrupa as siglas de um mesmo partido."
    columns:
      - name: sk_partido
        description: "Chave do partido."
        tests:
          - not_null
          - unique
      - name: partido_id_nk
        description: "Id da entidade partidária."
      - name: sigla
        description: "Sigla atual do partido."
      - name: nome
        description: "Nome atual do partido."
      - name: siglas_historicas
        description: "Siglas já usadas pelo partido."
      - name: data_criacao
        description: "Data de criação do partido."
      - name: data_extincao
        description: "Data de extinção do partido."
      - name: fl_extinto
        description: "1 quando o partido foi extinto."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_orgaos
    description: "Órgãos que votam. Grão: casa × sigla do órgão."
    columns:
      - name: sk_orgao
        description: "Chave do órgão."
        tests:
          - not_null
          - unique
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: sigla_orgao
        description: Sigla do órgão (PLEN, CCJC, PEC00619...).
      - name: tipo_orgao
        description: "Tipo do órgão (PLENARIO, MESA DIRETORA, CPI, COMISSAO ESPECIAL, COMISSAO, OUTROS)."
        tests:
          - accepted_values:
              arguments:
                values: ['PLENARIO', 'MESA DIRETORA', 'CPI', 'COMISSAO ESPECIAL', 'COMISSAO', 'OUTROS', 'desconhecido']
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: dim_tipo_votacao
    description: "Tipos de votação (junk dimension). Grão: classe × nominal × secreta."
    columns:
      - name: sk_tipo_votacao
        description: "Chave do tipo de votação."
        tests:
          - not_null
          - unique
      - name: classe_votacao
        description: "Classe da votação (MERITO, EMENDA/DESTAQUE, URGENCIA, REQUERIMENTO PROCEDIMENTAL, PARECER, AUTORIDADE, OUTROS)."
        tests:
          - accepted_values:
              arguments:
                values: ['MERITO', 'EMENDA/DESTAQUE', 'URGENCIA', 'REQUERIMENTO PROCEDIMENTAL', 'PARECER', 'AUTORIDADE', 'OUTROS', 'desconhecido']
      - name: grupo_votacao
        description: "Grupo da classe (MERITO, PROCEDIMENTAL, ADMISSIBILIDADE, AUTORIDADE, OUTROS)."
      - name: fl_nominal
        description: "1 quando a votação teve votos nominais."
      - name: fl_secreta
        description: 1 quando a votação foi secreta.
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: fct_votacoes
    description: "Votações da Câmara e do Senado, com placar e resultado. Grão: uma votação."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - votacao_id_nk
      - dbt_utils.expression_is_true:
          arguments:
            expression: "qt_votantes = qt_votos_sim + qt_votos_nao + qt_obstrucao"
    columns:
      - name: sk_votacao
        description: "Chave da votação."
        tests:
          - not_null
          - unique
      - name: votacao_id_nk
        description: "Chave natural da votação na casa."
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: sk_data
        description: "Chave da data da votação."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_calendario_legislativo')
                field: data_sk
      - name: sk_proposicao
        description: "Chave da proposição votada."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_proposicoes')
                field: sk_proposicao
      - name: sk_orgao
        description: "Chave do órgão que votou."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_orgaos')
                field: sk_orgao
      - name: sk_tipo_votacao
        description: "Chave do tipo de votação."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tipo_votacao')
                field: sk_tipo_votacao
      - name: descricao
        description: "Descrição da votação."
      - name: orientacao_governo
        description: "Orientação do Governo."
      - name: fl_aprovada
        description: "1 quando a votação foi aprovada."
      - name: fl_nominal
        description: "1 quando a votação teve votos nominais."
      - name: fl_secreta
        description: "1 quando a votação foi secreta."
      - name: fl_governo_orientou
        description: "1 quando o Governo orientou SIM, NÃO ou OBSTRUÇÃO."
      - name: fl_governo_venceu
        description: "1 quando o resultado seguiu a orientação SIM/NÃO do Governo, 0 quando contrariou."
      - name: qt_votos_sim
        description: Votos SIM.
      - name: qt_votos_nao
        description: Votos NÃO.
      - name: qt_obstrucao
        description: Votos de OBSTRUÇÃO.
      - name: qt_abstencao
        description: "Abstenções."
      - name: qt_votantes
        description: "Votantes (SIM, NÃO ou OBSTRUÇÃO)."
      - name: qt_presentes_sem_voto
        description: "Presentes que não votaram."
      - name: qt_ausentes
        description: "Parlamentares ausentes."
      - name: qt_partidos
        description: Partidos distintos entre os votantes.
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: fct_votos
    description: "Registros de voto da Câmara e do Senado, incluindo abstenções, presenças e ausências. Grão: parlamentar × votação."
    columns:
      - name: sk_voto
        description: "Chave do registro de voto."
        tests:
          - not_null
          - unique
      - name: sk_votacao
        description: "Chave da votação."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_votacoes')
                field: sk_votacao
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_parlamentares')
                field: sk_parlamentar
      - name: sk_partido
        description: "Chave do partido do parlamentar no momento do voto."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_partidos')
                field: sk_partido
      - name: sk_data
        description: "Chave da data da votação."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_calendario_legislativo')
                field: data_sk
      - name: sk_proposicao
        description: "Chave da proposição votada."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_proposicoes')
                field: sk_proposicao
      - name: sk_orgao
        description: "Chave do órgão que votou."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_orgaos')
                field: sk_orgao
      - name: sk_tipo_votacao
        description: "Chave do tipo de votação."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tipo_votacao')
                field: sk_tipo_votacao
      - name: sk_tipo_voto
        description: "Chave do tipo de voto."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tipo_voto')
                field: sk_tipo_voto
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: votacao_id_nk
        description: "Chave natural da votação na casa."
      - name: partido
        description: "Sigla do partido no momento do voto."
      - name: partido_nome
        description: "Nome do partido no momento do voto."
      - name: voto
        description: "Posição do voto (SIM, NAO, OBSTRUCAO, ABSTENCAO, BRANCO); nula quando não é voto."
        tests:
          - accepted_values:
              arguments:
                values: ['SIM', 'NAO', 'OBSTRUCAO', 'ABSTENCAO', 'BRANCO']
      - name: orientacao_governo
        description: "Orientação do Governo na votação."
      - name: orientacao_partido
        description: "Orientação do partido do parlamentar na votação."
      - name: fl_governo_orientou
        description: "1 quando o Governo orientou SIM, NÃO ou OBSTRUÇÃO."
      - name: fl_seguiu_governo
        description: "1 quando o voto seguiu a orientação do Governo, 0 quando divergiu."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: fl_partido_orientou
        description: "1 quando o partido do parlamentar orientou a votação."
      - name: fl_seguiu_partido
        description: "1 quando o voto seguiu a orientação do partido, 0 quando divergiu."
        tests:
          - accepted_values:
              arguments:
                values: [0, 1]
      - name: fl_votou_com_resultado
        description: "1 quando o voto ficou do lado vencedor, 0 quando perdeu."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: fct_orientacoes
    description: "Orientações de voto das lideranças. Grão: liderança × votação."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - votacao_origem_id
              - sigla_lideranca
    columns:
      - name: sk_votacao
        description: "Chave da votação orientada."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_votacoes')
                field: sk_votacao
              config:
                severity: warn
      - name: sk_data
        description: "Chave da data da votação."
      - name: sk_partido
        description: "Chave do partido que orientou; desconhecido para lideranças não partidárias."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_partidos')
                field: sk_partido
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: votacao_id_nk
        description: "Chave natural da votação na casa."
      - name: votacao_origem_id
        description: "Chave da votação na fonte de orientações."
      - name: sigla_lideranca
        description: "Sigla da liderança que orientou (partido, bloco, GOVERNO, MAIORIA...)."
      - name: tipo_lideranca
        description: "Tipo de liderança (BANCADA, PARTIDO)."
      - name: orientacao_voto
        description: Orientação emitida.
        tests:
          - accepted_values:
              arguments:
                values: ['SIM', 'NAO', 'OBSTRUCAO', 'LIBERADO', 'ABSTENCAO']
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: fct_ranking_politicos
    description: "Ranking dos Políticos atual. Grão: um parlamentar."
    columns:
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_parlamentares')
                field: sk_parlamentar
              config:
                severity: warn
      - name: pontuacao_geral
        description: Pontuação total atual no Ranking dos Políticos.
      - name: ranking_geral
        description: "Posição no ranking geral."
      - name: ranking_casa
        description: "Posição no ranking da casa."
      - name: ranking_partido
        description: "Posição no ranking do partido."
      - name: ranking_estado
        description: "Posição no ranking da UF."
      - name: ranking_casa_estado
        description: "Posição no ranking da casa na UF."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: fct_ranking_politicos_anual
    description: "Ranking dos Políticos por ano. Grão: parlamentar × ano."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_parlamentar
              - ano
    columns:
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_parlamentares')
                field: sk_parlamentar
              config:
                severity: warn
      - name: ano
        description: "Ano de referência."
      - name: pontuacao
        description: "Pontuação no ano."
      - name: nota_base_votacoes
        description: "Nota de votações no ano."
      - name: nota_base_gastos
        description: "Nota de gastos no ano."
      - name: nota_base_presenca
        description: "Nota de presença no ano."
      - name: nota_base_privilegios
        description: "Nota de privilégios no ano."
      - name: bonus_processos
        description: "Bônus ou penalidade por processos."
      - name: bonus_producao_legislativa
        description: Bônus por produção legislativa.
      - name: bonus_articulacao_legislativa
        description: Bônus por articulação legislativa.
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: fct_governismo_legislatura
    description: "Governismo calculado. Grão: parlamentar × legislatura."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_parlamentar
              - legislatura
    columns:
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_parlamentares')
                field: sk_parlamentar
      - name: legislatura
        description: "Número da legislatura."
      - name: qt_votos_alinhados_legislatura
        description: "Votos alinhados ao Governo na legislatura."
      - name: qt_votos_legislatura
        description: "Votos em votações orientadas pelo Governo na legislatura."
      - name: perc_governismo_legislatura
        description: "Percentual de governismo na legislatura (0–100)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: fct_governismo_trimestre
    description: "Governismo calculado. Grão: parlamentar × trimestre."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_parlamentar
              - legislatura
              - ano
              - trimestre
    columns:
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
      - name: legislatura
        description: "Número da legislatura."
      - name: ano
        description: "Ano da votação."
      - name: trimestre
        description: "Trimestre da votação (1 a 4)."
      - name: qt_votos_alinhados_trimestre
        description: "Votos alinhados ao Governo no trimestre."
      - name: qt_votos_trimestre
        description: "Votos em votações orientadas pelo Governo no trimestre."
      - name: perc_governismo_trimestre
        description: "Percentual de governismo no trimestre (0–100)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: fct_radarcongresso_governismo_legislatura
    description: "Governismo publicado pelo Radar Congresso. Grão: parlamentar × legislatura."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - radar_parlamentar_id_nk
              - legislatura
    columns:
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_parlamentares')
                field: sk_parlamentar
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: radar_parlamentar_id_nk
        description: "Id do parlamentar no Radar Congresso."
      - name: legislatura
        description: "Legislatura do acumulado."
      - name: qt_votos_alinhados_legislatura
        description: "Votos alinhados ao Governo no mandato."
      - name: qt_votos_legislatura
        description: "Votos em votações orientadas pelo Governo no mandato."
      - name: perc_governismo_legislatura
        description: "Percentual de governismo no mandato (0–100)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: fct_radarcongresso_governismo_trimestre
    description: "Governismo publicado pelo Radar Congresso. Grão: parlamentar × trimestre."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - radar_parlamentar_id_nk
              - ano
              - trimestre
    columns:
      - name: sk_parlamentar
        description: "Chave do parlamentar."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_parlamentares')
                field: sk_parlamentar
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: radar_parlamentar_id_nk
        description: "Id do parlamentar no Radar Congresso."
      - name: legislatura
        description: Legislatura do trimestre medido.
      - name: ano
        description: Ano do trimestre medido.
      - name: trimestre
        description: Trimestre medido (1 a 4).
      - name: data_trimestre
        description: "Data de referência do trimestre no Radar."
      - name: perc_governismo_trimestre
        description: "Percentual de governismo no trimestre (0–100)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

unit_tests:

  - name: fct_votacoes_placar_e_sucesso_do_governo
    description: >
      Votantes são só SIM, NÃO e OBSTRUÇÃO; abstenção, presença sem voto e ausência têm contagem
      própria. fl_nominal nasce do placar, não da casa. O governo vence quando o resultado segue a
      orientação SIM/NÃO; LIBERADO não é orientação. Proposição sem par na dimensão vai para null_key.
    model: fct_votacoes
    given:
      - input: ref('int_votacoes_unificadas')
        rows:
          - {casa: CAMARA, votacao_id_nk: '1-1', data_votacao: '2023-05-10', sigla_orgao: PLEN, descricao: A, proposicao_id_nk: 10, aprovado: 1, fl_secreta: 0, classe_votacao: MERITO}
          - {casa: CAMARA, votacao_id_nk: '1-2', data_votacao: '2023-05-10', sigla_orgao: CCJC, descricao: B, proposicao_id_nk: null, aprovado: 0, fl_secreta: 0, classe_votacao: PARECER}
