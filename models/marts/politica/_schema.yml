        historical_coverage: "Radar 2023 T1 a 2025 T4; Ranking pontuação atual e anual de 2023 a 2026; versões desde a primeira coleta"
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_indicador_externo
              - casa
              - parlamentar_fonte_id_nk
              - periodo_inicio
              - data_coleta
    columns:
      - name: sk_indicador_valor
        description: "Chave do valor publicado."
        tests:
          - not_null
          - unique
      - name: sk_indicador_externo
        description: "Chave do indicador."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_indicador_externo')
                field: sk_indicador_externo
      - name: sk_parlamentar
        description: "Chave do parlamentar; desconhecido quando a fonte não casa com a dimensão."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_parlamentares')
                field: sk_parlamentar
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: parlamentar_fonte_id_nk
        description: "Id do parlamentar na fonte externa."
        tests:
          - not_null
      - name: periodo_tipo
        description: "Tipo do período de referência (TRIMESTRE, MANDATO, ANO, ATUAL)."
        tests:
          - accepted_values:
              arguments:
                values: ['TRIMESTRE', 'MANDATO', 'ANO', 'ATUAL']
      - name: periodo_inicio
        description: "Primeiro dia do período de referência; nulo para valores sem período."
      - name: periodo_fim
        description: "Último dia do período de referência; nulo para valores sem período."
      - name: valor_original
        description: "Valor publicado pela fonte, sem alteração."
        tests:
          - not_null
      - name: qt_base
        description: "Quantidade de votações que a fonte informa como base do valor, quando publicada."
      - name: data_coleta
        description: "Data em que esta versão do valor foi coletada."
        tests:
          - not_null
      - name: data_fim_vigencia
        description: "Data em que esta versão deixou de ser a publicada; nula quando vigente."
      - name: fl_versao_vigente
        description: "1 quando esta é a versão publicada atualmente."
        tests:
