          - {casa: CAMARA, votacao_id_nk: '1-1', sigla_lideranca: PR, partido_id_senado: 523, orientacao_voto: LIBERADO}
          - {casa: CAMARA, votacao_id_nk: '1-2', sigla_lideranca: PT, partido_id_senado: 71, orientacao_voto: NAO}
      - input: ref('dim_partidos')
