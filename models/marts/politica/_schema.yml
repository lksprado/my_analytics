          - {casa: CAMARA, votacao_id_nk: '2-1', sigla_lideranca: FDR PSOLREDE, partido_id_senado: null, orientacao_voto: SIM}
      - input: ref('dim_partidos')
        rows:
          - {sk_partido: pt71, partido_id_nk: 71}
          - {sk_partido: psol458, partido_id_nk: 458}
          - {sk_partido: pl523, partido_id_nk: 523}
      - input: ref('dim_parlamentares')
        rows:
          - {sk_parlamentar: d1, casa: CAMARA, deputado_id_nk: 1}
          - {sk_parlamentar: d2, casa: CAMARA, deputado_id_nk: 2}
          - {sk_parlamentar: d3, casa: CAMARA, deputado_id_nk: 3}
      - input: ref('dim_tipo_voto')
        rows:
          - {sk_tipo_voto: t_sim, casa: CAMARA, codigo_origem: SIM}
          - {sk_tipo_voto: t_nao, casa: CAMARA, codigo_origem: NAO}
      - input: ref('bridge_bancadas_partidos')
        rows:
          - {sk_bancada: b_fdr_pt, sk_partido: pt71, casa: CAMARA, sigla_bancada: FDR PTPCDOBPV, tipo_bancada: FEDERACAO, inicio: '2023-03-14', fim: null}
          - {sk_bancada: b_fdr_psol, sk_partido: psol458, casa: CAMARA, sigla_bancada: FDR PSOLREDE, tipo_bancada: FEDERACAO, inicio: '2023-03-14', fim: null}
          - {sk_bancada: b_bloco_antigo, sk_partido: pt71, casa: CAMARA, sigla_bancada: PTPDTPCDOB, tipo_bancada: BLOCO, inicio: '2017-02-01', fim: '2019-01-31'}
    expect:
      rows:
        - {sk_parlamentar: d1, sk_bancada: b_fdr_pt, orientacao_bancada: SIM, fl_seguiu_bancada: 1}
        - {sk_parlamentar: d2, sk_bancada: b_fdr_psol, orientacao_bancada: SIM, fl_seguiu_bancada: 0}
        - {sk_parlamentar: d3, sk_bancada: '0', orientacao_bancada: null, fl_seguiu_bancada: null}

seeds:

  - name: seed_ufs
    description: "UFs com nome e região."
    columns:
      - name: uf
        description: "Sigla da UF."
        tests:
          - not_null
          - unique
      - name: nome_uf
        description: "Nome da UF."
      - name: regiao
        description: "Região da UF."
        tests:
          - not_null

  - name: seed_bancadas_composicao
    description: "Composição das federações e blocos por partido, com vigência. Mantida manualmente."
    config:
      column_types:
        inicio: date
        fim: date
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - sigla_bancada
              - partido
              - inicio
    columns:
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: sigla_bancada
        description: "Sigla da federação ou bloco como aparece nas orientações."
      - name: partido
        description: "Sigla do partido membro."
      - name: inicio
        description: "Início da participação do partido na bancada."
      - name: fim
        description: "Fim da participação; vazio quando vigente."
