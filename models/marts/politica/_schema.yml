version: 2

models:

  - name: dim_parlamentares
    description: Dimensão conformada unificada de parlamentares (senadores e deputados). União direta de int_deputados_padronizados e int_senadores_padronizados com sk_parlamentar gerado.
    columns:
      - name: sk_parlamentar
        description: Chave substituta estável do parlamentar.
        tests:
          - not_null
          - unique
      - name: deputado_id_nk
        description: Chave natural do deputado na fonte da Câmara. Nulo para senadores.
      - name: senador_id_nk
        description: Chave natural do senador na fonte do Senado. Nulo para deputados.
      - name: radar_deputado_id_fk
        description: "Identificador do deputado no Radar Congresso (idparlamentarvoz), não o id oficial da casa. Nulo para senadores."
      - name: radar_senador_id_fk
        description: "Identificador do senador no Radar Congresso (idparlamentarvoz), não o id oficial da casa. Nulo para deputados."
      - name: casa
        description: Casa legislativa (CAMARA ou SENADO).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CAMARA', 'SENADO', 'desconhecido']
      - name: nome
        description: Nome eleitoral / parlamentar.
      - name: nome_completo
        description: Nome civil completo.
      - name: sexo
        description: Sexo informado no cadastro (MASCULINO/FEMININO).
        tests:
          - accepted_values:
              arguments:
                values: ['MASCULINO', 'FEMININO', 'desconhecido']
      - name: uf
        description: UF de representação do mandato mais recente, nas duas casas.
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: dim_votacoes
    description: Dimensão de sessões de votação unificada (Câmara e Senado). Alimenta joins em governismo e análises de resultado.
    columns:
      - name: sk_votacao
        description: Chave substituta da votação (codigo/id + casa).
        tests:
          - not_null
          - unique
      - name: votacao_id_nk
        description: Chave natural da votação na casa de origem (id da Câmara ou codigo_votacao do Senado).
      - name: casa
        description: Casa legislativa da votação (CAMARA ou SENADO).
      - name: data_votacao
        description: Data da sessão de votação.
      - name: sk_proposicao
        description: "Chave substituta da proposição objeto da votação; null_key quando a votação não declara proposição (2/3 das votações da Câmara)."
        tests:
          - not_null
      - name: aprovado
        description: 1 se aprovada, 0 caso contrário.
      - name: legislatura
        description: Número da legislatura (49–58) derivado da data da votação via seed_legislaturas.
      - name: sk_data
        description: Chave substituta de data (YYYYMMDD) da votação.
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: dim_orientacao_votacoes
    description: Dimensão de orientações de voto por partido/bancada (Câmara e Senado). Alimenta análises de alinhamento governista.
    columns:
      - name: sk_votacao
        description: Chave substituta da votação, join com dim_votacoes.
        tests:
          - not_null
      - name: tipo_lideranca
        description: "Tipo de liderança que emitiu a orientação (BANCADA ou PARTIDO). Nulo para o Senado."
      - name: sigla_partido_bloco
        description: Sigla do partido ou bloco que recebeu a orientação.
      - name: orientacao_voto
        description: Orientação de voto (SIM, NAO, OBSTRUCAO).
        tests:
          - accepted_values:
              arguments:
                values: ['SIM', 'NAO', 'OBSTRUCAO', 'desconhecido']
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: dim_parlamentares_score
    description: "Dimensão de scores do Ranking dos Políticos por parlamentar (Câmara e Senado). Grain: um registro por parlamentar."
    columns:
      - name: sk_parlamentar
        description: Chave substituta do parlamentar, join com dim_parlamentares.
        tests:
          - not_null
          - unique
      - name: pontuacao_geral
        description: Pontuação total atual no Ranking dos Políticos.
      - name: ranking_geral
        description: Posição no ranking geral entre todos os parlamentares.
      - name: ranking_casa
        description: Posição no ranking dentro da casa legislativa.
      - name: ranking_partido
        description: Posição no ranking dentro do partido.
      - name: ranking_estado
        description: Posição no ranking dentro do estado.
      - name: ranking_casa_estado
        description: Posição no ranking da casa dentro do estado.
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: dim_parlamentares_score_historico
    description: "Dimensão de scores históricos por ano do Ranking dos Políticos (Câmara e Senado). Grain: um registro por parlamentar por ano."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_parlamentar
              - ano
    columns:
      - name: sk_parlamentar
        description: Chave substituta do parlamentar, join com dim_parlamentares.
        tests:
          - not_null
      - name: ano
        description: Ano de referência do score.
      - name: pontuacao
        description: Pontuação final do parlamentar naquele ano.
      - name: nota_base_votacoes
        description: Nota base referente a votações naquele ano.
      - name: nota_base_gastos
        description: Nota base referente a controle de gastos naquele ano.
      - name: nota_base_presenca
        description: Nota base referente a presença/assiduidade naquele ano.
      - name: nota_base_privilegios
        description: Nota base referente à rejeição de privilégios naquele ano.
      - name: bonus_processos
        description: Bônus/penalidade por processos judiciais.
      - name: bonus_producao_legislativa
        description: Bônus por produção legislativa.
      - name: bonus_articulacao_legislativa
        description: Bônus por articulação legislativa.
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: dim_proposicoes
    description: "Dimensão de proposições unificada (Câmara e Senado) com linha dummy para chaves órfãs. Alimenta joins em governismo e dim_votacoes."
    columns:
      - name: sk_proposicao
        description: Chave substituta da proposição (casa + id).
        tests:
          - not_null
          - unique:
              config:
                severity: warn
      - name: casa
        description: Casa legislativa de origem da proposição (CAMARA ou SENADO).
      - name: proposicao_id_nk
        description: Chave natural da proposição na casa de origem.
      - name: tipo_proposicao
        description: Tipo da proposição padronizado em maiúsculas (ex. PL, PEC).
      - name: data_proposicao
        description: Data de apresentação da proposição.
      - name: sk_data
        description: Chave substituta de data (YYYYMMDD) da apresentação da proposição.
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."


  - name: fct_votos
    description: "Fato de votos individuais unificado (Câmara e Senado). Grain: um voto por parlamentar por votação."
    columns:
      - name: sk_voto
        description: Chave substituta do evento de voto (parlamentar × votação × casa).
        tests:
          - not_null
          - unique
      - name: sk_parlamentar
        description: Chave substituta do parlamentar, join com dim_parlamentares.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_parlamentares')
                field: sk_parlamentar
      - name: sk_votacao
        description: Chave substituta da votação, join com dim_votacoes.
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_votacoes')
                field: sk_votacao
      - name: sk_data
        description: Chave substituta de data (YYYYMMDD) da votação, join com dim_datas.
      - name: votacao_id_fk
        description: Chave natural da votação na casa de origem (id da Câmara ou codigo_votacao do Senado), mantida para rastreabilidade.
      - name: deputado_id_fk
        description: Chave natural do deputado na fonte da Câmara. Nulo para votos de senadores.
      - name: senador_id_fk
        description: Chave natural do senador na fonte do Senado. Nulo para votos de deputados.
      - name: casa
        description: Casa legislativa do voto (CAMARA ou SENADO).
      - name: partido
        description: "Dimensão degenerada: sigla do partido do parlamentar no momento do voto."
      - name: partido_nome
        description: "Dimensão degenerada: nome do partido no momento do voto ('desconhecido' quando não há partido)."
      - name: voto
        tests:
          - accepted_values:
              arguments:
                values: ['SIM', 'NAO', 'OBSTRUCAO']
        description: "Voto registrado (SIM, NAO, ABSTENCAO, OBSTRUCAO)."
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: fct_governismo_legislatura
    description: "Percentual de alinhamento ao governo por parlamentar e legislatura."
    columns:
      - name: sk_parlamentar
        description: "Surrogate key do parlamentar (FK de dim_parlamentares)."
      - name: deputado_id_fk
        description: Chave natural do deputado na fonte da Câmara. Nulo para senadores.
      - name: senador_id_fk
        description: Chave natural do senador na fonte do Senado. Nulo para deputados.
      - name: legislatura
        description: "Número da legislatura."
      - name: qt_votos_alinhados_legislatura
        description: "Quantidade de votos alinhados com a orientação do governo na legislatura."
      - name: qt_votos_legislatura
        description: "Quantidade de votações orientadas pelo governo em que o parlamentar votou na legislatura."
      - name: perc_governismo_legislatura
        description: "Percentual de governismo na legislatura (0–100)."
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso)."

  - name: fct_governismo_trimestre
    description: "Percentual de alinhamento ao governo por parlamentar, legislatura, ano e trimestre."
    columns:
      - name: sk_parlamentar
        description: "Surrogate key do parlamentar (FK de dim_parlamentares)."
      - name: deputado_id_fk
        description: Chave natural do deputado na fonte da Câmara. Nulo para senadores.
      - name: senador_id_fk
        description: Chave natural do senador na fonte do Senado. Nulo para deputados.
      - name: legislatura
        description: "Número da legislatura."
      - name: ano
        description: "Ano da votação."
      - name: trimestre
        description: "Trimestre da votação (1 a 4)."
      - name: qt_votos_alinhados_trimestre
        description: "Quantidade de votos alinhados com a orientação do governo no trimestre."
      - name: qt_votos_trimestre
        description: "Quantidade de votações orientadas pelo governo em que o parlamentar votou no trimestre."
      - name: perc_governismo_trimestre
        description: "Percentual de governismo no trimestre (0–100)."
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso)."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - sk_parlamentar
              - legislatura
              - ano
              - trimestre

  - name: fct_radarcongresso_governismo_legislatura
    description: >
      Governismo do Radar Congresso resolvido para o id oficial do parlamentar, no acumulado do
      mandato. Grain: um registro por parlamentar (casa + radar_parlamentar_id_nk).
    columns:
      - name: casa
        description: "Casa legislativa (CAMARA ou SENADO), derivada da tabela de origem."
      - name: radar_parlamentar_id_nk
        description: "Identificador do parlamentar no Radar Congresso (idparlamentarvoz). Join com dim_parlamentares via radar_deputado_id_fk/radar_senador_id_fk."
      - name: deputado_id_fk
        description: "Chave natural do deputado na fonte da Câmara, resolvida via dim_parlamentares. Nulo para senadores."
      - name: senador_id_fk
        description: "Chave natural do senador na fonte do Senado, resolvida via dim_parlamentares. Nulo para deputados."
      - name: qt_votos_alinhados_legislatura
        description: "Votos alinhados ao governo no acumulado do mandato."
      - name: qt_votos_legislatura
        description: "Denominador do cálculo: total de votos em votações com orientação do governo, no acumulado do mandato."
      - name: perc_governismo_legislatura
        description: "Percentual de alinhamento ao governo no acumulado do mandato, inteiro."
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: fct_radarcongresso_governismo_trimestre
    description: >
      Governismo do Radar Congresso resolvido para o id oficial do parlamentar, por trimestre.
      Grain: um registro por parlamentar por trimestre.
    columns:
      - name: casa
        description: "Casa legislativa (CAMARA ou SENADO), derivada da tabela de origem."
      - name: radar_parlamentar_id_nk
        description: "Identificador do parlamentar no Radar Congresso (idparlamentarvoz). Join com dim_parlamentares via radar_deputado_id_fk/radar_senador_id_fk."
      - name: deputado_id_fk
        description: "Chave natural do deputado na fonte da Câmara, resolvida via dim_parlamentares. Nulo para senadores."
      - name: senador_id_fk
        description: "Chave natural do senador na fonte do Senado, resolvida via dim_parlamentares. Nulo para deputados."
      - name: perc_governismo_trimestre
        description: "Percentual de alinhamento ao governo no trimestre, inteiro. Nulo quando o parlamentar não votou em votação orientada no período."
      - name: data_trimestre
        description: "Marcador do trimestre de referência: o dia seguinte ao fim do trimestre medido, exceto o primeiro, que vem como 2023-03-31."
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."
