        description: "Categoria do registro, com AUSENCIA INFERIDA para o deputado sem registro no período de exercício."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['VOTOU', 'VOTO SECRETO', 'PRESENTE SEM VOTO', 'PRESIDENCIA', 'AUSENCIA JUSTIFICADA', 'AUSENCIA NAO JUSTIFICADA', 'AUSENCIA INFERIDA', 'NAO INFORMADO']
      - name: fl_presente
        description: "1 quando o parlamentar esteve presente, 0 quando ausente; nulo quando a origem não informa."
        tests:
