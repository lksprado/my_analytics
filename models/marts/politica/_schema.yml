  - name: fct_votos_flags_de_alinhamento
    description: >
      As flags de "seguiu" só existem para voto SIM, NÃO ou OBSTRUÇÃO em votação com orientação SIM,
      NÃO ou OBSTRUÇÃO; LIBERADO não conta como orientação. O partido casa com a orientação pela
      entidade, não pela sigla (PR orienta o PL). O cabeçalho empresta sk_proposicao e a
      orientação do governo. Parlamentar fora da dimensão vai para null_key em vez de sumir.
    model: fct_votos
    given:
      - input: ref('int_votos_unificados')
        rows:
          - {casa: CAMARA, parlamentar_id_nk: 1, votacao_id_nk: '1-1', partido: PT, partido_id_senado: 71, codigo_voto: SIM, voto: SIM}
          - {casa: CAMARA, parlamentar_id_nk: 2, votacao_id_nk: '1-1', partido: PL, partido_id_senado: 523, codigo_voto: NAO, voto: NAO}
          - {casa: CAMARA, parlamentar_id_nk: 3, votacao_id_nk: '1-1', partido: PT, partido_id_senado: 71, codigo_voto: ABSTENCAO, voto: ABSTENCAO}
