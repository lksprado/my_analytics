version: 2

models:

  - name: int_deputados_padronizados
    description: "Deputados. Grão: um deputado."
    columns:
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: parlamentar_id_nk
        description: "Id do deputado na Câmara."
        tests:
          - not_null
          - unique
      - name: radar_parlamentar_id_fk
        description: "Id do parlamentar no Radar Congresso."
      - name: nome
        description: "Nome parlamentar."
      - name: nome_completo
        description: "Nome civil completo."
      - name: sexo
        description: "Sexo expandido (MASCULINO/FEMININO)."
      - name: uf
        description: "UF de representação no mandato mais recente."
      - name: data_nascimento
        description: "Data de nascimento."
      - name: escolaridade
        description: "Escolaridade."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: int_senadores_padronizados
    description: "Senadores. Grão: um senador."
    columns:
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: parlamentar_id_nk
        description: "Id do senador no Senado."
        tests:
          - not_null
          - unique
      - name: radar_parlamentar_id_fk
        description: "Id do parlamentar no Radar Congresso."
      - name: nome
        description: "Nome parlamentar."
      - name: nome_completo
        description: "Nome completo do senador."
      - name: sexo
        description: "Sexo conforme cadastro do Senado."
      - name: uf
        description: "UF de representação."
      - name: data_nascimento
        description: "Sempre nula: a extração do Senado não traz nascimento."
      - name: escolaridade
        description: "Sempre nula: a extração do Senado não traz escolaridade."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."
