version: 2

models:

  - name: int_votos_camara_filtrados
    description: "Votos individuais de deputados normalizados (BRANCO → NULL, FAVORAVEL COM RESTRICOES → SIM) com chaves substitutas geradas. Alimenta fct_votos."
    columns:
      - name: sk_voto
        description: Chave substituta do voto (deputado_id_nk + votacao_id_fk + casa).
        tests:
          - not_null
          - unique
      - name: sk_parlamentar
        description: Chave substituta do parlamentar (deputado_id_nk + casa).
        tests:
          - not_null
      - name: sk_votacao
        description: Chave substituta da votação, compatível com int_votacoes_camara_deduplicadas.
        tests:
          - not_null
      - name: casa
        description: Casa legislativa (CAMARA).
      - name: deputado_id_nk
        description: Chave natural do deputado na API da Câmara.
      - name: votacao_id_nk
        description: Chave natural da votação.
      - name: partido
        description: "Sigla do partido vigente no momento do voto (ponto-no-tempo, da seed seed_partidos via partido_id_fk)."
      - name: partido_nome
        description: "Nome do partido resolvido por partido_id_fk = seed_partidos.id_camara."
      - name: voto
        description: "Voto registrado (SIM, NAO, ABSTENCAO, OBSTRUCAO). BRANCO e FAVORAVEL COM RESTRICOES normalizados."

  - name: int_votacoes_camara_deduplicadas
    description: "Sessões de votação da Câmara com chave substituta gerada. Alimenta dim_votacoes."
    columns:
      - name: sk_votacao
        description: Chave substituta da votação (votacao_id_nk + casa).
        tests:
          - not_null
          - unique:
              config:
                severity: warn
      - name: casa
        description: Casa legislativa (CAMARA).
      - name: votacao_id_nk
        description: Chave natural da votação na API da Câmara.
      - name: data_votacao
        description: Data em que a votação ocorreu.
      - name: sigla_orgao
        description: Sigla do órgão que realizou a votação (ex. PLEN, CSPCCO).
      - name: sk_proposicao
        description: Chave substituta da proposição objeto da votação.
      - name: aprovado
        description: Booleano indicando se a proposição foi aprovada.
      - name: sk_data
        description: Chave substituta de data (YYYYMMDD) da votação.

  - name: int_orientacoes_camara_corrigidas
    description: "Orientações de voto por partido/liderança por sessão de votação da Câmara. Alimenta dim_orientacao_votacoes."
    columns:
      - name: sk_votacao
        description: Chave substituta da votação (votacao_id_nk + casa).
        tests:
          - not_null
      - name: votacao_id_nk
        description: Chave natural da votação à qual a orientação se refere.
      - name: casa
        description: Casa legislativa (CAMARA).
      - name: orientacao_voto
        description: Orientação de voto dada pelo líder (SIM, NÃO, OBSTRUÇÃO).
      - name: tipo_lideranca
        description: Tipo de liderança que deu a orientação (BANCADA ou PARTIDO).
      - name: sigla_partido_bloco
        description: Sigla do partido ou bloco que recebeu a orientação (normalizada).

  - name: int_votos_senado_filtrados
    description: "Votos individuais de senadores normalizados com chaves substitutas geradas. Alimenta fct_votos."
    columns:
      - name: sk_voto
        description: Chave substituta do voto (senador_id_nk + codigo_votacao + casa).
        tests:
          - not_null
          - unique
      - name: sk_parlamentar
        description: Chave substituta do parlamentar (senador_id_nk + casa).
        tests:
          - not_null
      - name: sk_votacao
        description: Chave substituta da votação, compatível com int_votacoes_senado_filtradas.
        tests:
          - not_null
      - name: casa
        description: Casa legislativa (SENADO).
      - name: senador_id_nk
        description: Chave natural do senador na API do Senado.
      - name: votacao_id_nk
        description: Chave natural da votação na API do Senado.
      - name: partido
        description: "Sigla do partido vigente no momento do voto (ponto-no-tempo, normalizada)."
      - name: partido_nome
        description: "Nome do partido resolvido por sigla normalizada + período de vigência na seed seed_partidos; 'desconhecido' quando não há partido (ex. SEM REGISTRO)."
      - name: data_sessao
        description: Data da sessão de votação.
      - name: identificacao
        description: Descrição ou identificação da matéria votada.
      - name: voto
        description: "Voto registrado (SIM, NAO, ABSTENCAO, OBSTRUCAO)."
      - name: sk_data
        description: Chave substituta de data (YYYYMMDD) da sessão de votação.

  - name: int_votacoes_senado_filtradas
    description: "Sessões de votação do Senado com chave substituta gerada. Alimenta dim_votacoes."
    columns:
      - name: sk_votacao
        description: Chave substituta da votação (codigo_votacao + casa).
        tests:
          - not_null
          - unique:
              config:
                severity: warn
      - name: casa
        description: Casa legislativa (SENADO).
      - name: votacao_id_nk
        description: Chave natural da votação na API do Senado.
      - name: sk_proposicao
        description: Chave substituta da proposição objeto da votação.
      - name: data_votacao
        description: Data da sessão de votação.
      - name: identificacao
        description: Descrição da matéria votada.
      - name: aprovado
        description: 1 se aprovado, 0 caso contrário.
      - name: sk_data
        description: Chave substituta de data (YYYYMMDD) da votação.

  - name: int_orientacoes_senado_filtradas
    description: "Orientações de voto por partido/bancada por sessão de votação do Senado. Alimenta dim_orientacao_votacoes."
    columns:
      - name: sk_votacao
        description: Chave substituta da votação (codigo_votacao + casa).
        tests:
          - not_null
      - name: casa
        description: Casa legislativa (SENADO).
      - name: codigo_votacao
        description: Código da votação na API do Senado.
      - name: numero_materia
        description: Número da matéria votada.
      - name: sigla_tipo_materia
        description: Sigla do tipo de matéria (PL, PEC, etc.).
      - name: partido
        description: Sigla do partido que recebeu a orientação.
      - name: orientacao_voto
        description: Orientação de voto (SIM, NAO, OBSTRUCAO — LIBERADO já filtrado).

  - name: int_proposicoes_unificadas
    description: "Proposições unificadas (UNION de Câmara e Senado) com tipo padronizado e chave substituta gerada. Alimenta dim_proposicoes."
    columns:
      - name: sk_proposicao
        description: Chave substituta da proposição (casa + id).
        tests:
          - not_null
          - unique
      - name: casa
        description: Casa legislativa de origem da proposição (CAMARA ou SENADO).
      - name: proposicao_id_nk
        description: Chave natural da proposição na casa de origem.
      - name: tipo_proposicao
        description: Tipo da proposição padronizado em maiúsculas (ex. PL, PEC).
      - name: data_proposicao
        description: Data de apresentação da proposição.
      - name: sk_data
        description: Chave substituta de data (YYYYMMDD) da apresentação da proposição.
