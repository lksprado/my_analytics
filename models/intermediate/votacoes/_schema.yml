version: 2

models:

  - name: int_votos_camara_normalizados
    description: "Registros de voto de deputados no grão de um por parlamentar por votação, com todos os códigos da origem (a posição sai de seed_tipos_voto em int_votos_unificados) e o partido do momento do voto."
    columns:
      - name: casa
        description: Casa legislativa (CAMARA).
      - name: deputado_id_nk
        description: Chave natural do deputado na API da Câmara.
      - name: partido_id_fk
        description: "Chave estrangeira do partido na API da Câmara."
      - name: partido_id_senado
        description: "Entidade partidária (id_senado de seed_partidos), que agrupa rebrands e separa siglas reutilizadas."
      - name: votacao_id_fk
        description: Chave natural da votação, texto no formato da API.
      - name: partido
        description: "Sigla do partido vigente no momento do voto (ponto-no-tempo, da seed seed_partidos via partido_id_fk)."
      - name: partido_nome
        description: "Nome do partido resolvido por partido_id_fk = seed_partidos.id_camara."
      - name: codigo_voto
        description: "Tipo de voto como vem da origem (SIM, NAO, OBSTRUCAO, ABSTENCAO, ARTIGO 17...); 'NAO INFORMADO' quando vazio."
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: int_votacoes_camara_deduplicadas
    description: "Sessões de votação da Câmara no grão de uma linha por votação. Alimenta int_votacoes_unificadas."
    columns:
      - name: casa
        description: Casa legislativa (CAMARA).
      - name: votacao_id_nk
        description: Chave natural da votação na API da Câmara.
      - name: data_votacao
        description: Data em que a votação ocorreu.
      - name: sigla_orgao
        description: Sigla do órgão que realizou a votação (ex. PLEN, CSPCCO).
      - name: descricao
        description: Descrição da votação (texto da Câmara, maiúsculo e sem acento), com o resultado e às vezes o placar.
      - name: proposicao_id_fk
        description: "Chave estrangeira da proposição objeto da votação na API da Câmara."
      - name: aprovado
        description: Booleano indicando se a proposição foi aprovada.
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: int_orientacoes_camara_corrigidas
    description: "Orientações de voto por partido/liderança por sessão de votação da Câmara, inclusive LIBERADO. Alimenta int_orientacoes_unificadas."
    columns:
      - name: votacao_id_fk
        description: Chave natural da votação à qual a orientação se refere.
      - name: casa
        description: Casa legislativa (CAMARA).
      - name: orientacao_voto
        description: Orientação de voto dada pelo líder (SIM, NAO, OBSTRUCAO, LIBERADO, ABSTENCAO).
      - name: tipo_lideranca
        description: Tipo de liderança que deu a orientação (BANCADA ou PARTIDO).
      - name: sigla_partido_bloco
        description: Sigla do partido ou bloco que recebeu a orientação (normalizada).
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: int_votos_senado_normalizados
    description: "Registros de voto de senadores no grão de um por parlamentar por votação, com todos os códigos da origem (inclusive voto secreto, presença sem voto e ausências) e o partido do momento do voto."
    columns:
      - name: casa
        description: Casa legislativa (SENADO).
      - name: senador_id_nk
        description: Chave natural do senador na API do Senado.
      - name: votacao_id_fk
        description: Chave natural da votação na API do Senado.
      - name: partido_id_senado
        description: "Entidade partidária (id_senado de seed_partidos), que agrupa rebrands e separa siglas reutilizadas."
      - name: partido
        description: "Sigla do partido vigente no momento do voto (ponto-no-tempo, normalizada)."
      - name: partido_nome
        description: "Nome do partido resolvido por sigla normalizada + período de vigência na seed seed_partidos; 'desconhecido' quando não há partido (ex. SEM REGISTRO)."
      - name: data_votacao
        description: Data da sessão de votação.
      - name: identificacao
        description: Descrição ou identificação da matéria votada.
      - name: codigo_voto
        description: "Sigla do voto como vem da origem (SIM, NAO, VOTOU, P-NRV, AP, NCOM...); 'NAO INFORMADO' quando vazio."
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: int_votacoes_senado_filtradas
    description: "Sessões de votação do Senado no grão de uma linha por votação. Alimenta int_votacoes_unificadas."
    columns:
      - name: casa
        description: Casa legislativa (SENADO).
      - name: votacao_id_nk
        description: Chave natural da votação na API do Senado.
      - name: processo_id_nk
        description: "Chave natural do processo legislativo associado à votação."
      - name: data_votacao
        description: Data da sessão de votação.
      - name: identificacao
        description: Descrição da matéria votada.
      - name: descricao
        description: Descrição da votação, maiúscula e sem acento.
      - name: fl_secreta
        description: 1 quando a votação foi secreta.
      - name: aprovado
        description: 1 se aprovado, 0 caso contrário.
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: int_orientacoes_senado_filtradas
    description: "Orientações de voto por partido/bancada por sessão de votação do Senado, inclusive LIBERADO, com a votação resolvida pela matéria no dia. Alimenta int_orientacoes_unificadas."
    columns:
      - name: casa
        description: Casa legislativa (SENADO).
      - name: votacao_id_fk
        description: >
          Votação resolvida (codigo_sessao_votacao) pela matéria no dia — data, sigla e número —, com
          desempate pelo placar SIM/NÃO dos votos. Nula quando não há candidata, há empate, o placar
          diverge ou outra orientação já caiu na mesma votação.
      - name: votacao_origem_id
        description: Código da votação no endpoint de orientação (codigovotacaosve), outro espaço de chave que o das votações.
      - name: data_votacao
        description: Data da votação orientada.
      - name: numero_materia
        description: Número da matéria votada.
      - name: sigla_tipo_materia
        description: Sigla do tipo de matéria (PL, PEC, etc.).
      - name: partido
        description: Sigla do partido que recebeu a orientação.
      - name: orientacao_voto
        description: Orientação de voto (SIM, NAO, OBSTRUCAO, LIBERADO).
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: int_proposicoes_unificadas
    description: "Proposições unificadas (UNION de Câmara e Senado) com tipo padronizado, no grão de uma linha por (casa, proposição). dim_proposicoes gera as chaves substitutas."
    columns:
      - name: casa
        description: Casa legislativa de origem da proposição (CAMARA ou SENADO).
      - name: proposicao_id_nk
        description: Chave natural da proposição na casa de origem.
      - name: tipo_proposicao
        description: Tipo da proposição padronizado em maiúsculas (ex. PL, PEC).
      - name: data_proposicao
        description: Data de apresentação da proposição.
      - name: identificacao
        description: "Identificação legível (sigla número/ano, ex.: PL 1234/2023)."
      - name: ementa
        description: Ementa da proposição; só a Câmara traz.
      - name: situacao_atual
        description: Situação atual de tramitação (foto da última carga, não histórico).
      - name: regime
        description: Regime de tramitação atual (urgência, prioridade...); só a Câmara traz.
      - name: autoria
        description: Autoria da proposição; só o Senado traz.
      - name: norma_gerada
        description: Norma gerada quando a proposição foi transformada em lei; só o Senado traz.
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - proposicao_id_nk

  - name: int_votos_unificados
    description: "Registros de voto das duas casas no grão de um por parlamentar por votação, com a posição e a categoria de seed_tipos_voto. Alimenta o placar de fct_votacoes e as linhas de fct_votos."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - parlamentar_id_nk
              - votacao_id_nk
    columns:
      - name: casa
        description: Casa legislativa (CAMARA ou SENADO).
      - name: parlamentar_id_nk
        description: Chave natural do parlamentar na casa (deputado_id_nk ou senador_id_nk).
      - name: votacao_id_nk
        description: Chave natural da votação na casa, como texto.
      - name: partido_id_senado
        description: "Entidade partidária (id_senado de seed_partidos)."
      - name: partido
        description: Sigla do partido no momento do voto.
      - name: partido_nome
        description: Nome do partido no momento do voto.
      - name: codigo_voto
        description: Código do voto como vem da origem.
      - name: voto
        description: "Posição normalizada (SIM, NAO, OBSTRUCAO, ABSTENCAO, BRANCO); nula quando o registro não é voto."
      - name: categoria
        description: Categoria do registro em seed_tipos_voto (VOTOU, VOTO SECRETO, PRESENTE SEM VOTO, PRESIDENCIA, AUSENCIA...).
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: int_votacoes_unificadas
    description: "Votações das duas casas no grão de uma por votação, com órgão, descrição e sigilo. fct_votacoes gera as chaves e o placar."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - votacao_id_nk
    columns:
      - name: casa
        description: Casa legislativa (CAMARA ou SENADO).
      - name: votacao_id_nk
        description: Chave natural da votação na casa, como texto.
      - name: data_votacao
        description: Data da votação.
      - name: sigla_orgao
        description: Sigla do órgão que votou; a extração do Senado só tem Plenário (PLEN).
      - name: descricao
        description: Descrição da votação, maiúscula e sem acento.
      - name: proposicao_id_nk
        description: Chave natural da proposição objeto (proposição da Câmara ou processo do Senado); nula quando não declarada.
      - name: aprovado
        description: 1 se aprovada, 0 caso contrário.
      - name: fl_secreta
        description: 1 quando a votação foi secreta (só no Senado).
      - name: classe_votacao
        description: >
          Classe da votação pelo objeto na descrição: MERITO, EMENDA/DESTAQUE, URGENCIA, REQUERIMENTO
          PROCEDIMENTAL, PARECER, AUTORIDADE ou OUTROS. Heurística por texto; o teste
          assert_classe_votacao_cobre_nominais exige reconhecer ao menos 85% das nominais de cada casa.
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: int_orientacoes_unificadas
    description: "Orientações de voto das lideranças das duas casas no grão de uma por liderança por votação, inclusive LIBERADO. Alimenta fct_orientacoes e as flags de alinhamento de fct_votos."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - votacao_origem_id
              - sigla_lideranca
      # Garante que a orientação partidária não multiplica os votos em fct_votos.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - votacao_id_nk
              - partido_id_senado
          config:
            where: "votacao_id_nk IS NOT NULL AND partido_id_senado IS NOT NULL"
    columns:
      - name: casa
        description: Casa legislativa (CAMARA ou SENADO).
      - name: votacao_id_nk
        description: Chave da votação na casa, em texto; no Senado é a votação resolvida pela matéria, nula quando a orientação ficou sem par.
      - name: votacao_origem_id
        description: Chave da votação como vem da origem da orientação (na Câmara, a mesma de votacao_id_nk).
      - name: data_votacao
        description: Data da votação; na Câmara vem da própria votação, no Senado da orientação.
      - name: tipo_lideranca
        description: "Tipo de liderança (BANCADA ou PARTIDO); 'desconhecido' no Senado."
      - name: sigla_lideranca
        description: Sigla do partido, bloco ou liderança (GOVERNO, MAIORIA...).
      - name: orientacao_voto
        description: Orientação emitida (SIM, NAO, OBSTRUCAO, LIBERADO, ABSTENCAO).
      - name: partido_id_senado
        description: >
          Entidade partidária da liderança (id_senado de seed_partidos), resolvida pela sigla na data
          da votação via int_partidos_siglas. Nula para Governo, blocos, federações e lideranças.
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

  - name: int_partidos_siglas
    description: >
      Toda sigla conhecida de cada entidade partidária (sigla da Câmara, do Senado, conformada e os
      apelidos de seed_partidos_siglas), com a vigência da entidade. Resolve sigla + data para a
      entidade: PL e PSD foram reutilizadas por partidos diferentes, então a data decide.
    columns:
      - name: sigla
        description: Sigla normalizada (maiúscula, sem acento).
      - name: partido_id_senado
        description: Entidade partidária (id_senado de seed_partidos).
      - name: inicio
        description: Início da vigência da entidade.
      - name: fim
        description: Fim da vigência da entidade (9999-12-31 quando ativa).
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

unit_tests:

  - name: int_votacoes_unificadas_classe_votacao
    description: >
      A classe sai do objeto da votação na descrição: requerimento (de urgência ou procedimental),
      parecer e pressupostos, emenda e destaque (inclusive "mantido o texto" e artigo do
      substitutivo), mérito (projeto, PEC, MP, redação final, texto-base ressalvados os destaques),
      escolha de autoridade no Senado. No Senado a descrição às vezes é a própria ementa ("MODIFICA...",
      "INSTITUI..."), e isso também é mérito. O que não se reconhece fica OUTROS.
    model: int_votacoes_unificadas
    given:
      - input: ref('int_votacoes_camara_deduplicadas')
        rows:
          - {casa: CAMARA, votacao_id_nk: c1, descricao: "APROVADO O REQUERIMENTO DE URGENCIA (ART. 155 DO RICD). SIM: 316; NAO: 86; ABSTENCAO: 1; TOTAL: 403."}
          - {casa: CAMARA, votacao_id_nk: c2, descricao: "REJEITADO O REQUERIMENTO. SIM: 7; NAO: 263; ABSTENCAO: 1; TOTAL: 271."}
          - {casa: CAMARA, votacao_id_nk: c3, descricao: "MANTIDO O TEXTO. SIM: 235; NAO: 121; ABSTENCAO: 2; TOTAL: 358."}
          - {casa: CAMARA, votacao_id_nk: c4, descricao: "REJEITADA A EMENDA DE PLENARIO Nº 18. SIM: 133; NAO: 204; TOTAL: 337."}
          - {casa: CAMARA, votacao_id_nk: c5, descricao: "REJEITADO O ARTIGO 1º DO SUBSTITUTIVO. SIM: 210; NAO: 267; ABSTENCAO: 5; TOTAL: 482."}
          - {casa: CAMARA, votacao_id_nk: c6, descricao: "APROVADA, EM SEGUNDO TURNO, A PROPOSTA DE EMENDA A CONSTITUICAO Nº 66, DE 2023, RESSALVADO O DESTAQUE. SIM: 367; NAO: 97"}
          - {casa: CAMARA, votacao_id_nk: c7, descricao: "APROVADO O PROJETO DE LEI COMPLEMENTAR Nº 459, DE 2017. SIM: 384; NAO: 59; ABSTENCAO: 1; TOTAL: 444."}
          - {casa: CAMARA, votacao_id_nk: c8, descricao: "APROVADA A REDACAO FINAL ASSINADA PELO RELATOR, DEP. BETO MANSUR (PRB-SP). SIM: 226; NAO: 180"}
          - {casa: CAMARA, votacao_id_nk: c9, descricao: "APROVADO, EM APRECIACAO PRELIMINAR, O PARECER DA COMISSAO MISTA, NA PARTE EM QUE MANIFESTA OPINIAO FAVORAVEL QUANTO AO ATENDIMENTO DOS PRESSUPOSTOS"}
          - {casa: CAMARA, votacao_id_nk: c10, descricao: "APROVADO O PROJETO DE LEI Nº 1.234, DE 2023, NOS TERMOS DO PARECER DO RELATOR. SIM: 300; NAO: 100"}
          - {casa: CAMARA, votacao_id_nk: c11, descricao: "APROVADO"}
      - input: ref('int_votacoes_senado_filtradas')
        rows:
          - {casa: SENADO, votacao_id_nk: 1, descricao: "ESCOLHA DO SR. CARLOS AUGUSTO REGO SANTOS NEVES, PARA, CUMULATIVAMENTE COM O CARGO DE EMBAIXADOR", fl_secreta: 1}
          - {casa: SENADO, votacao_id_nk: 2, descricao: "VOTACAO NOMINAL DO REQUERIMENTO Nº 1.103, DE 2023 - SOLICITA O ENCERRAMENTO DA DISCUSSAO", fl_secreta: 0}
          - {casa: SENADO, votacao_id_nk: 3, descricao: "VOTACAO QUANTO AOS PRESSUPOSTOS CONSTITUCIONAIS DE RELEVANCIA, URGENCIA E ADEQUACAO FINANCEIRA", fl_secreta: 0}
          - {casa: SENADO, votacao_id_nk: 4, descricao: "VOTACAO NOMINAL DA EMENDA Nº 1 (SUBSTITUTIVO) AO PROJETO DE LEI COMPLEMENTAR Nº 12", fl_secreta: 0}
          - {casa: SENADO, votacao_id_nk: 5, descricao: "VOTACAO NOMINAL DA PROPOSTA DE EMENDA A CONSTITUICAO Nº 48, DE 2023, NOS TERMOS DO PARECER", fl_secreta: 0}
          - {casa: SENADO, votacao_id_nk: 6, descricao: "VOTACAO NOMINAL.", fl_secreta: 0}
          - {casa: SENADO, votacao_id_nk: 7, descricao: "MODIFICA O SISTEMA DE PREVIDENCIA SOCIAL, ESTABELECE REGRAS DE TRANSICAO", fl_secreta: 0}
    expect:
      rows:
        - {votacao_id_nk: c1, classe_votacao: URGENCIA}
        - {votacao_id_nk: c2, classe_votacao: REQUERIMENTO PROCEDIMENTAL}
        - {votacao_id_nk: c3, classe_votacao: EMENDA/DESTAQUE}
        - {votacao_id_nk: c4, classe_votacao: EMENDA/DESTAQUE}
        - {votacao_id_nk: c5, classe_votacao: EMENDA/DESTAQUE}
        - {votacao_id_nk: c6, classe_votacao: MERITO}
        - {votacao_id_nk: c7, classe_votacao: MERITO}
        - {votacao_id_nk: c8, classe_votacao: MERITO}
        - {votacao_id_nk: c9, classe_votacao: PARECER}
        - {votacao_id_nk: c10, classe_votacao: MERITO}
        - {votacao_id_nk: c11, classe_votacao: OUTROS}
        - {votacao_id_nk: '1', classe_votacao: AUTORIDADE}
        - {votacao_id_nk: '2', classe_votacao: REQUERIMENTO PROCEDIMENTAL}
        - {votacao_id_nk: '3', classe_votacao: PARECER}
        - {votacao_id_nk: '4', classe_votacao: EMENDA/DESTAQUE}
        - {votacao_id_nk: '5', classe_votacao: MERITO}
        - {votacao_id_nk: '6', classe_votacao: OUTROS}
        - {votacao_id_nk: '7', classe_votacao: MERITO}

  - name: int_orientacoes_senado_filtradas_resolve_votacao
    description: >
      A chave do endpoint de orientação é outro espaço; a votação sai da matéria no dia (data, sigla,
      número). Com várias candidatas, vale a única cujo placar SIM/NÃO dos votos bate com o da
      orientação; empate, placar divergente, nenhuma candidata ou duas orientações caindo na mesma
      votação deixam a orientação sem par.
    model: int_orientacoes_senado_filtradas
    given:
      - input: ref('stg_senado_votos_orientacao')
        rows:
          - {votacao_id_fk: 13059, data_votacao: '2026-08-12', sigla_tipo_materia: PLP, numero_materia: 124, total_votos_favor: 1, total_votos_contra: 0, partido: PT, orientacao_voto: SIM}
          - {votacao_id_fk: 13059, data_votacao: '2026-08-12', sigla_tipo_materia: PLP, numero_materia: 124, total_votos_favor: 1, total_votos_contra: 0, partido: PL, orientacao_voto: NAO}
          - {votacao_id_fk: 13036, data_votacao: '2026-07-15', sigla_tipo_materia: PLP, numero_materia: 18, total_votos_favor: 2, total_votos_contra: 1, partido: GOVERNO, orientacao_voto: SIM}
