
version: 2

models:
  - name: int_books_prices
    description: >
      Preços dos livros: uma observação por livro por dia, unindo as três fontes
      de scraping. Quando as fontes divergem no mesmo dia mantém o menor preço
      anunciado. Colunas `*_ever`, `last_observed_at`, `reference_date` e
      derivadas são calculadas sobre o histórico inteiro (iguais em todas as
      linhas do livro); as demais valem para a data da linha.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - name
              - author
              - created_date
    columns:
      - name: created_date
        description: "Data da observação."
        data_tests:
          - not_null
      - name: price_new
        description: "Preço praticado na data da observação."
        data_tests:
          - not_null
      - name: observation_order
        description: "Ordem cronológica da observação dentro do livro, começando em 1."
      - name: prev_price
        description: "Preço na observação anterior do mesmo livro."
      - name: prev_observed_at
        description: "Data da observação anterior do mesmo livro."
      - name: days_since_prev_observation
        description: "Dias decorridos desde a observação anterior — expõe lacunas de coleta."
      - name: price_change
        description: "Variação absoluta em relação à observação anterior."
      - name: min_price_before
        description: "Menor preço observado para o livro antes desta linha."
      - name: is_latest_observation
        description: "True se esta é a observação mais recente do livro — filtro que dá o estado atual."
      - name: is_price_drop
        description: "True se o preço caiu em relação à observação anterior."
      - name: is_price_increase
        description: "True se o preço subiu em relação à observação anterior."
      - name: is_record_low
        description: "True se, no momento desta observação, o preço era o menor já registrado para o livro."
      - name: first_observed_at
        description: "Primeira data em que o livro foi observado."
      - name: last_observed_at
        description: "Última data em que o livro foi observado."
      - name: reference_date
        description: "Data mais recente do dataset inteiro."
      - name: days_since_last_observed
        description: "Dias entre a última observação do livro e a data mais recente do dataset."
      - name: is_stale_price
        description: "True se o livro não é observado há mais de 7 dias."
      - name: total_observations
        description: "Quantidade de dias em que o livro foi observado."
      - name: min_price_ever
        description: "Menor preço já registrado para o livro em todo o histórico."
      - name: max_price_ever
        description: "Maior preço já registrado para o livro em todo o histórico."
      - name: avg_price_ever
        description: "Preço médio do livro em todo o histórico."
      - name: price_vs_min_ever
        description: "Diferença absoluta entre o preço da linha e o mínimo histórico."
      - name: pct_above_min_ever
        description: "Quanto o preço da linha está acima do mínimo histórico, em %."
      - name: is_at_record_low
        description: "True se o preço da linha empata com o mínimo histórico — na última observação, a flag de oportunidade."
