version: 2

models:

  - name: int_deputados_pontuacao
    description: "Scores agregados do Ranking dos Políticos para deputados, com ranking renomeado e sk_parlamentar gerado. Alimenta dim_parlamentares_score."
    columns:
      - name: sk_parlamentar
        description: "Chave substituta gerada de (casa, congresso_id_fk)."
        tests:
          - not_null
          - unique
      - name: casa
        description: "Casa legislativa (constante 'CAMARA')."
      - name: ranking_id_nk
        description: "Chave natural do parlamentar no Ranking dos Políticos."
      - name: congresso_id_fk
        description: "FK do deputado na API da Câmara."
      - name: nome
        description: "Nome completo padronizado."
      - name: nome_civil
        description: "Nome civil padronizado."
      - name: partido
        description: "Sigla do partido."
      - name: situacao
        description: "Situação do mandato."
      - name: slug
        description: "Slug no Ranking dos Políticos."
      - name: pontuacao_geral
        description: "Pontuação total atual no Ranking dos Políticos."
      - name: ranking_geral
        description: "Posição no ranking geral."
      - name: ranking_casa
        description: "Posição no ranking da Câmara."
      - name: ranking_partido
        description: "Posição no ranking do partido."
      - name: ranking_estado
        description: "Posição no ranking do estado."
      - name: ranking_casa_estado
        description: "Posição no ranking da Câmara por estado."
      - name: uf
        description: "UF de representação (normalizada para sigla)."
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."

