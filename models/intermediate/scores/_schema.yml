version: 2

models:

  - name: int_parlamentares_pontuacao
    description: "Pontuação atual no Ranking dos Políticos. Grão: um parlamentar."
    columns:
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CAMARA', 'SENADO']
      - name: ranking_id_nk
        description: "Chave natural do parlamentar no Ranking dos Políticos."
      - name: congresso_id_fk
        description: "Id do parlamentar na casa."
        tests:
          - not_null
      - name: nome
        description: "Nome parlamentar."
      - name: nome_civil
        description: "Nome civil padronizado."
      - name: partido
        description: "Sigla do partido."
      - name: situacao
        description: "Situação do mandato."
      - name: slug
        description: "Slug no Ranking dos Políticos."
      - name: uf
        description: "UF de representação."
      - name: composicao_pontuacao_anos
        description: "Histórico anual de pontuação (JSON)."
      - name: pontuacao_geral
        description: "Pontuação total atual no Ranking dos Políticos."
      - name: ranking_geral
        description: "Posição no ranking geral."
      - name: ranking_casa
        description: "Posição no ranking da própria casa."
      - name: ranking_partido
        description: "Posição no ranking do partido."
      - name: ranking_estado
        description: "Posição no ranking do estado."
      - name: ranking_casa_estado
        description: "Posição no ranking da casa por estado."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - congresso_id_fk

  - name: int_parlamentares_pontuacao_explodida
    description: "Pontuação anual no Ranking dos Políticos. Grão: parlamentar × ano."
    columns:
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CAMARA', 'SENADO']
      - name: ranking_id_nk
        description: "Chave natural do parlamentar no Ranking dos Políticos."
      - name: congresso_id_fk
        description: "Id do parlamentar na casa."
        tests:
          - not_null
      - name: nome
        description: "Nome parlamentar."
      - name: nome_civil
        description: "Nome civil padronizado."
      - name: partido
        description: "Sigla do partido."
      - name: situacao
        description: "Situação do mandato."
      - name: uf
        description: "UF de representação."
      - name: slug
        description: "Slug no Ranking dos Políticos."
      - name: pontuacao_geral
        description: "Pontuação total atual."
      - name: ranking_geral
        description: "Posição no ranking geral."
      - name: ranking_casa
        description: "Posição no ranking da própria casa."
      - name: ranking_partido
        description: "Posição no ranking do partido."
      - name: ranking_estado
        description: "Posição no ranking do estado."
      - name: ranking_casa_estado
        description: "Posição no ranking da casa por estado."
      - name: ano
        description: "Ano de referência do score explodido."
        tests:
          - not_null
      - name: nota_base_votacoes
        description: "Nota base referente a votações naquele ano."
      - name: nota_base_gastos
        description: "Nota base referente a controle de gastos naquele ano."
      - name: nota_base_presenca
        description: "Nota base referente a presença/assiduidade naquele ano."
      - name: nota_base_privilegios
        description: "Nota base referente à rejeição de privilégios naquele ano."
      - name: bonus_processos
        description: "Bônus/penalidade por processos judiciais."
      - name: bonus_producao_legislativa
        description: "Bônus por produção legislativa."
      - name: bonus_articulacao_legislativa
        description: "Bônus por articulação legislativa."
      - name: pontuacao
        description: "Pontuação final do parlamentar naquele ano."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - congresso_id_fk
              - ano

  - name: int_indicadores_radar_versoes
    description: "Versões do governismo publicado pelo Radar Congresso, em formato longo. Grão: indicador × parlamentar × período × coleta."
    columns:
      - name: fonte
        description: "Fonte que publica o indicador."
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: parlamentar_fonte_id_nk
        description: "Id do parlamentar na fonte externa."
      - name: indicador
        description: "Nome do indicador."
      - name: periodo_tipo
        description: "Tipo do período de referência."
      - name: periodo_inicio
        description: "Primeiro dia do período de referência."
      - name: periodo_fim
        description: "Último dia do período de referência."
      - name: valor_original
        description: "Valor publicado pela fonte, sem alteração."
      - name: qt_base
        description: "Quantidade de votações que a fonte informa como base do valor."
      - name: data_coleta
        description: "Data em que esta versão do valor foi coletada."
      - name: data_fim_vigencia
        description: "Data em que esta versão deixou de ser a publicada; nula quando vigente."
      - name: parlamentar_casa_id
        description: "Id do parlamentar na casa, quando a fonte o informa."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: int_indicadores_ranking_versoes
    description: "Versões dos indicadores do Ranking dos Políticos, em formato longo. Grão: indicador × parlamentar × período × coleta."
    columns:
      - name: fonte
        description: "Fonte que publica o indicador."
      - name: casa
        description: "Casa legislativa (CAMARA, SENADO)."
      - name: parlamentar_fonte_id_nk
        description: "Id do parlamentar na fonte externa."
      - name: indicador
        description: "Nome do indicador."
      - name: periodo_tipo
        description: "Tipo do período de referência."
      - name: periodo_inicio
        description: "Primeiro dia do período de referência."
      - name: periodo_fim
        description: "Último dia do período de referência."
      - name: valor_original
        description: "Valor publicado pela fonte, sem alteração."
      - name: qt_base
        description: "Quantidade de votações que a fonte informa como base do valor."
      - name: data_coleta
        description: "Data em que esta versão do valor foi coletada."
      - name: data_fim_vigencia
        description: "Data em que esta versão deixou de ser a publicada; nula quando vigente."
      - name: parlamentar_casa_id
        description: "Id do parlamentar na casa, quando a fonte o informa."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."
