version: 2

models:

  - name: int_parlamentares_pontuacao
    description: "Scores agregados do Ranking dos Políticos para deputados e senadores, com ranking renomeado e UF reduzida à sigla. Uma linha por parlamentar. Alimenta fct_ranking_politicos, que é quem gera a sk_parlamentar."
    columns:
      - name: casa
        description: "Casa legislativa do parlamentar (CAMARA ou SENADO)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CAMARA', 'SENADO']
      - name: ranking_id_nk
        description: "Chave natural do parlamentar no Ranking dos Políticos."
      - name: congresso_id_fk
        description: "FK do parlamentar na API da sua casa de origem. Com casa, forma a chave que a marts usa para gerar a sk_parlamentar."
        tests:
          - not_null
      - name: nome
        description: "Nome completo padronizado."
      - name: nome_civil
        description: "Nome civil padronizado."
      - name: partido
        description: "Sigla do partido."
      - name: situacao
        description: "Situação do mandato."
      - name: slug
        description: "Slug no Ranking dos Políticos."
      - name: uf
        description: "UF de representação, reduzida à sigla pela macro uf_sigla."
      - name: composicao_pontuacao_anos
        description: "Histórico anual de pontuação em formato semi-estruturado. Explodido em int_parlamentares_pontuacao_explodida."
      - name: pontuacao_geral
        description: "Pontuação total atual no Ranking dos Políticos."
      - name: ranking_geral
        description: "Posição no ranking geral."
      - name: ranking_casa
        description: "Posição no ranking da própria casa."
      - name: ranking_partido
        description: "Posição no ranking do partido."
      - name: ranking_estado
        description: "Posição no ranking do estado."
      - name: ranking_casa_estado
        description: "Posição no ranking da casa por estado."
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - congresso_id_fk

  - name: int_parlamentares_pontuacao_explodida
    description: "Scores explodidos por ano a partir do histórico semi-estruturado de int_parlamentares_pontuacao. Uma linha por parlamentar por ano. Alimenta fct_ranking_politicos_anual, que é quem gera a sk_parlamentar."
    columns:
      - name: casa
        description: "Casa legislativa do parlamentar (CAMARA ou SENADO)."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['CAMARA', 'SENADO']
      - name: ranking_id_nk
        description: "Chave natural do parlamentar no Ranking dos Políticos."
      - name: congresso_id_fk
        description: "FK do parlamentar na API da sua casa de origem. Com casa, forma a chave que a marts usa para gerar a sk_parlamentar."
        tests:
          - not_null
      - name: nome
        description: "Nome completo padronizado."
      - name: nome_civil
        description: "Nome civil padronizado."
      - name: partido
        description: "Sigla do partido."
      - name: situacao
        description: "Situação do mandato."
      - name: uf
        description: "UF de representação, reduzida à sigla pela macro uf_sigla."
      - name: slug
        description: "Slug no Ranking dos Políticos."
      - name: pontuacao_geral
        description: "Pontuação total atual."
      - name: ranking_geral
        description: "Posição no ranking geral."
      - name: ranking_casa
        description: "Posição no ranking da própria casa."
      - name: ranking_partido
        description: "Posição no ranking do partido."
      - name: ranking_estado
        description: "Posição no ranking do estado."
      - name: ranking_casa_estado
        description: "Posição no ranking da casa por estado."
      - name: ano
        description: "Ano de referência do score explodido."
        tests:
          - not_null
      - name: nota_base_votacoes
        description: "Nota base referente a votações naquele ano."
      - name: nota_base_gastos
        description: "Nota base referente a controle de gastos naquele ano."
      - name: nota_base_presenca
        description: "Nota base referente a presença/assiduidade naquele ano."
      - name: nota_base_privilegios
        description: "Nota base referente à rejeição de privilégios naquele ano."
      - name: bonus_processos
        description: "Bônus/penalidade por processos judiciais."
      - name: bonus_producao_legislativa
        description: "Bônus por produção legislativa."
      - name: bonus_articulacao_legislativa
        description: "Bônus por articulação legislativa."
      - name: pontuacao
        description: "Pontuação final do parlamentar naquele ano."
      - name: model_run_at
        description: "Data/hora de início do `dbt run` que materializou este modelo (com fuso). Igual em todas as linhas; nas views, corresponde à última vez que o dbt recriou a view. Serve para auditar a atualidade dos dados."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - casa
              - congresso_id_fk
              - ano
