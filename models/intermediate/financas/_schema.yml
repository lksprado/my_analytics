  - name: int_investimentos_faltantes_unificados
    description: >
      Trilha seed: posições reais que nenhum relatório traz, cadastradas à mão nas seeds de
      investimentos faltantes de cada titular.
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base da posição."
      - name: pessoa
        description: "Titular (deusa, jessica ou lucas)."
      - name: instituicao
        description: "Corretora, banco ou custodiante da posição, com nome padronizado."
      - name: emissor
        description: "Instituição emissora do título."
      - name: classe_ativo
        description: "Classe do ativo (RENDA FIXA, RENDA VARIAVEL ou DISPONIBILIDADE)."
      - name: tipo_ativo
        description: "Tipo do ativo (ACAO, FUNDO, TITULO PUBLICO, TITULO PRIVADO ou CONTA CORRENTE)."
      - name: codigo_ativo
        description: "Código do ativo na fonte (ticker B3, ISIN do tesouro, CUSIP da Avenue ou código da seed)."
      - name: ativo
        description: "Nome do ativo."
      - name: indexador
        description: "Indexador de rentabilidade do título."
      - name: data_emissao
        description: "Data de emissão do título."
      - name: data_vencimento
        description: "Data de vencimento do título."
      - name: vencimento_em_dias
        description: "Dias restantes até o vencimento; nulo se já vencido ou sem vencimento."
      - name: fl_vencido
        description: "Indica se o título já venceu."
      - name: vlr_atualizado_brl
        description: "Valor atualizado da posição, em reais."
      - name: moeda_ativo
        description: "Moeda de origem do ativo."
      - name: fonte_dado
        description: "Procedência da linha (SEED). {{ doc('fonte_dado') }}"
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: int_planilha_investimentos_selecionados
    description: >
      Saldos de investimento declarados na planilha do casal e na de Deusa, uma linha por mês e uma
      coluna por pessoa e instituição.
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base."
      - name: bradesco_investimentos_lucas
        description: "Saldo em investimentos Bradesco (Lucas), em reais."
      - name: nubank_investimentos_lucas
        description: "Saldo em investimentos Nubank (Lucas), em reais."
      - name: avenue_lucas
        description: "Saldo na Avenue (Lucas), em reais."
      - name: daycoval_lucas
        description: "Saldo em investimentos Daycoval (Lucas), em reais."
      - name: sofisa_investimentos_jessica
        description: "Saldo em investimentos Sofisa (Jéssica), em reais."
      - name: itau_investimentos_jessica
        description: "Saldo em investimentos Itaú (Jéssica), em reais."
      - name: nubank_investimentos_jessica
        description: "Saldo em investimentos Nubank (Jéssica), em reais."
      - name: avenue_jessica
        description: "Saldo na Avenue (Jéssica), em reais."
      - name: bradesco_investimentos_deusa
        description: "Saldo em investimentos Bradesco (Deusa), em reais."
      - name: banco_brasil_investimentos_deusa
        description: "Saldo em investimentos Banco do Brasil (Deusa), em reais."
      - name: nubank_investimentos_deusa
        description: "Saldo em investimentos Nubank (Deusa), em reais."
      - name: avenue_deusa
        description: "Saldo na Avenue (Deusa), em reais."
      - name: fonte_dado
        description: "Procedência da linha (GOOGLE SHEETS)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: int_planilha_investimentos_selecionados_alongados
    description: >
      Saldos de investimento declarados na planilha do casal e na de Deusa, uma linha por mês, pessoa e instituição.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mes_base
              - pessoa
              - instituicao
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base da posição."
      - name: pessoa
        description: "Titular (deusa, jessica ou lucas)."
      - name: instituicao
        description: "Corretora, banco ou custodiante da posição, com nome padronizado."
      - name: vlr_declarado_brl
        description: "Saldo declarado na planilha, em reais."
      - name: fonte_dado
        description: "Procedência da linha (GOOGLE SHEETS)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."


  - name: int_dividendos
    description: >
      A renda passiva recebida por Lucas, Jéssica e Deusa mês a mês: proventos da B3, exceto juros,
      e dividendos da Avenue.
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base do recebimento."
      - name: pessoa
        description: "Titular (deusa, jessica ou lucas)."
      - name: instituicao
        description: "Corretora, banco ou custodiante da posição, com nome padronizado."
      - name: vlr_liquido_brl
        description: "Valor líquido recebido no mês, em reais."
      - name: moeda_ativo
        description: "Moeda de origem do ativo."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: int_indexadores
    description: >
      Os indexadores macroeconômicos mensais que servem de referência de comparação para o
      patrimônio: inflação pessoal, IPCA, IGP-M, Selic e CDI, na taxa do mês e no índice acumulado.
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base de referência."
      - name: minha_inflacao
        description: "Inflação pessoal do mês, em fração decimal."
      - name: ipca
        description: "IPCA do mês, em fração decimal."
      - name: igpm
        description: "IGP-M do mês, em fração decimal."
      - name: selic
        description: "Taxa Selic do mês, em fração decimal."
      - name: cdi
        description: "CDI do mês, em fração decimal."
      - name: minha_inflacao_acum
        description: "Índice acumulado (base 1) da inflação pessoal."
      - name: ipca_acum
        description: "Índice acumulado (base 1) do IPCA."
      - name: igpm_acum
        description: "Índice acumulado (base 1) do IGP-M."
      - name: selic_acum
        description: "Índice acumulado (base 1) da Selic."
      - name: cdi_acum
        description: "Índice acumulado (base 1) do CDI."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: int_consumo_consolidado
    description: >
      Cada despesa lançada por Lucas e Jéssica, no dia em que aconteceu, com o valor distribuído
      pelas colunas de categoria.
      {{ doc('ciclo_fatura') }}
    columns:
      - name: mes_fatura
        description: "Primeiro dia do mês da fatura de referência."
      - name: mes_debito
        description: "Primeiro dia do mês de débito/competência."
      - name: pessoa
        description: "Titular (deusa, jessica ou lucas)."
      - name: data_debito
        description: "Data do lançamento da despesa."
      - name: nome_dia
        description: "Nome do dia da semana da despesa, em maiúsculas."
      - name: dia_ajustado
        description: "Dia da despesa dentro do ciclo da fatura."
      - name: dia_real
        description: "Dia do calendário em que a despesa aconteceu."
      - name: mercado
        description: '{{ doc("categoria_mercado") }}'
      - name: diversos
        description: '{{ doc("categoria_diversos") }}'
      - name: assinaturas
        description: '{{ doc("categoria_assinaturas") }}'
      - name: role
        description: '{{ doc("categoria_role") }}'
      - name: transporte
        description: '{{ doc("categoria_transporte") }}'
      - name: apartamento
        description: '{{ doc("categoria_apartamento") }}'
      - name: saude
        description: '{{ doc("categoria_saude") }}'
      - name: educacao
        description: '{{ doc("categoria_educacao") }}'
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: int_dre_consolidado
    description: >
      O resultado mensal de Lucas e Jéssica: quanto entrou, quanto saiu por categoria e o que
      sobrou, já com o ajuste de fechamento aplicado.
      {{ doc('ciclo_fatura') }}
    columns:
      - name: mes_fatura
        description: "Primeiro dia do mês da fatura de referência."
      - name: mes_debito
        description: "Primeiro dia do mês de débito/competência."
      - name: pessoa
        description: "Titular (deusa, jessica ou lucas)."
      - name: salario
        description: "Receita de salário no mês."
      - name: dividendos
        description: "Receita de dividendos no mês."
      - name: outros
        description: "Outras receitas no mês."
      - name: receita_total
        description: "Receita total do mês."
      - name: ajuste_realizado
        description: '{{ doc("ajuste") }}'
      - name: mercado
        description: '{{ doc("categoria_mercado") }}'
      - name: diversos
        description: '{{ doc("categoria_diversos") }}'
      - name: assinaturas
        description: '{{ doc("categoria_assinaturas") }}'
      - name: role
        description: '{{ doc("categoria_role") }}'
      - name: transporte
        description: '{{ doc("categoria_transporte") }}'
      - name: apartamento
        description: '{{ doc("categoria_apartamento") }}'
      - name: saude
        description: '{{ doc("categoria_saude") }}'
      - name: educacao
        description: '{{ doc("categoria_educacao") }}'
      - name: despesas_total
        description: "Despesa total do mês."
      - name: resultado
        description: "Resultado do mês (receita total menos despesa total)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."
