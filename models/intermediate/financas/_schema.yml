version: 2

models:

  - name: int_investimentos_consolidados
    description: >
      Uma linha por posição (mês, titular, instituição e ativo), unindo a trilha relatório e a trilha
      seed.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mes_base
              - pessoa
              - instituicao
              - codigo_ativo
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base."
      - name: pessoa
        description: "Titular (lucas, jessica ou deusa)."
      - name: instituicao
        description: "Corretora, banco ou custodiante, com nome padronizado."
      - name: emissor
        description: "Instituição emissora do título (só renda fixa)."
      - name: classe_ativo
        description: "Classe do ativo (RENDA FIXA, RENDA VARIAVEL ou DISPONIBILIDADE)."
      - name: tipo_ativo
        description: "Tipo do ativo (ACAO, FUNDO, TITULO PUBLICO, TITULO PRIVADO ou CONTA CORRENTE)."
      - name: codigo_ativo
        description: "Código do ativo na fonte (ticker B3, ISIN do Tesouro, CUSIP da Avenue ou código da seed)."
      - name: ativo
        description: "Nome do ativo."
      - name: indexador
        description: "Indexador de rentabilidade (só renda fixa)."
      - name: data_vencimento
        description: "Data de vencimento do título (só renda fixa)."
      - name: vencimento_em_dias
        description: "Dias até o vencimento; nulo se vencido ou sem vencimento."
      - name: fl_vencido
        description: "Indica se o título já venceu."
      - name: vlr_atualizado_brl
        description: "Valor de mercado da posição, em reais."
      - name: moeda_ativo
        description: "Moeda de origem do ativo (BRL, USD ou BTC)."
      - name: fonte_dado
        description: "Procedência da linha (RELATORIO B3, RELATORIO AVENUE ou SEED). {{ doc('fonte_dado') }}"
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

