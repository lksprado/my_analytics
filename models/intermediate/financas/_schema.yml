      - name: instituicao
        description: "Corretora, banco ou custodiante da posição, com nome padronizado."
      - name: classe_ativo
        description: "Classe do ativo (RENDA FIXA, RENDA VARIAVEL ou DISPONIBILIDADE)."
      - name: tipo_ativo
        description: "Tipo do ativo (ACAO, FUNDO, TITULO PUBLICO, TITULO PRIVADO ou CONTA CORRENTE)."
      - name: codigo_ativo
        description: "Código do ativo na fonte (ticker B3, ISIN do tesouro, CUSIP da Avenue ou código da seed)."
      - name: ativo
