  - name: int_indexadores
    description: >
      Os indexadores macroeconômicos mensais que servem de referência de comparação para o
      patrimônio: inflação pessoal, IPCA, IGP-M, Selic e CDI, na taxa do mês e no índice acumulado.
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base de referência."
      - name: minha_inflacao
        description: "Inflação pessoal do mês, em fração decimal."
