  - name: int_planilha_investimentos_selecionados
    description: >
      Saldos de investimento declarados na planilha do casal e na de Deusa, uma linha por mês e uma
      coluna por pessoa e instituição.
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base."
      - name: bradesco_investimentos_lucas
        description: "Saldo em investimentos Bradesco (Lucas), em reais."
      - name: nubank_investimentos_lucas
        description: "Saldo em investimentos Nubank (Lucas), em reais."
      - name: avenue_lucas
        description: "Saldo na Avenue (Lucas), em reais."
      - name: daycoval_lucas
        description: "Saldo em investimentos Daycoval (Lucas), em reais."
      - name: sofisa_investimentos_jessica
        description: "Saldo em investimentos Sofisa (Jéssica), em reais."
      - name: itau_investimentos_jessica
        description: "Saldo em investimentos Itaú (Jéssica), em reais."
      - name: nubank_investimentos_jessica
        description: "Saldo em investimentos Nubank (Jéssica), em reais."
      - name: avenue_jessica
        description: "Saldo na Avenue (Jéssica), em reais."
      - name: bradesco_investimentos_deusa
        description: "Saldo em investimentos Bradesco (Deusa), em reais."
      - name: banco_brasil_investimentos_deusa
        description: "Saldo em investimentos Banco do Brasil (Deusa), em reais."
      - name: nubank_investimentos_deusa
        description: "Saldo em investimentos Nubank (Deusa), em reais."
      - name: avenue_deusa
        description: "Saldo na Avenue (Deusa), em reais."
      - name: fonte_dado
        description: "Procedência da linha (GOOGLE SHEETS)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: int_planilha_investimentos_selecionados_alongados
    description: >
      Saldos de investimento declarados na planilha do casal e na de Deusa, uma linha por mês, pessoa e instituição.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mes_base
              - pessoa
              - instituicao
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base."
      - name: pessoa
        description: "Titular (lucas, jessica ou deusa)."
      - name: instituicao
        description: "Corretora, banco ou custodiante, com nome padronizado."
      - name: vlr_declarado_brl
        description: "Saldo declarado na planilha, em reais."
      - name: fonte_dado
        description: "Procedência da linha (GOOGLE SHEETS)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: int_dividendos
    description: >
      Renda passiva por titular e mês: proventos da B3, exceto juros, e dividendos da Avenue.
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base."
      - name: pessoa
        description: "Titular (lucas, jessica ou deusa)."
      - name: instituicao
        description: "Corretora, banco ou custodiante, com nome padronizado."
      - name: vlr_liquido_brl
        description: "Proventos líquidos recebidos no mês, em reais."
      - name: moeda_ativo
        description: "Moeda de origem do ativo (BRL, USD ou BTC)."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: int_indexadores
    description: >
      Indexadores mensais (inflação pessoal, IPCA, IGP-M, Selic e CDI), com a taxa do mês e o índice
      acumulado.
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base."
      - name: minha_inflacao
        description: "Inflação pessoal do mês (cesta própria), em fração decimal."
      - name: ipca
        description: "IPCA do mês, em fração decimal."
      - name: igpm
        description: "IGP-M do mês, em fração decimal."
      - name: selic
        description: "Selic do mês, em fração decimal."
      - name: cdi
        description: "CDI do mês, em fração decimal."
      - name: minha_inflacao_acum
        description: "Índice acumulado (base 1) da inflação pessoal."
      - name: ipca_acum
        description: "Índice acumulado (base 1) do IPCA."
      - name: igpm_acum
        description: "Índice acumulado (base 1) do IGP-M."
      - name: selic_acum
        description: "Índice acumulado (base 1) da Selic."
      - name: cdi_acum
        description: "Índice acumulado (base 1) do CDI."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: int_consumo_consolidado
    description: >
      Uma linha por despesa de Lucas e Jéssica, na data do lançamento, com o valor na coluna da
      categoria.
    columns:
      - name: mes_fatura
        description: "Primeiro dia do mês da fatura."
      - name: mes_debito
        description: >
          Primeiro dia do mês de competência.
          {{ doc('ciclo_fatura') }}
      - name: pessoa
        description: "Titular (lucas ou jessica)."
      - name: data_debito
        description: "Data do lançamento da despesa."
      - name: nome_dia
        description: "Nome do dia da semana, em maiúsculas."
      - name: dia_ajustado
        description: "Dia dentro do ciclo de fatura."
      - name: dia_real
        description: "Dia real do calendário."
      - name: mercado
        description: '{{ doc("categoria_mercado") }}'
      - name: diversos
        description: '{{ doc("categoria_diversos") }}'
      - name: assinaturas
        description: '{{ doc("categoria_assinaturas") }}'
      - name: role
        description: '{{ doc("categoria_role") }}'
      - name: transporte
        description: '{{ doc("categoria_transporte") }}'
      - name: apartamento
        description: '{{ doc("categoria_apartamento") }}'
      - name: saude
        description: '{{ doc("categoria_saude") }}'
      - name: educacao
        description: '{{ doc("categoria_educacao") }}'
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: int_dre_consolidado
    description: >
      Resultado mensal por titular (Lucas e Jéssica): receita por origem, despesa por categoria, ajuste
      e resultado.
    columns:
      - name: mes_fatura
        description: "Primeiro dia do mês da fatura."
      - name: mes_debito
        description: >
          Primeiro dia do mês de competência.
          {{ doc('ciclo_fatura') }}
      - name: pessoa
        description: "Titular (lucas ou jessica)."
      - name: salario
        description: "Receita de salário no mês, em reais."
      - name: dividendos
        description: "Receita de dividendos no mês, em reais."
      - name: outros
        description: "Outras receitas no mês, em reais."
      - name: receita_total
        description: "Receita total do mês, em reais."
      - name: ajuste_realizado
        description: '{{ doc("ajuste") }}'
      - name: mercado
        description: '{{ doc("categoria_mercado") }}'
      - name: diversos
        description: '{{ doc("categoria_diversos") }}'
      - name: assinaturas
        description: '{{ doc("categoria_assinaturas") }}'
      - name: role
        description: '{{ doc("categoria_role") }}'
      - name: transporte
        description: '{{ doc("categoria_transporte") }}'
      - name: apartamento
        description: '{{ doc("categoria_apartamento") }}'
      - name: saude
        description: '{{ doc("categoria_saude") }}'
      - name: educacao
        description: '{{ doc("categoria_educacao") }}'
      - name: despesas_total
        description: "Despesa total do mês, em reais."
      - name: resultado
        description: "Receita total menos despesa total do mês, em reais."
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."
