version: 2

models:

  - name: int_investimentos_consolidados
    description: >
      Ponto único de consolidação da carteira: uma linha por posição de Lucas, Jéssica e Deusa por mês,
      unindo a trilha relatório e a trilha seed.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mes_base
              - pessoa
              - instituicao
              - codigo_ativo
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base da posição."
      - name: pessoa
        description: "Titular (deusa, jessica ou lucas)."
      - name: instituicao
        description: "Corretora, banco ou custodiante da posição, com nome padronizado."
      - name: emissor
        description: "Instituição emissora do título."
      - name: classe_ativo
        description: "Classe do ativo (RENDA FIXA, RENDA VARIAVEL ou DISPONIBILIDADE)."
      - name: tipo_ativo
        description: "Tipo do ativo (ACAO, FUNDO, TITULO PUBLICO, TITULO PRIVADO ou CONTA CORRENTE)."
      - name: codigo_ativo
        description: "Código do ativo na fonte (ticker B3, ISIN do tesouro, CUSIP da Avenue ou código da seed)."
      - name: ativo
        description: "Nome do ativo."
      - name: indexador
        description: "Indexador de rentabilidade do título."
      - name: data_vencimento
        description: "Data de vencimento do título."
      - name: vencimento_em_dias
        description: "Dias restantes até o vencimento; nulo se já vencido ou sem vencimento."
      - name: fl_vencido
        description: "Indica se o título já venceu."
      - name: vlr_atualizado_brl
        description: "Valor atualizado da posição, em reais."
      - name: moeda_ativo
        description: "Moeda de origem do ativo."
      - name: fonte_dado
        description: "Procedência da linha (RELATORIO B3, RELATORIO AVENUE ou SEED). {{ doc('fonte_dado') }}"
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

  - name: int_relatorio_unificado
    description: >
      Trilha relatório: todas as posições extraídas dos relatórios da B3 e da Avenue (renda fixa, renda
      variável e caixa), sem planilha nem seed. Uma linha por posição, pessoa e mês.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - mes_base
              - pessoa
              - instituicao
              - codigo_ativo
    columns:
      - name: mes_base
        description: "Primeiro dia do mês-base da posição."
      - name: pessoa
        description: "Titular (deusa, jessica ou lucas)."
      - name: instituicao
        description: "Corretora, banco ou custodiante da posição, com nome padronizado."
      - name: emissor
        description: "Instituição emissora do título."
      - name: classe_ativo
        description: "Classe do ativo (RENDA FIXA, RENDA VARIAVEL ou DISPONIBILIDADE)."
      - name: tipo_ativo
        description: "Tipo do ativo (ACAO, FUNDO, TITULO PUBLICO, TITULO PRIVADO ou CONTA CORRENTE)."
      - name: codigo_ativo
        description: "Código do ativo na fonte (ticker B3, ISIN do tesouro, CUSIP da Avenue ou código da seed)."
      - name: ativo
        description: "Nome do ativo."
      - name: indexador
        description: "Indexador de rentabilidade do título."
      - name: data_vencimento
        description: "Data de vencimento do título."
      - name: vencimento_em_dias
        description: "Dias restantes até o vencimento; nulo se já vencido ou sem vencimento."
      - name: fl_vencido
        description: "Indica se o título já venceu."
      - name: vlr_atualizado_brl
        description: "Valor atualizado da posição, em reais."
      - name: moeda_ativo
        description: "Moeda de origem do ativo."
      - name: fonte_dado
        description: "Procedência da linha (RELATORIO B3 ou RELATORIO AVENUE). {{ doc('fonte_dado') }}"
      - name: model_run_at
        description: "Início do dbt run que materializou o modelo."

