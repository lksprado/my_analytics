      - name: codigo_ativo
        description: "Código do ativo na fonte (ticker B3, ISIN do Tesouro, CUSIP da Avenue ou código da seed)."
      - name: ativo
        description: "Nome do ativo."
      - name: indexador
        description: "Indexador de rentabilidade (só renda fixa)."
      - name: data_vencimento
        description: "Data de vencimento do título (só renda fixa)."
      - name: vencimento_em_dias
        description: "Dias até o vencimento; nulo se vencido ou sem vencimento."
      - name: fl_vencido
        description: "Indica se o título já venceu."
      - name: vlr_atualizado_brl
