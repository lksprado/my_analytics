# Instale uma vez por clone: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # main é produção: toda mudança entra por branch + PR. A proteção de
      # verdade é a do GitHub; este hook só avisa antes do commit.
      - id: no-commit-to-branch
        args: [--branch, main]

  # A v1.2.1 não tem hook de parse e o docs generate --no-compile não regrava o manifest.json.
  - repo: local
    hooks:
      - id: dbt-parse
        name: dbt parse
        entry: dbt parse
        language: python
        additional_dependencies: ["dbt-core==1.11.2", "dbt-postgres==1.10.0"]
        pass_filenames: false

  # check-model-has-all-columns compara o YAML com o banco, não com o SQL:
  # mudou coluna, rode `dbt run -s <modelo>` antes de commitar.
  - repo: https://github.com/dbt-checkpoint/dbt-checkpoint
    rev: v1.2.1
    hooks:
      # O ambiente do hook não herda o .venv; sem isto o commit fora dele falha com "dbt: not found".
      - id: dbt-docs-generate
        args: ["--cmd-flags", "++no-compile"]
        additional_dependencies: ["dbt-core==1.11.2", "dbt-postgres==1.10.0"]
      - id: check-script-semicolon
        files: ^(models|macros|tests|analyses|snapshots)/
      - id: check-model-has-all-columns
        files: ^models/marts/
      - id: check-model-columns-have-desc
        files: ^models/marts/
