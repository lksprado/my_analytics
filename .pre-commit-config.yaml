# Instale uma vez por clone: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # main é produção: toda mudança entra por branch + PR. A proteção de
      # verdade é a do GitHub; este hook só avisa antes do commit.
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/dbt-checkpoint/dbt-checkpoint
    rev: v1.2.1
    hooks:
      - id: dbt-parse
      - id: dbt-docs-generate
        args: ["--cmd-flags", "++no-compile"]
      - id: check-script-semicolon
      - id: check-script-has-no-table-name
      - id: check-model-has-all-columns
        name: Check columns - core
        files: ^models/core
      - id: check-model-has-all-columns
        name: Check columns - mart
        files: ^models/mart
      - id: check-model-columns-have-desc
        files: ^models/mart